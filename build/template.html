<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client Standings &mdash; Laney Media</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebe9e3">
<meta name="description" content="Head-to-head standings for every client video in the CONVERTS&trade; system, overall and by content division.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500&family=Archivo:wght@400;500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/awesome-serif-light.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ==================================================================
   AWESOME SERIF
   The brand serif, self hosted so it loads from the same origin as
   the page. Light and Light Italic are the two cuts in use, which is
   why every heading sits at weight 300.
   ================================================================== */
@font-face{
  font-family:"Awesome Serif";
  src:url("fonts/awesome-serif-light.woff2") format("woff2");
  font-weight:300;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"Awesome Serif";
  src:url("fonts/awesome-serif-light-italic.woff2") format("woff2");
  font-weight:300;font-style:italic;font-display:swap;
}

/* ==================================================================
   CLIENT STANDINGS
   Palette and type carried over from the CONVERTS asset library at
   assets.wearelaneymedia.com. Swap the tokens in :root and both
   properties move together.
   ================================================================== */
:root{
  /* ---- Laney Media brand palette, in the order of the swatch ----
     1  ink        darkest warm brown, carries text and every rule
     2  near-black the deepest cut, used where a panel needs weight
     3  brown      the mid brown
     4  accent     buttons and small accents
     5  cream      the page itself
     White stays white, so cards and panels lift off the cream.      */
  --ink:#241a15;
  --near-black:#130d09;
  --brown:#5c3d26;
  --accent:#453930;
  --cream:#ebe9e3;

  /* Tints of the ink, so hairlines and hovers stay in the same family
     rather than introducing a grey. */
  --hair:rgba(36,26,21,.16);
  --hair-strong:rgba(36,26,21,.32);
  --wash:rgba(69,57,48,.08);
  --wash-strong:rgba(69,57,48,.15);
  --muted:#6b5c52;

  --brass:var(--accent);
  --brass-dk:var(--accent);
  --brass-lt:#8a7263;
  --paper:var(--cream);
  --paper-2:#ffffff;

  /* Surfaces the board and the cards sit on. Depth comes from alpha
     on the five colours above, never from a new hue. */
  --panel:var(--paper-2);
  --panel-hover:#ffffff;
  --well:rgba(36,26,21,.035);
  --lead-veil:rgba(92,61,38,.10);
  --sel-bg:var(--accent);
  --sel-fg:var(--cream);
  --bar-track:rgba(36,26,21,.10);
  --bar-fill:var(--brown);

  --termina:"Jost",system-ui,sans-serif;
  --narrow:"Archivo Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,sans-serif;
  --display:"Awesome Serif","Iowan Old Style",Georgia,serif;

  --ease:cubic-bezier(.22,.61,.36,1);
  --pad:clamp(1.25rem,4vw,4rem);
  --maxw:1320px;
  --header-h:68px;
}

/* DARK — black ground, white type, no warm tint. The panels sit at the
   same black as the page, so the 1px hairline grid does the drawing and
   every edge stays a clean line rather than a soft grey block. Opt in
   from the header control; the cream page is the default so the
   standings open looking like the rest of the system. */
:root[data-theme="dark"]{
  --ink:#ffffff;
  --cream:#000000;
  --muted:#8f8f8f;
  --hair:rgba(255,255,255,.20);
  --hair-strong:rgba(255,255,255,.40);
  --wash:rgba(255,255,255,.05);
  --wash-strong:rgba(255,255,255,.10);
  --brass-dk:#d8d8d8;
  --brass:#ffffff;
  --paper-2:#000000;
  --panel:#000000;
  --panel-hover:#0b0b0b;
  --well:rgba(255,255,255,.05);
  --lead-veil:rgba(255,255,255,.07);
  --sel-bg:#ffffff;
  --sel-fg:#000000;
  --bar-track:rgba(255,255,255,.16);
  --bar-fill:#ffffff;
}
/* The remaining brand browns are light-theme values, so the dark page
   swaps each one for white rather than letting a brown sit on black. */
:root[data-theme="dark"] .site-header{background:#000;backdrop-filter:none}
:root[data-theme="dark"] .m1{background:#fff;color:#000}
:root[data-theme="dark"] .m3{color:var(--muted)}
:root[data-theme="dark"] .pod.g1::before{background:#fff}
:root[data-theme="dark"] .pod.g2::before{background:var(--hair-strong)}
:root[data-theme="dark"] .row.lead .rank,
:root[data-theme="dark"] .crow.lead .rank{color:#fff}
:root[data-theme="dark"] .hookbox{border-left-color:#fff}
:root[data-theme="dark"] .otag.hot{color:#fff;border-bottom-color:#fff}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:14px;line-height:1.85;letter-spacing:.015em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img,video,iframe,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:400}
button,input,select{font-family:inherit}
:focus-visible{outline:1px solid var(--brass-dk);outline-offset:3px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- type utilities ---------- */
.t-eyebrow{font-family:var(--termina);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.22em;line-height:1.6;color:var(--brass-dk)}
.t-label{font-family:var(--narrow);text-transform:uppercase;font-size:12px;letter-spacing:.13em;color:var(--muted)}
.t-display{font-family:var(--display);font-weight:300;line-height:1.05;letter-spacing:-.01em}

/* ---------- shell ---------- */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}

.site-header{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--cream) 93%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);
}
.site-header-inner{display:flex;align-items:center;justify-content:space-between;gap:2rem;height:var(--header-h)}
.wordmark{display:flex;align-items:baseline;gap:.55rem}
.wordmark-main{font-family:var(--termina);font-weight:600;text-transform:uppercase;letter-spacing:.2em;font-size:13px}
/* The wordmark is letter-spaced, which would otherwise fling the
   trademark a long way off the final S. */
.tm{font-size:.92em;letter-spacing:0;margin-left:-.08em}
.wordmark-sub{font-family:var(--display);font-weight:300;font-style:italic;font-size:21px;line-height:1;color:var(--brass-dk)}
.nav{display:flex;gap:1.75rem;align-items:center}
.nav a,.nav button{
  font-family:var(--narrow);text-transform:uppercase;font-size:12px;letter-spacing:.13em;
  color:var(--muted);padding:0 0 2px;background:none;border:0;border-bottom:1px solid transparent;
  cursor:pointer;transition:color .2s var(--ease),border-color .2s var(--ease);
}
.nav a:hover,.nav a.active,.nav button:hover{color:var(--ink);border-color:var(--brass)}
@media(max-width:720px){.nav{gap:1rem}.nav .nav-hide{display:none}}

/* ---------- hero ---------- */
.hero{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--cream)}
.hero-inner{
  padding-top:clamp(2.5rem,5vw,4.5rem);padding-bottom:clamp(2.25rem,4vw,3.25rem);
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.5rem 2.5rem;
}
.hero-brand{max-width:760px}
.hero h1{font-family:var(--display);font-weight:300;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.01em;margin:.75rem 0 1.1rem;text-wrap:balance}
.hero h1 em{font-style:italic;margin-right:.12em}
.hero p{margin:0;max-width:56ch;color:var(--muted);font-size:15px}
.hero p b{color:var(--ink);font-weight:500}

/* ---------- window toggle ---------- */
.winbar{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;margin-top:2.25rem}
.segmented{display:inline-flex;border:1px solid var(--hair-strong);background:var(--paper-2)}
.segmented button{
  border:0;border-right:1px solid var(--hair);background:transparent;color:var(--muted);
  padding:.7rem 1.2rem;font-family:var(--narrow);text-transform:uppercase;font-size:11.5px;letter-spacing:.12em;
  cursor:pointer;white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease);
}
.segmented button:last-child{border-right:0}
.segmented button:hover{color:var(--ink);background:var(--wash)}
.segmented button[aria-selected="true"]{background:var(--sel-bg);color:var(--sel-fg)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);margin-top:2.25rem}
.stat{background:var(--panel);padding:1.5rem 1.4rem}
.stat .k{font-family:var(--termina);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.19em;color:var(--brass-dk)}
.stat .v{font-family:var(--display);font-weight:300;font-size:40px;line-height:1.05;margin-top:.5rem}
.stat .v small{display:block;font-family:var(--narrow);text-transform:uppercase;font-size:11.5px;letter-spacing:.11em;color:var(--muted);margin-top:.35rem}

/* ---------- divisions ---------- */
.divbar{display:flex;width:fit-content;max-width:100%;overflow-x:auto;margin-top:1.75rem;border:1px solid var(--hair-strong);background:var(--paper-2);scrollbar-width:none}
.divbar::-webkit-scrollbar{display:none}
.divpill{
  flex:none;display:inline-flex;align-items:baseline;gap:.6rem;background:transparent;border:0;border-right:1px solid var(--hair);
  padding:.75rem 1.2rem;font-family:var(--narrow);text-transform:uppercase;font-size:11.5px;letter-spacing:.12em;
  color:var(--muted);cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease);
}
.divpill:last-child{border-right:0}
.divpill:hover{background:var(--wash);color:var(--ink)}
.divpill[aria-selected="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.divpill .cnt{font-family:var(--narrow);font-size:11px;letter-spacing:.06em;color:var(--brass-dk)}
.divpill[aria-selected="true"] .cnt{color:var(--sel-fg);opacity:.7}

/* ---------- section label ---------- */
.section-label{display:flex;align-items:center;gap:.8rem;margin:3.25rem 0 1.4rem}
.section-label h2{
  font-family:var(--termina);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.19em;
  color:var(--brass-dk);display:flex;align-items:center;gap:.6rem;white-space:nowrap;
}
.section-label h2 .scope{color:var(--muted)}
.section-label .line{flex:1;height:1px;background:var(--hair)}
.section-label .hint{font-family:var(--narrow);text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}

/* ---------- podium ---------- */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair)}
.pod{
  position:relative;background:var(--panel);padding:1.9rem 1.6rem 1.5rem;
  display:flex;flex-direction:column;gap:1.1rem;transition:background .25s var(--ease);
}
.pod:hover{background:var(--panel-hover)}
.pod::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:transparent}
.pod.g1::before{background:var(--brown)}
.pod.g2::before{background:var(--hair-strong)}
.pod.g3::before{background:var(--hair)}
.pod.g1{background:linear-gradient(180deg,var(--lead-veil),var(--panel) 62%)}
.pod .who{display:flex;align-items:center;gap:.85rem}
.medal{
  width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;
  font-family:var(--display);font-weight:300;font-size:20px;line-height:1;
}
.m1{background:var(--accent);color:var(--cream)}
.m2{background:transparent;color:var(--ink);border:1px solid var(--hair-strong)}
.m3{background:transparent;color:var(--muted);border:1px solid var(--hair)}
.pod .rankword{font-family:var(--termina);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.19em;color:var(--brass-dk)}
.pod .handle{font-family:var(--display);font-weight:300;font-size:25px;line-height:1.12;word-break:break-word}
.pod .bigviews{font-family:var(--display);font-weight:300;font-size:50px;line-height:1}
.pod .bigviews span{font-family:var(--narrow);text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-left:.6rem}
.pod .divtag{
  font-family:var(--narrow);text-transform:uppercase;font-size:10px;letter-spacing:.14em;color:var(--brass-dk);
  border:1px solid var(--hair-strong);padding:.15rem .55rem;align-self:flex-start;white-space:nowrap;
}
.pod .podtitle{margin:0;color:var(--muted);font-size:13px;line-height:1.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pod .podmeta{
  margin-top:auto;padding-top:1.15rem;border-top:1px solid var(--hair);
  display:flex;gap:1.75rem;flex-wrap:wrap;
}
.pod .pm{display:flex;flex-direction:column;gap:.15rem}
.pod .pm b{font-family:var(--display);font-weight:300;font-size:21px;line-height:1.2}
.pod .pm i{font-family:var(--narrow);font-style:normal;text-transform:uppercase;font-size:10.5px;letter-spacing:.12em;color:var(--muted)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin:3rem 0 1.5rem}
.tabs{display:inline-flex;border:1px solid var(--hair-strong);background:var(--paper-2)}
.tab{
  border:0;border-right:1px solid var(--hair);background:transparent;color:var(--muted);
  padding:.75rem 1.4rem;font-family:var(--narrow);text-transform:uppercase;font-size:11.5px;letter-spacing:.12em;
  cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease);
}
.tab:last-child{border-right:0}
.tab:hover{background:var(--wash);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.rightctl{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative}
.search-wrap input{
  width:100%;min-width:260px;border:1px solid var(--hair-strong);background:var(--paper-2);
  padding:.72rem 2.6rem .72rem 1rem;font-family:var(--body);font-size:14px;color:var(--ink);
  border-radius:0;outline:none;transition:border-color .2s var(--ease);
}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--brass)}
.search-wrap svg{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--brass-dk)}
.sortsel{display:inline-flex;align-items:center;gap:.65rem}
.sortsel label{font-family:var(--narrow);text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:var(--muted)}
select.srt{
  appearance:none;background:var(--paper-2);border:1px solid var(--hair-strong);color:var(--ink);
  padding:.72rem 2.2rem .72rem 1rem;font-family:var(--narrow);text-transform:uppercase;font-size:11.5px;letter-spacing:.12em;
  cursor:pointer;border-radius:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%23453930' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right .8rem center;
}
:root[data-theme="dark"] select.srt{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%23bda186' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
}

/* ---------- board ---------- */
.board{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--panel)}
.boardnote{font-family:var(--narrow);text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:var(--muted);padding:.8rem 1.25rem;background:var(--wash);border-bottom:1px solid var(--hair)}
.colhead{display:grid;grid-template-columns:56px 1fr 130px 100px 86px;gap:1rem;padding:0 1.25rem .7rem;align-items:center}
.colhead span{font-family:var(--narrow);text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.colhead .r{text-align:right}
.row{border-bottom:1px solid var(--hair);transition:background .2s var(--ease)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--wash)}
.row.lead{background:linear-gradient(90deg,var(--lead-veil),transparent 72%)}
.rowmain{display:grid;grid-template-columns:56px 1fr 130px 100px 86px;gap:1rem;align-items:center;padding:1.15rem 1.25rem;cursor:pointer;position:relative}
.rank{font-family:var(--display);font-weight:300;font-size:22px;color:var(--muted);text-align:center}
.rank.top3{color:var(--ink)}
.row.lead .rank{color:var(--brown)}
.vid{min-width:0}
.vid .h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.vid .handle{font-family:var(--display);font-weight:300;font-size:20px;line-height:1.2}
.beltchip{display:inline-flex;align-items:center;line-height:1}
.fmt{font-family:var(--narrow);text-transform:uppercase;font-size:10px;letter-spacing:.14em;color:var(--brass-dk);border:1px solid var(--hair-strong);padding:.15rem .5rem;white-space:nowrap}
.vid .t{font-size:13px;color:var(--muted);margin-top:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.7}
.views-cell{text-align:right}
.views-cell b{font-family:var(--display);font-weight:300;font-size:25px}
.barwrap{height:2px;background:var(--bar-track);margin-top:.6rem;overflow:hidden}
.barfill{height:100%;background:var(--bar-fill)}
.metric{text-align:right}
.metric.big{font-family:var(--display);font-weight:300;font-size:20px}
.metric.sm{font-family:var(--body);font-size:14px;color:var(--muted)}
.metric .lab{display:block;font-family:var(--narrow);text-transform:uppercase;font-size:10px;letter-spacing:.12em;color:var(--muted);margin-top:.2rem}
.otag{display:inline-block}
.otag.hot{color:var(--brown);border-bottom:1px solid var(--brown)}
.chev{position:absolute;right:1rem;bottom:.8rem;color:var(--muted);transition:transform .3s var(--ease);display:none}

/* ---------- row detail ---------- */
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.row.open .detail{grid-template-rows:1fr}
.detail-inner{overflow:hidden;min-height:0}
.row.open{background:var(--wash)}
.dpad{padding:.2rem 1.25rem 2rem}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.75rem 2rem;margin-top:1.1rem}
@media(max-width:640px){.dgrid{grid-template-columns:1fr}}
.block{min-width:0}
.block .blab{
  font-family:var(--termina);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.19em;
  color:var(--brass-dk);margin-bottom:.7rem;display:flex;align-items:center;gap:.6rem;
}
.block .blab::after{content:"";flex:1;height:1px;background:var(--hair)}
.block p{margin:0;font-size:13.5px;line-height:1.8}
.block p.empty{color:var(--muted);font-style:italic}
.hookbox{background:var(--well);border-left:2px solid var(--brown);padding:1.1rem 1.25rem}
.hookbox p{font-family:var(--display);font-weight:300;font-style:italic;font-size:19px;line-height:1.45}
.transcript{background:var(--well);border:1px solid var(--hair);padding:1.1rem 1.25rem;max-height:240px;overflow:auto}
.transcript p{font-size:13px;line-height:1.9;white-space:pre-wrap;color:var(--muted)}
.dmetrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair)}
.dm{background:var(--panel);padding:1rem 1.1rem}
.dm b{font-family:var(--display);font-weight:300;font-size:22px}
.dm i{display:block;font-family:var(--narrow);font-style:normal;text-transform:uppercase;font-size:10px;letter-spacing:.12em;color:var(--muted);margin-top:.15rem}
.dlinks{grid-column:1/-1;display:flex;gap:.9rem;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:.6rem;font-family:var(--termina);font-weight:600;
  text-transform:uppercase;font-size:11px;letter-spacing:.18em;padding:.95rem 1.7rem;
  border:1px solid var(--accent);background:var(--accent);color:var(--cream);cursor:pointer;
  transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
}
.btn:hover{background:var(--ink);border-color:var(--ink);color:var(--cream)}
:root[data-theme="dark"] .btn{background:var(--ink);border-color:var(--ink);color:var(--cream)}
:root[data-theme="dark"] .btn:hover{background:var(--brass);border-color:var(--brass);color:#000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair-strong)}
.btn.ghost:hover{background:var(--accent);color:var(--cream);border-color:var(--accent)}
:root[data-theme="dark"] .btn.ghost{color:var(--ink);background:transparent}
:root[data-theme="dark"] .btn.ghost:hover{background:var(--brass);border-color:var(--brass);color:#000}
.triggers{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem}
.trg{font-family:var(--narrow);text-transform:uppercase;font-size:10px;letter-spacing:.14em;color:var(--brass-dk);border:1px solid var(--hair-strong);padding:.15rem .55rem}

/* ---------- empty ---------- */
.empty-state{text-align:center;padding:4rem 1.5rem;background:var(--panel);border:1px solid var(--hair)}
.empty-state .eyebrow{font-family:var(--termina);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.19em;color:var(--brass-dk)}
.empty-state h3{font-family:var(--display);font-weight:300;font-size:28px;line-height:1.1;margin:.6rem 0 .5rem}
.empty-state p{margin:0 auto;max-width:46ch;color:var(--muted);font-size:14px}

/* ---------- creators ---------- */
.crcap{color:var(--muted);font-size:13.5px;line-height:1.8;margin-bottom:1.25rem;max-width:70ch}
.crcap b{color:var(--ink);font-weight:500}
.beltkey{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);margin:0 0 2rem;overflow-x:auto}
.beltkey .bk{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;min-width:66px;background:var(--panel);padding:1.1rem .5rem}
.beltkey .bkt b{display:block;font-family:var(--narrow);text-transform:uppercase;font-size:11px;letter-spacing:.12em;line-height:1.3}
.beltkey .bkt span{font-family:var(--narrow);font-size:11px;letter-spacing:.06em;color:var(--muted)}
@media(max-width:640px){.beltkey{grid-template-columns:repeat(9,minmax(64px,1fr))}}
.creators{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);background:var(--panel)}
.crow{display:grid;grid-template-columns:56px 1fr 130px 76px;gap:1rem;align-items:center;border-bottom:1px solid var(--hair);padding:1.15rem 1.25rem;transition:background .2s var(--ease)}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--wash)}
.crow.lead{background:linear-gradient(90deg,var(--lead-veil),transparent 72%)}
.crow .cviews b{font-family:var(--display);font-weight:300;font-size:25px}
.cwrap{display:flex;align-items:center;gap:.9rem;min-width:0}
.cbelt{flex:none;width:40px;display:grid;place-items:center}
.cmeta{min-width:0}
.cmeta .handle{font-family:var(--display);font-weight:300;font-size:21px;line-height:1.2}
.cmeta .csub{font-family:var(--narrow);text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:.15rem}
.cmeta .csub b{color:var(--ink);font-weight:500}
@media(max-width:680px){.crow{grid-template-columns:40px 1fr auto;row-gap:.5rem}.crow .c-hide{display:none}}

/* ---------- footer ---------- */
.site-footer{border-top:1px solid var(--hair);margin-top:6rem;padding:2.5rem 0 4rem}
.site-footer .shell{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.site-footer .meta{display:flex;flex-wrap:wrap;gap:.35rem 1.5rem}

.page{padding-bottom:1rem}

@media(max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .podium{grid-template-columns:1fr}
  .colhead{display:none}
  .rowmain{grid-template-columns:44px 1fr auto;gap:.75rem;row-gap:.5rem;padding-bottom:1.75rem}
  .rowmain .metric.big,.rowmain .metric.sm{display:none}
  .views-cell{grid-column:3}
  .chev{display:block}
  .vid .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .search-wrap input{min-width:0}
  .rightctl{width:100%}
  .search-wrap{flex:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<style>
/* When this page is framed inside the asset library, that site supplies
   the header and the navigation, so this one stands down to avoid two
   stacked headers. Standalone it is untouched. */
html.is-embedded .site-header { display: none; }
html.is-embedded main, html.is-embedded body { padding-top: 0; }
</style>
<script>
  if (window.top !== window.self) document.documentElement.classList.add("is-embedded");
</script>
</head>
<body>

<header class="site-header">
  <div class="shell site-header-inner">
    <a class="wordmark" href="https://assets.wearelaneymedia.com">
      <span class="wordmark-main">Converts<span class="tm">&trade;</span></span>
      <span class="wordmark-sub">Standings</span>
    </a>
    <nav class="nav">
      <a class="nav-hide" href="https://assets.wearelaneymedia.com">Asset Library</a>
      <a class="active" href="#">Standings</a>
      <button id="themeBtn" type="button" aria-label="Toggle colour theme"><span id="themeLabel">Dark</span></button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="shell hero-inner">
    <div class="hero-brand">
      <div class="t-eyebrow">CONVERTS&trade; System &middot; Client Standings</div>
      <h1>The <em>Creator</em> Leaderboard</h1>
      <p id="sub"></p>
    </div>
  </div>
</section>

<main class="shell page">

  <div class="winbar">
    <span class="t-label">Time window</span>
    <div class="segmented" id="winToggle" role="tablist" aria-label="Time window">
      <button role="tab" data-days="7">7 days</button>
      <button role="tab" data-days="30">30 days</button>
      <button role="tab" data-days="90">90 days</button>
      <button role="tab" data-days="365">365 days</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="divbar" id="divbar" role="tablist" aria-label="Divisions"></div>

  <div class="section-label">
    <h2>On the Podium <span class="scope" id="podScope"></span></h2><div class="line"></div>
    <span class="hint">Ranked by views</span>
  </div>
  <div id="podium"></div>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Leaderboard view">
      <button class="tab" role="tab" id="tab-videos" aria-selected="true" data-view="videos">Top Videos</button>
      <button class="tab" role="tab" id="tab-creators" aria-selected="false" data-view="creators">Creator Standings</button>
    </div>
    <div class="rightctl">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search handle or hook" aria-label="Search videos">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </div>
      <div class="sortsel">
        <label for="sort">Sort</label>
        <select class="srt" id="sort" aria-label="Sort by">
          <option value="views">Views</option>
          <option value="outlier">Outlier Score</option>
          <option value="comments">Comments</option>
          <option value="likes">Likes</option>
        </select>
      </div>
    </div>
  </div>

  <div id="videosView"><div id="board" class="board"></div></div>
  <div id="creatorsView" hidden><div id="creators"></div></div>

</main>

<footer class="site-footer">
  <div class="shell">
    <span class="t-label">Laney Media</span>
    <span class="t-label meta">
      <span>Data: CONVERTS&trade; Client Data &middot; <span id="period"></span></span>
      <span id="snapshot"></span>
    </span>
  </div>
</footer>

<script>
const DATA = __DATA__;
const CREATOR_TOTALS = __CREATOR_TOTALS__; // {handle:[lifetimeViews, videoCount]} — all-time, ignores window
const SNAPSHOT_DATE = "__SNAPDATE__";
const _SI = "__SNAPSHOT_ISO__".split("-").map(Number);
const SNAP = new Date(_SI[0], _SI[1]-1, _SI[2]);

/* ---------- Belt ranks: earned by LIFETIME total views ---------- */
const BELTS = [
  {n:1,name:"White",  req:0,        c1:"#FFFFFF",c2:"#E2E6EC"},
  {n:2,name:"Yellow", req:10000,    c1:"#F6D451",c2:"#E3B308"},
  {n:3,name:"Orange", req:50000,    c1:"#F7A85C",c2:"#E27C1C"},
  {n:4,name:"Green",  req:100000,   c1:"#5BC066",c2:"#2E9E3C"},
  {n:5,name:"Blue",   req:300000,   c1:"#4F97DE",c2:"#2E6FB6"},
  {n:6,name:"Purple", req:750000,   c1:"#9C74D8",c2:"#6E45B0"},
  {n:7,name:"Brown",  req:2000000,  c1:"#9C6238",c2:"#6E4423"},
  {n:8,name:"Red",    req:5000000,  c1:"#D44C3D",c2:"#A62B20"},
  {n:9,name:"Black",  req:10000000, c1:"#33333A",c2:"#131318"},
];
const beltOf = v => { let b=BELTS[0]; for(const x of BELTS) if(v>=x.req) b=x; return b; };
function beltSVG(lv,size){
  const L=BELTS[lv-1], g="be"+lv+"_"+size;
  const stroke = lv===1 ? "rgba(120,130,145,.6)" : "rgba(0,0,0,.22)";
  const glow = lv===9 ? `<rect x="1.2" y="13.6" width="45.6" height="13.4" rx="4" fill="none" stroke="#F2C14E" stroke-width="1.1" opacity=".55"/>`:"";
  const dan  = lv===9 ? `<rect x="26" y="27" width="3.8" height="11.5" rx="1.2" fill="#F2C14E"/>`:"";
  return `<svg width="${size}" height="${Math.round(size*0.82)}" viewBox="0 0 48 40" aria-hidden="true">
   <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${L.c1}"/><stop offset="1" stop-color="${L.c2}"/></linearGradient></defs>
   ${glow}
   <rect x="2" y="15.5" width="21.5" height="10" rx="2.6" fill="url(#${g})" stroke="${stroke}" stroke-width="1"/>
   <rect x="24.5" y="15.5" width="21.5" height="10" rx="2.6" fill="url(#${g})" stroke="${stroke}" stroke-width="1"/>
   <rect x="18.6" y="26" width="4.7" height="12.5" rx="1.4" fill="url(#${g})" stroke="${stroke}" stroke-width="1"/>
   <rect x="24.7" y="26" width="4.7" height="12.5" rx="1.4" fill="url(#${g})" stroke="${stroke}" stroke-width="1"/>
   ${dan}
   <rect x="17.4" y="12.6" width="13.2" height="16" rx="3" fill="${L.c2}" stroke="${stroke}" stroke-width="1"/>
   <rect x="17.4" y="12.6" width="13.2" height="7.5" rx="3" fill="${L.c1}" opacity=".45"/></svg>`;
}

const DIVISIONS = [
  {id:"all",          label:"All Divisions"},
  {id:"broll",        label:"B-Roll"},
  {id:"talking_head", label:"Talking Head"},
  {id:"green_screen", label:"Green Screen"},
  {id:"reaction",     label:"Reaction"},
  {id:"carousel",     label:"Carousel"},
];
const DIV_LABEL = Object.fromEntries(DIVISIONS.map(d=>[d.id,d.label]));

const $ = s => document.querySelector(s);
const nf = n => (n==null?"—":n.toLocaleString("en-US"));
const compact = n => { if(n==null) return "—"; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+"M"; if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1)+"K"; return String(n); };
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtOutlier = o => o>=100? Math.round(o).toLocaleString() : o>=10? o.toFixed(1) : o.toFixed(2);
const fmtDate = d => { const [y,m,day]=d.split("-"); return new Date(y,m-1,day).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
const daysAgo = d => { const [y,m,day]=d.split("-").map(Number); return (SNAP-new Date(y,m-1,day))/86400000; };

let state = { view:"videos", sort:"views", q:"", division:"all", days:30 };
const maxViewsAll = Math.max(...DATA.map(d=>d.views));

const inWindow = d => daysAgo(d.posted) <= state.days + 0.5;
const inDivision = d => state.division==="all" || d.division===state.division;
function currentPool(){ return DATA.filter(d=>inWindow(d)&&inDivision(d)); }
function rankPool(pool){ pool.slice().sort((a,b)=>b.views-a.views).forEach((d,i)=>d._rank=i+1); }

/* ---------- header ---------- */
function windowLabel(){ return state.days===365?"last 365 days":`last ${state.days} days`; }
function renderHeaderStatic(){
  const champ = DATA.slice().sort((a,b)=>b.views-a.views)[0];
  $("#sub").innerHTML = `Head-to-head standings for every client video, overall and by content division. Filter the window, pick a division, and climb. <b>Take the crown.</b>`;
  $("#snapshot").textContent = "Snapshot: "+SNAPSHOT_DATE;
}
function renderStats(pool){
  const creators = new Set(pool.map(d=>d.handle)).size;
  const totalViews = pool.reduce((a,d)=>a+d.views,0);
  const champ = pool.slice().sort((a,b)=>b.views-a.views)[0];
  const stats = [
    {k:"Videos in play", v:pool.length},
    {k:"Creators competing", v:creators},
    {k:"Combined views", v:compact(totalViews)},
    {k:(state.division==="all"?"Top score":DIV_LABEL[state.division]+" #1"), v:champ?compact(champ.views):"—", s:champ?"@"+champ.handle:""},
  ];
  $("#stats").innerHTML = stats.map(s=>`<div class="stat"><div class="k">${s.k}</div><div class="v tnum">${s.v}${s.s?` <small>${esc(s.s)}</small>`:""}</div></div>`).join("");
  const dates = pool.map(d=>d.posted).sort();
  $("#period").textContent = dates.length? (fmtDate(dates[0])+" to "+fmtDate(dates[dates.length-1])) : windowLabel();
}

/* ---------- division bar ---------- */
function renderDivbar(){
  const winPool = DATA.filter(inWindow);
  const counts = {};
  winPool.forEach(d=>counts[d.division]=(counts[d.division]||0)+1);
  const extra = [...new Set(winPool.map(d=>d.division))].filter(id=>!DIV_LABEL[id]); // e.g. "other"
  const divs = extra.length? DIVISIONS.concat(extra.map(id=>({id,label:id[0].toUpperCase()+id.slice(1)}))) : DIVISIONS;
  $("#divbar").innerHTML = divs.map(dv=>{
    const c = dv.id==="all"? winPool.length : (counts[dv.id]||0);
    const sel = state.division===dv.id;
    return `<button class="divpill" role="tab" aria-selected="${sel}" data-div="${dv.id}">${esc(dv.label)}<span class="cnt tnum">${c}</span></button>`;
  }).join("");
  document.querySelectorAll(".divpill").forEach(p=>p.addEventListener("click",()=>{ state.division=p.dataset.div; renderAll(); }));
}

/* ---------- podium ---------- */
function renderPodium(pool){
  $("#podScope").textContent = (state.division==="all"?"Overall":DIV_LABEL[state.division])+" · "+windowLabel();
  const top = pool.slice().sort((a,b)=>b.views-a.views).slice(0,3);
  if(!top.length){
    $("#podium").innerHTML = `<div class="empty-state"><div class="eyebrow">Open division</div><h3>No entries yet</h3><p>First creator to post ${state.division==="all"?"":`a ${DIV_LABEL[state.division]} video `}in the ${windowLabel()} claims the crown.</p></div>`;
    return;
  }
  $("#podium").innerHTML = `<div class="podium">`+top.map((d,i)=>{
    const rankword=["Champion","Runner-up","Third place"][i];
    return `<div class="pod g${i+1}">
      <div class="who"><div class="medal m${i+1}">${i+1}</div>
        <div><div class="rankword">${rankword}</div><div class="handle">@${esc(d.handle)}</div></div></div>
      <div class="bigviews tnum">${nf(d.views)}<span>views</span></div>
      ${state.division==="all"?`<div class="divtag">${esc(DIV_LABEL[d.division]||d.division)}</div>`:''}
      <p class="podtitle">${esc(d.title)||"—"}</p>
      <div class="podmeta">
        <div class="pm"><b class="tnum">${fmtOutlier(d.outlier)}×</b><i>Outlier</i></div>
        <div class="pm"><b class="tnum">${nf(d.comments)}</b><i>Comments</i></div>
        <div class="pm"><b class="tnum">${nf(d.likes)}</b><i>Likes</i></div>
      </div></div>`;
  }).join("")+`</div>`;
}

/* ---------- videos board ---------- */
function triggerTags(t){ if(!t||!t.length) return ""; return `<div class="triggers">${t.map(x=>`<span class="trg">${esc(x)}</span>`).join("")}</div>`; }
function beltChip(handle){
  const t=CREATOR_TOTALS[handle]; if(!t) return "";
  const b=beltOf(t[0]);
  return `<span class="beltchip" title="${b.name} Belt · ${nf(t[0])} lifetime views">${beltSVG(b.n,20)}</span>`;
}
function renderBoard(pool){
  const board=$("#board");
  if(!pool.length){ board.innerHTML=`<div class="empty-state"><div class="eyebrow">Open division</div><h3>Nothing on the board</h3><p>No videos here yet in the ${windowLabel()}. Be the first on the board.</p></div>`; return; }
  const q=state.q.trim().toLowerCase();
  // Rank within the current window: show the top 100 by views for this window+division.
  // When searching, reach across the whole window pool so any video is findable.
  const base = q ? pool : pool.slice().sort((a,b)=>b.views-a.views).slice(0,100);
  let rows=base.filter(d=> !q || d.handle.toLowerCase().includes(q) || (d.hook||"").toLowerCase().includes(q) || (d.title||"").toLowerCase().includes(q));
  rows.sort((a,b)=>(b[state.sort]||0)-(a[state.sort]||0));
  if(!rows.length){ board.innerHTML=`<div class="empty-state"><div class="eyebrow">Search</div><h3>No matches</h3><p>Nothing matches “${esc(state.q)}” in this view.</p></div>`; return; }
  const maxV = Math.max(...pool.map(d=>d.views));
  const note = (!q && pool.length>rows.length) ? `<div class="boardnote">Showing the top ${rows.length} by views &middot; ${pool.length} videos competing in the ${windowLabel()}</div>` : "";
  board.innerHTML = note + rows.map(d=>{
    const isLead = d._rank===1;
    const barW = Math.max(2, Math.sqrt(d.views/maxV)*100);
    const hot = d.outlier>=3;
    return `<div class="row${isLead?' lead':''}">
      <div class="rowmain" role="button" tabindex="0" aria-expanded="false">
        <div class="rank${d._rank<=3?' top3':''} tnum">${d._rank}</div>
        <div class="vid">
          <div class="h"><span class="handle">@${esc(d.handle)}</span>${beltChip(d.handle)}${d.style?`<span class="fmt">${esc(d.style)}</span>`:''}</div>
          <div class="t">${esc(d.title)||esc(d.hook)||"Untitled"}</div>
          <div class="barwrap"><div class="barfill" style="width:${barW}%"></div></div>
        </div>
        <div class="views-cell"><b class="tnum">${nf(d.views)}</b></div>
        <div class="metric big"><span class="otag${hot?' hot':''} tnum">${fmtOutlier(d.outlier)}×</span><span class="lab">Outlier</span></div>
        <div class="metric sm"><span class="tnum">${nf(d.comments)}</span><span class="lab">Comments</span></div>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="detail"><div class="detail-inner"><div class="dpad">
        ${triggerTags(d.trigger)}
        <div class="dgrid">
          <div class="block"><div class="blab">The Hook</div><div class="hookbox"><p class="${d.hook?'':'empty'}">${d.hook?esc(d.hook):"No hook recorded"}</p></div></div>
          <div class="block"><div class="blab">Transcript</div>${d.transcript?`<div class="transcript"><p>${esc(d.transcript)}</p></div>`:`<div class="hookbox"><p class="empty">Transcript not available${d.caption?", see the caption below":""}</p></div>`}</div>
          ${d.caption?`<div class="block" style="grid-column:1/-1"><div class="blab">Caption</div><div class="transcript" style="max-height:150px"><p>${esc(d.caption)}</p></div></div>`:''}
          <div class="dmetrics">
            <div class="dm"><b class="tnum">${nf(d.views)}</b><i>Views</i></div>
            <div class="dm"><b class="tnum">${fmtOutlier(d.outlier)}×</b><i>Outlier Score</i></div>
            <div class="dm"><b class="tnum">${nf(d.comments)}</b><i>Comments</i></div>
            <div class="dm"><b class="tnum">${nf(d.likes)}</b><i>Likes</i></div>
            <div class="dm"><b class="tnum">${nf(d.followers)}</b><i>Followers</i></div>
            <div class="dm"><b>${fmtDate(d.posted)}</b><i>Posted</i></div>
          </div>
          <div class="dlinks">
            ${d.video_url?`<a class="btn" href="${esc(d.video_url)}" target="_blank" rel="noopener">Watch video</a>`:''}
            ${d.audio_url?`<a class="btn ghost" href="${esc(d.audio_url)}" target="_blank" rel="noopener">The audio</a>`:''}
          </div>
        </div>
      </div></div></div>
    </div>`;
  }).join("");
  bindRows();
}
function bindRows(){
  document.querySelectorAll(".row").forEach(row=>{
    const main=row.querySelector(".rowmain");
    const toggle=()=>{ const open=row.classList.toggle("open"); main.setAttribute("aria-expanded",open); main.querySelector(".chev").style.transform=open?"rotate(180deg)":""; };
    main.addEventListener("click",toggle);
    main.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
  });
}

/* ---------- creators ---------- */
function renderCreators(){
  const box=$("#creators");
  // All-time standings from lifetime totals — independent of the window/division filters.
  const list=Object.entries(CREATOR_TOTALS).map(([handle,[views,videos]])=>({handle,views,videos}))
    .filter(c=>c.views>0).sort((a,b)=>b.views-a.views);
  // belt legend / key
  const counts={}; list.forEach(c=>{const b=beltOf(c.views).n; counts[b]=(counts[b]||0)+1;});
  const legend = `<div class="beltkey">`+BELTS.map(b=>`<div class="bk" title="${b.name} Belt, ${b.req===0?'0':nf(b.req)}+ lifetime views">
      ${beltSVG(b.n,30)}<div class="bkt"><b>${b.name}</b><span>${b.req===0?'0':compact(b.req)}+ · ${counts[b.n]||0}</span></div></div>`).join("")+`</div>`;
  const caption=`<div class="crcap">All-time standings · belts earned by <b>total lifetime views</b> (not affected by the time or division filters above)</div>`;
  const head=`<div class="colhead" style="grid-template-columns:46px 1fr 120px 66px"><span>Rank</span><span>Creator &amp; Belt</span><span class="r">Lifetime views</span><span class="r">Videos</span></div>`;
  const rows=list.map((c,i)=>{
    const b=beltOf(c.views), next=BELTS[b.n]; // next belt or undefined at Black
    const toNext = next? next.req-c.views : 0;
    const sub = next? `${b.name} Belt · <b class="tnum">${compact(toNext)}</b> to ${next.name}` : `${b.name} Belt · top rank`;
    return `<div class="crow${i===0?' lead':''}">
      <div class="rank${i<3?' top3':''} tnum">${i+1}</div>
      <div class="cwrap"><span class="cbelt">${beltSVG(b.n,34)}</span>
        <div class="cmeta"><div class="handle">@${esc(c.handle)}</div><div class="csub">${sub}</div></div></div>
      <div class="cviews views-cell"><b class="tnum">${nf(c.views)}</b></div>
      <div class="metric sm c-hide tnum" style="text-align:right">${c.videos}</div>
    </div>`;
  }).join("");
  box.innerHTML = caption + legend + head + `<div class="creators">` + rows + `</div>`;
}

/* ---------- orchestration ---------- */
function renderAll(){
  const pool=currentPool(); rankPool(pool);
  document.querySelectorAll(".divpill").forEach(p=>p.setAttribute("aria-selected",String(p.dataset.div===state.division)));
  document.querySelectorAll("#winToggle button").forEach(b=>b.setAttribute("aria-selected",String(+b.dataset.days===state.days)));
  renderStats(pool); renderDivbar(); renderPodium(pool); renderBoard(pool); renderCreators();
}
function switchView(v){
  state.view=v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===v)));
  $("#videosView").hidden = v!=="videos"; $("#creatorsView").hidden = v!=="creators";
  $(".rightctl").style.visibility = v==="videos"?"visible":"hidden";
}

/* ---------- theme ---------- */
function initTheme(){
  // The asset library is a cream page, so the standings open cream too and
  // dark is the opt in. The choice is remembered per browser.
  const btn=$("#themeBtn");
  const apply=t=>{
    document.documentElement.setAttribute("data-theme",t);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t==="dark"?"#000000":"#ebe9e3");
    $("#themeLabel").textContent = t==="dark"?"Light":"Dark";   // the label names the next state
  };
  let cur="light";
  try{ if(localStorage.getItem("cl-theme")==="dark") cur="dark"; }catch(e){}
  apply(cur);
  btn.addEventListener("click",()=>{
    cur = cur==="dark"?"light":"dark"; apply(cur);
    try{ localStorage.setItem("cl-theme",cur); }catch(e){}
  });
}

/* ---------- wire ---------- */
initTheme();
renderHeaderStatic();
renderAll();
$("#winToggle").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.days=+b.dataset.days; renderAll(); });
$("#search").addEventListener("input",e=>{ state.q=e.target.value; renderBoard(currentPool()); });
$("#sort").addEventListener("change",e=>{ state.sort=e.target.value; const p=currentPool(); rankPool(p); renderBoard(p); });
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchView(t.dataset.view)));
</script>
</body>

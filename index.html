le": "elle.hypnotherapy", "title": "First, let me clear something up, because hypnotherapy gets WILDLY misrepresented. No swinging watches. No losing contro", "views": 1020, "comments": 0, "likes": 7, "outlier": 0.12, "followers": 8355, "video_url": "https://www.instagram.com/p/DboDPPxtZTW/", "audio_url": "", "hook": "", "transcript": "", "caption": "First, let me clear something up, because hypnotherapy gets WILDLY misrepresented. No swinging watches. No losing control. You\u2019re aware and in charge the entire time. What actually happens in this\u2026we work with the part of your mind underneath the conscious story. The part where the guilt actually lives. Where the trauma replays. Where \u201cit was my fault\u201d sits untouched, no matter how many times your logical brain argues with it. Talk therapy speaks to the part of you that already knows better. This work goes to where the beliefs actually live. It\u2019s why moms who\u2019ve done years of counselling feel more shift in weeks with me. Not because they finally tried hard enough\u2026but because we finally went to the right place. I found this work in my own healing after losing my triplets. Then I trained in it, on top of my psychology degree, hypnotherapy and NLP, specifically to bring it to loss moms. Four years and 150+ clients later\u2026the results still surprise even me \ud83e\udd0d Comment \u201cMETHOD\u201d if you want me to send you more info. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-04", "rank": 128}, {"handle": "allandib", "title": "For years, my stomach dropped every time someone made a decision without me. I called it caring. It was really fear. Fea", "views": 1009, "comments": 0, "likes": 3, "outlier": 0.17, "followers": 6053, "video_url": "https://www.instagram.com/p/DbzGjQNDTB0/", "audio_url": "https://www.instagram.com/reels/audio/832055344684922/", "hook": "", "transcript": "", "caption": "For years, my stomach dropped every time someone made a decision without me. I called it caring. It was really fear. Fear that the business couldn't be trusted to run without my fingerprints on everything.\n\nThen one day someone on the team solved a real problem, made the call I would have made, and handled it cleanly. My first reaction was pride, not panic. \n\nThat switch is everything. It only happens when you take the thinking outside your head and write it into real processes your team can follow. \n\nYou didn't build this business to be needed every hour of every day. You can let it run without you and feel good doing it. \n\nComment \"TRUST\" if you're ready for a team that can act without you.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-09", "rank": 129}, {"handle": "themindful_mindset", "title": "It goes on the calendar first, before the appointments and the work blocks and anyone else\u2019s needs. Time near the water", "views": 983, "comments": 3, "likes": 14, "outlier": 0.02, "followers": 52238, "video_url": "https://www.instagram.com/p/Dbbx7L1u6Pu/", "audio_url": "https://www.instagram.com/reels/audio/4537389293164283/", "hook": "", "transcript": "", "caption": "It goes on the calendar first, before the appointments and the work blocks and anyone else\u2019s needs. Time near the water or dancing or a bath with the door locked, booked like meetings and defended like meetings. That\u2019s backwards from how I lived for years, when pleasure got whatever scraps were left after everyone was handled, and there are never scraps, the list refills itself overnight. That version of me was healthy on paper and numb in real life, waiting for a later that never came, and later has a way of never coming when you\u2019re the one holding everything. Now it\u2019s fuel, and it\u2019s scheduled up front, because I know what I\u2019m like without it. Two weeks of skipped pleasure and I\u2019m snappy and resentful, bracing at every request and living from the neck up, and my family can tell before I can. My clients could probably tell too, if I\u2019m being real about it. My daughter is watching all of it, and that matters to me. A daughter who sees her mother treat her own aliveness as non negotiable grows into an adult who does the same, and that thought ended my guilt about the calendar permanently. Pleasure is a requirement, and requirements go in first. Monday morning, pen out, you first for once. Your body already knows the way. If you\u2019ve been living in your head and craving deeper connection,this is where you shift from obligation to pleasure. Follow @TiffanyTaylorCoaching for self love, nervous system safety, embodied intimacy, and feminine reclamation. #Tantra #nervoussystemhealing #embodimentpractice", "trigger": ["Results & Testimonials"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-30", "rank": 130}, {"handle": "dragana.jasprica", "title": "Alright, here are the worst fat loss trends I see women fall for. Let\u2019s go. \ud83d\udc47\ud83c\udffc", "views": 929, "comments": 0, "likes": 5, "outlier": 0.02, "followers": 42593, "video_url": "https://www.instagram.com/p/Dbn8XPTB8qq/", "audio_url": "", "hook": "", "transcript": "", "caption": "Alright, here are the worst fat loss trends I see women fall for. Let\u2019s go. \ud83d\udc47\ud83c\udffc\n\n1\ufe0f\u20e3 The \u201dbalanced\u201c fat loss phase. The one where you try to lose fat while keeping your totally normal lifestyle, all the dinners out, all the wine, nothing really changes. That\u2019s not how it works, babe. We embrace the restriction. You go in, you go HARD, you get properly lean, and then you get OUT. And that\u2019s exactly what earns you a loooong time away from dieting.\n\n2\ufe0f\u20e3 Low carb and keto for fat loss. It made me softer, not leaner, and left me at the heaviest weigh-in of my life. Carbs are what fuel your training and let you keep your muscle. Cutting them is how you end up flat, foggy, and still soft.\n\n3\ufe0f\u20e3 Body recomp, aka the permanent mild deficit. Trying to lose fat and build muscle at the same time, forever. Unless you\u2019re a total beginner or on gear, all it does is keep you stuck in the middle for years. Lean out OR build. Not both at once.\n\n4\ufe0f\u20e3 Coffee for breakfast, a salad and chicken for lunch, and then wondering why you\u2019re raiding the pantry at 9pm. You\u2019re not broken and you don\u2019t lack willpower. You just haven\u2019t eaten enough all day, and your food isn\u2019t timed right.\n\n5\ufe0f\u20e3 GLP-1s for women who have less than 20kg to lose. You don\u2019t need to blunt your appetite into nothing. You need your training and nutrition set up properly. That\u2019s it.\n\n6\ufe0f\u20e3 Cycle syncing your workouts. Training hard, progressing consistently, and applying auto-regulation will do infinitely more for your body than tiptoeing around your cycle.\n\n7\ufe0f\u20e3 Pilates to \u201dlook lean\u201c instead of lifting heavy. Pilates is lovely. But the lean, defined look you actually want comes from MUSCLE. And muscle comes from lifting heavy and progressing.\n\nNone of the trends worked for me.\n\nWhat worked was boring. Real food, getting stronger, and one focused phase at a time. \ud83e\udd37\ud83c\udffc\u200d\u2640\ufe0f", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-04", "rank": 131}, {"handle": "altaredstatesofconsciousness", "title": "if you're scared you're the exception this won't work for, comment SHADOW and let's prove that wrong.", "views": 894, "comments": 0, "likes": -1, "outlier": 0.02, "followers": 44884, "video_url": "https://www.instagram.com/p/Dbj91BSO13v/", "audio_url": "https://www.instagram.com/reels/audio/28140400025565068/", "hook": "You can explain your patterns and still not stop them.\nAsk me how I know.\nYou can diagnose yourself mid-sentence, abandonment wound activated, probably by my dad.\nAnyway, you've got the podcast and the therapist who's proud of you.\nThe 2 a.m. spiral, you survived all of it.\nBut somewhere private, you've decided you must be too broken for this to work on you.\nAnd that's just not it.\nYou see, all that insight was never the thing that moves it.\nYour understanding has turned into a place you go so you don't have to feel.\nAnd you can't think your way through a door that opens from the felt side.\nThe woman I work with are you, smart, accomplished, and stuck in the same loop.\nAnd what helps is a room where the feeling finally happens with someone holding it.", "transcript": "You can explain your patterns and still not stop them.\nAsk me how I know.\nYou can diagnose yourself mid-sentence, abandonment wound activated, probably by my dad.\nAnyway, you've got the podcast and the therapist who's proud of you.\nThe 2 a.m. spiral, you survived all of it.\nBut somewhere private, you've decided you must be too broken for this to work on you.\nAnd that's just not it.\nYou see, all that insight was never the thing that moves it.\nYour understanding has turned into a place you go so you don't have to feel.\nAnd you can't think your way through a door that opens from the felt side.\nThe woman I work with are you, smart, accomplished, and stuck in the same loop.\nAnd what helps is a room where the feeling finally happens with someone holding it.", "caption": "if you're scared you're the exception this won't work for, comment SHADOW and let's prove that wrong.", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-03", "rank": 132}, {"handle": "dragana.jasprica", "title": "Let\u2019s say bye-bye \ud83d\udc4b\ud83c\udffc to another 5 years of staying stuck!", "views": 892, "comments": 0, "likes": 9, "outlier": 0.02, "followers": 42593, "video_url": "https://www.instagram.com/p/Db224ItBRYO/", "audio_url": "https://www.instagram.com/reels/audio/28038972865791988/", "hook": "My spiciest take is that body recomposition is a scam, at least for you, and before you come for me, let me explain.\nOkay, I need to be really honest with you.\nLosing body fat and building muscle mass at the same time does work, but it only works for a few people.\nTotal beginners who just picked up a weight.\nSomeone coming back to training after a long break.\nAnd people on gear.\nIf you are none of those, you have been lifting consistently for years.\nFocusing on body recomp is the exact reason why you still look soft instead of lean and defined.\nAnd I know what you have been telling yourself.\nI'll just lose that last bit of fat and then I will finally see the muscle definition.\nBut if you have been sitting in a teeny tiny, a little deficit forever, trying to lose fat and build muscle at the same time, there is barely any muscle mass under there to reveal in the first place.\nSo you never really lean out, but you also never really build muscle either.\nYou're just stuck in the middle, what I like to call the level of suck.\nAnd I have watched hundreds of women stay there for years on end.\nDamn, I was stuck there for almost 5 years myself.\nThe way out of the level of suck was never doing everything at once.\nIt's picking one goal at a time and fully commit.\nYou go all in on a proper fat loss phase, then you go all in on building muscle without giving up 4 weeks in because you feel a little puffy and bulky.\nAnd that right there is the difference between staying stuck, looking soft for another 5 years or finally looking like you lift.", "transcript": "My spiciest take is that body recomposition is a scam, at least for you, and before you come for me, let me explain.\nOkay, I need to be really honest with you.\nLosing body fat and building muscle mass at the same time does work, but it only works for a few people.\nTotal beginners who just picked up a weight.\nSomeone coming back to training after a long break.\nAnd people on gear.\nIf you are none of those, you have been lifting consistently for years.\nFocusing on body recomp is the exact reason why you still look soft instead of lean and defined.\nAnd I know what you have been telling yourself.\nI'll just lose that last bit of fat and then I will finally see the muscle definition.\nBut if you have been sitting in a teeny tiny, a little deficit forever, trying to lose fat and build muscle at the same time, there is barely any muscle mass under there to reveal in the first place.\nSo you never really lean out, but you also never really build muscle either.\nYou're just stuck in the middle, what I like to call the level of suck.\nAnd I have watched hundreds of women stay there for years on end.\nDamn, I was stuck there for almost 5 years myself.\nThe way out of the level of suck was never doing everything at once.\nIt's picking one goal at a time and fully commit.\nYou go all in on a proper fat loss phase, then you go all in on building muscle without giving up 4 weeks in because you feel a little puffy and bulky.\nAnd that right there is the difference between staying stuck, looking soft for another 5 years or finally looking like you lift.", "caption": "Let\u2019s say bye-bye \ud83d\udc4b\ud83c\udffc to another 5 years of staying stuck!\nAnd hello \ud83d\ude4b\ud83c\udffc\u200d\u2640\ufe0f to finally looking like you lift.\n\nWe broke the whole \u201drecomp lie\u201c down in a podcast episode, exactly why it costs women years, and what to do instead. \n\n\ud83c\udfa7 Comment RECOMP and I\u2019ll send it straight to you.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-10", "rank": 133}, {"handle": "tiffanytaylorcoaching", "title": "You weren\u2019t looking for this. You were scrolling after another day of being everyone\u2019s everything, and something in thes", "views": 870, "comments": 2, "likes": 5, "outlier": 1.04, "followers": 838, "video_url": "https://www.instagram.com/p/Dbbibt3B15v/", "audio_url": "https://www.instagram.com/reels/audio/986348020581438/", "hook": "", "transcript": "", "caption": "You weren\u2019t looking for this. You were scrolling after another day of being everyone\u2019s everything, and something in these words is making your chest do a strange thing. Because you do love him, and that\u2019s what makes the numbness confusing. You love him and you\u2019d still rather sleep, and you\u2019ve wondered what that means about you. The mechanics matter more than the meaning. A body that carries the calendar and the kids and the emotional temperature of a household lives in survival mode, and desire can\u2019t grow there. What grows there is what you\u2019ve got now, exhaustion and a flinch where the wanting used to be. You\u2019ve likely tried the head level fixes already, the therapy and the books and the big conversations, and you can explain your pattern perfectly while it keeps running, because it doesn\u2019t live where you\u2019ve been looking. Months of numbness build from years of carrying, and the build can run in reverse once the body starts feeling safe. I found this work the way you found this account, tired and skeptical and out of other ideas, and it gave me back a version of myself I\u2019d stopped waiting for. Drop a \u201cREADY\u201d in the comments if you want the full breakdown. Your body already knows the way. If you\u2019ve been living in your head and craving deeper connection,this is where you shift from obligation to pleasure. Follow @TiffanyTaylorCoaching for self love, nervous system safety, embodied intimacy, and feminine reclamation. #nervoussystemhealing #selflovejourney #overfunctioning #feminineenergy", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-30", "rank": 134}, {"handle": "elle.hypnotherapy", "title": "A mom who hadn\u2019t slept a full night since her son was stillborn told me she\u2019d just had five in a row. Her words\u2026\u201dI forgo", "views": 867, "comments": 2, "likes": 10, "outlier": 0.1, "followers": 8355, "video_url": "https://www.instagram.com/p/DbdwGbotg8V/", "audio_url": "https://www.instagram.com/reels/audio/1309090040908747/", "hook": "", "transcript": "", "caption": "A mom who hadn\u2019t slept a full night since her son was stillborn told me she\u2019d just had five in a row. Her words\u2026\u201dI forgot what my own brain sounds like rested.\u201d Another walked past the nursery door she\u2019d kept shut for a year. She didn\u2019t go in. She didn\u2019t need to yet. But she stopped holding her breath in her own hallway. One texted me from her office car park. Pregnant colleague, close quarters, all day. She used her tools, stayed the whole shift\u2026and cried happy tears telling me. Six weeks earlier she\u2019d been leaving work early twice a week. And one said the quiet thing out loud. \u201cI felt hopeful yesterday. And I didn\u2019t punish myself for it.\u201d I share these because loss moms are always told healing takes years. Decades. Maybe never. So they shrink their hope down to almost nothing. But these shifts happened by week three, mama. Week three. Not because these women are special cases\u2026because the work finally went where the pain actually lives, instead of circling it. Sleep usually returns first. Then the triggers soften. Then hope stops feeling like a betrayal. Watch for those three. They\u2019re the early signs of everything \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-31", "rank": 135}, {"handle": "erseaberg", "title": "Good operations means the business survives you leaving the room. Comment SOUNDBOARD and let\u2019s build yours to run withou", "views": 854, "comments": 0, "likes": 43, "outlier": 1.13, "followers": 756, "video_url": "https://www.instagram.com/p/Db6m1GoAXPF/", "audio_url": "https://www.instagram.com/reels/audio/28108626908822529/", "hook": "The most important thing I ever did as COO was document my own job so well that my replacement could run it without me.\nWhen I was promoted to COO of a wedding company, I did something that sounds literally so backwards.\nInstead of making myself indispensable, I spent my time making myself unnecessary because I knew that that was the actual job.\nSo I wrote down how everything ran, built the training protocols, and then hired and trained my own replacement for lead planner, handing them a business that made sense on paper instead of only in my head.\nMost people cling to being the only one who knows how things work because it feels like job security, but it's actually the opposite.\nIf the business can't run without you, you don't own a business, you own a very demanding position that you can't quit.\nI've done the same thing across four different organizations at this point, and every time the measure of good operations was exactly the same.\nCould someone else step in and keep it running without a panic?\nAnd if yes, then the foundation was real.\nThe goal for your business is exactly the same.\nBuild it so it doesn't need you in the room because that is the only version of ownership that actually gives you your life back.", "transcript": "The most important thing I ever did as COO was document my own job so well that my replacement could run it without me.\nWhen I was promoted to COO of a wedding company, I did something that sounds literally so backwards.\nInstead of making myself indispensable, I spent my time making myself unnecessary because I knew that that was the actual job.\nSo I wrote down how everything ran, built the training protocols, and then hired and trained my own replacement for lead planner, handing them a business that made sense on paper instead of only in my head.\nMost people cling to being the only one who knows how things work because it feels like job security, but it's actually the opposite.\nIf the business can't run without you, you don't own a business, you own a very demanding position that you can't quit.\nI've done the same thing across four different organizations at this point, and every time the measure of good operations was exactly the same.\nCould someone else step in and keep it running without a panic?\nAnd if yes, then the foundation was real.\nThe goal for your business is exactly the same.\nBuild it so it doesn't need you in the room because that is the only version of ownership that actually gives you your life back.", "caption": "Good operations means the business survives you leaving the room. Comment SOUNDBOARD and let\u2019s build yours to run without you.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-11", "rank": 136}, {"handle": "tiffanytaylorcoaching", "title": "You can\u2019t think your way out of a pattern that lives in your nervous system, and I\u2019ll say it at every dinner party until", "views": 848, "comments": 1, "likes": 9, "outlier": 1.01, "followers": 838, "video_url": "https://www.instagram.com/p/DbPDxHtttRA/", "audio_url": "https://www.instagram.com/reels/audio/1426560922388382/", "hook": "", "transcript": "", "caption": "You can\u2019t think your way out of a pattern that lives in your nervous system, and I\u2019ll say it at every dinner party until I stop getting invited. Insight is lovely, and insight changed nothing about how my body braced for twenty years. Next hill, what everyone praises as strength in women is often survival that learned good manners. Being the one who handles everything usually started as a body deciding that depending on people wasn\u2019t safe. Another one, pleasure is a requirement, fuel for a regulated and creative woma comment INFO and I'll DM you where the shift starts.", "views": 846, "comments": 0, "likes": 10, "outlier": 0.24, "followers": 3531, "video_url": "https://www.instagram.com/p/DbwAEkcE9UZ/", "audio_url": "https://www.instagram.com/reels/audio/28420675384205228/", "hook": "The women who actually heal make one quiet identity shift that the women who manage forever never end up making.\nThere is a version of yourself that you may have been living for so long that you forgot it was a role, one whose whole identity organizes around being sick.\nEvery plan gets built around the illness, every decision runs through it, and slowly the person underneath it gets quieter.\nI understand how you got there, because managing a chronic illness for years demands that it take up that much room.\nThe trouble is that when your identity becomes the patient that copes, healing can start to feel like a threat to who you are and some part of you, protects the sick role without ever meaning to.\nThe women who get their lives back tend to make a quiet shift at some point, from someone managing an illness to someone actively healing from one.\nIt is a change in what they expect their own body to be capable of, not a loud declaration or a mindset slogan.\nThat shift is letting yourself believe that the version of you on the other side of this, the one who talks about all of this in the past tense, the real place you're allowed to be headed, not pretending you're fine and not warrior language about fighting your body.\nYou're allowed to stop being the woman who copes beautifully and start being the woman who is healed.\nThat identity is a direction, not an arrogance, and giving yourself permission to face it is often where the real change starts.", "transcript": "The women who actually heal make one quiet identity shift that the women who manage forever never end up making.\nThere is a version of yourself that you may have been living for so long that you forgot it was a role, one whose whole identity organizes around being sick.\nEvery plan gets built around the illness, every decision runs through it, and slowly the person underneath it gets quieter.\nI understand how you got there, because managing a chronic illness for years demands that it take up that much room.\nThe trouble is that when your identity becomes the patient that copes, healing can start to feel like a threat to who you are and some part of you, protects the sick role without ever meaning to.\nThe women who get their lives back tend to make a quiet shift at some point, from someone managing an illness to someone actively healing from one.\nIt is a change in what they expect their own body to be capable of, not a loud declaration or a mindset slogan.\nThat shift is letting yourself believe that the version of you on the other side of this, the one who talks about all of this in the past tense, the real place you're allowed to be headed, not pretending you're fine and not warrior language about fighting your body.\nYou're allowed to stop being the woman who copes beautifully and start being the woman who is healed.\nThat identity is a direction, not an arrogance, and giving yourself permission to face it is often where the real change starts.", "caption": "If your whole identity has quietly organized around being sick, comment INFO and I'll DM you where the shift starts.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-07", "rank": 139}, {"handle": "dragana.jasprica", "title": "You know the cycle. Lose a few kilos by summer, gain them back by winter, start again every January. \ud83e\udee0", "views": 840, "comments": 8, "likes": 5, "outlier": 0.02, "followers": 42593, "video_url": "https://www.instagram.com/p/DbtGC1ShWX-/", "audio_url": "https://www.instagram.com/reels/audio/1029036016514397/", "hook": "", "transcript": "", "caption": "You know the cycle. Lose a few kilos by summer, gain them back by winter, start again every January. \ud83e\udee0\n\nExhausting. And it\u2019s been eating years of your effort for nothing.\n\nHere\u2019s the way out.\n\nONE real fat loss phase, with an end date, run at a rate you can actually SEE working, while you get stronger the whole way through.\n\nThen a proper reverse diet that brings your food back up while you maintain your new weight.\n\nAnd here\u2019s the thing. You\u2019re probably already eating well. Whole foods, high protein, all of it.\n\nWhat\u2019s actually missing is the detail. \ud83d\udd0d\n\nThe macros in each meal aren\u2019t dialed in for you, and your food isn\u2019t timed right across your day.\n\nThat\u2019s the stuff you can\u2019t really fix on your own, and it\u2019s exactly what makes the difference.\n\nNo living in a deficit forever, chasing a finish line that never actually comes.\n\nI coach women 30+ who lift hard and are SO done looking the same year after year.\n\nIf you want to know exactly how much of each macro to eat, and when, without the endless guessing\u2026\n\n\ud83c\udf5d Comment \u201dMACROS\u201c\nand I\u2019ll send you the link to build your own personalised nutrition structure.\n\nXx\nDragana", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 140}, {"handle": "dragana.jasprica", "title": "Want to know the exact strength numbers you should be hitting by now?", "views": 800, "comments": 6, "likes": 16, "outlier": 0.02, "followers": 42594, "video_url": "https://www.instagram.com/p/DbnaEY-BUt0/", "audio_url": "https://www.instagram.com/reels/audio/27720558870934515/", "hook": "Another eight week cut is the exact reason why you still don't look like you lift.\nThe whole fitness industry taught you that the answer is always another cut.\nFeeling a little bit soft and fluffy?\nCut.\nHolidays coming up?\nCut again.\nNew year around the corner?\nCut.\nAnd this never works long term for y gh yo", "views": 748, "comments": 2, "likes": 10, "outlier": 0.89, "followers": 838, "video_url": "https://www.instagram.com/p/DbWDyfON4sY/", "audio_url": "https://www.instagram.com/reels/audio/2046973856046990/", "hook": "", "transcript": "", "caption": "The kids are home, the schedule is a group project only you\u2019re working on, and everyone\u2019s fun apparently runs through your labor. Summer is the overfunctioner\u2019s final exam. Four ways to pass it without abandoning yourself. Hand off a full meal every day and let it be made differently than you\u2019d make it, because your body learning that things get handled without you is worth more than a perfect plate. Claim one unscheduled hour a week that belongs to only you and make sure it\u2019s not errands in disguise. Be unreachable and useless for the length of it, and watch what your shoulders do around minute forty. Get near water without a job, meaning no sunscreen duty this time. Water without responsibility is one of the fastest ways I know back into a soft body. And find touch without an agenda, a long hug where you\u2019re the one leaning for once, or your own hand on your chest at night, because bodies settle through contact that isn\u2019t asking for anything. The mental load doesn\u2019t take summers off, which means the exhale has to be built on purpose. When the guilt shows up, and it will, that\u2019s the conditioning talking, and you can do it anyway. A regulated mom changes the temperature of the house for everyone in it. Your body already knows the way. If you\u2019ve been living in your head and craving deeper connection,this is where you shift from obligation to pleasure. Follow @TiffanyTaylorCoaching for self love, nervous system safety, embodied intimacy, and feminine reclamation.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 143}, {"handle": "altaredstatesofconsciousness", "title": "if you think you might Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-03", "rank": 146}, {"handle": "elle.hypnotherapy", "title": "It happens fast, doesn\u2019t it. Phone buzzes. Scan photo. Confetti emojis. And your body reacts before your mind even gets", "views": 697, "comments": 3, "likes": 9, "outlier": 0.08, "followers": 8355, "video_url": "https://www.instagram.com/p/Db3gFmBtC3h/", "audio_url": "https://www.instagram.com/reels/audio/1048195903485641/", "hook": "", "transcript": "", "caption": "It happens fast, doesn\u2019t it. Phone buzzes. Scan photo. Confetti emojis. And your body reacts before your mind even gets a vote\u2026chest tight, stomach dropped, eyes stinging. Try this, right in that moment. Two short breaths in through your nose. One long, slow breath out through your mouth. Repeat it three times. It\u2019s called a physiological sigh, and it\u2019s the fastest built-in brake your nervous system has. Then look up from the phone and slowly name five things you can see. Boring things. The kettle. The door. The dog. You\u2019re showing your brain the actual room\u2026because right now, it thinks you\u2019re somewhere dangerous. Sixty seconds, and the wave becomes something you\u2019re riding instead of something pulling you under. Reply later. Or never. Both allowed. Now the honest part, because I\u2019ll always give you the honest part\u2026this settles the moment. It doesn\u2019t heal the reason the moment hit so hard. If announcements keep flattening you, that\u2019s unprocessed loss asking for real attention. And it responds so beautifully to deeper work. Tools for the wave. Deeper work for the water. You deserve both, mama \ud83e\udd0d Curious? Comment \u201cMETHOD\u201d below. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 147}, {"handle": "dragana.jasprica", "title": "If yo ree body composition audit. \ud83d\udd75\ufe0f\u200d\u2640\ufe0f\n\nLet me review what you\u2019re missing to achieve your dream physique and lay out the plan on how to fix it. \ud83c\udfaf", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-03", "rank": 148}, {"handle": "tiffanytaylorcoaching", "title": "Nobody gets my attention before my body does. I wake before everyone in my house, and the day starts with meditation and", "views": 665, "comments": 4, "likes": 6, "outlier": 0.79, "followers": 838, "video_url": "https://www.instagram.com/p/DbLqGxKxVAs/", "audio_url": "https://www.instagram.com/reels/audio/783415406101365/", "hook": "", "transcript": "", "caption": "Nobody gets my attention before my body does. I wake before everyone in my house, and the day starts with meditation and an energetic practice. The combination of sound, breath and movement, connecting to myself before anything gets to make demands. The phone stays untouched through all of it, because the moment I break this rule I spend the day as everyone\u2019s employee. Coffee gets its own moment. Sitting down, and I taste it. Standing at the counter gulping caffeine while making lunches is drinking anxiety with extra steps, and yes I still love coffee, regulated never meant joyless. I don\u2019t solve anyone\u2019s problems for the first thirty minutes. The house survives, it always survives, and my system needs that proof daily or it forgets. I ask what I want today before I look at what\u2019s due today. Some mornings the answer is small, sunshine or a specific song, and those wants are the thread back to the bigger ones. I lost that thread once for years, and losing it long enough means waking up one day not knowing who you are outside of what you do for people. These rules look precious from the outside. From the inside they\u2019re the reason my day starts with intention and keeps belonging to me. Your body already knows the way. If you\u2019ve been living in your head and craving deeper connection,this is where you shift from obligation to pleasure. Follow @TiffanyTaylorCoaching for self love, nervous system safety, embodied intimacy, and feminine reclamation. #nervoussystemhealing #selflovejourney #feminineenergy #feminineenergy", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-24", "rank": 149}, {"handle": "corinne.naturopath", "title": "If you have been at this for ten years, you have probably started to wonder if you are the exception, the one whose body", "views": 651, "comments": 0, "likes": 2, "outlier": 0.18, "followers": 3531, "video_url": "https://www.instagram.com/p/DbtG5QogdhO/", "audio_url": "https://www.instagram.com/reels/audio/37945945995048848/", "hook": "", "transcript": "", "caption": "If you have been at this for ten years, you have probably started to wonder if you are the exception, the one whose body just will not respond.\n\nI want to offer you a different read on those ten years.\n\nEverything you have tried, every protocol and podcast and elimination, taught you your own body in a way almost no one gets to know theirs. You can feel the difference between a healing shift and a wrong turn. You know your patterns. You have language for what is happening inside you.\n\nThat is the record of someone who has been doing the right things in the wrong order, without the one thing underneath them that makes the rest work, not the record of someone too far gone.\n\nThe women who stall for a decade are almost never the ones who tried too little. They are the ones who kept starting in the middle, on a body that never had its foundations filled first.\n\nYour decade is exactly what will let you recognize the order the moment someone finally puts it in front of you.\n\nIf you have been at this for years and quietly wondered if you are the exception, comment INFO and I'll DM you where to actually start.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 150}, {"handle": "altaredstatesofconsciousness", "title": "imagine a no that leaves your body without the guilt spiral after, comment WHOLE and i'll send you the details on workin", "views": 641, "comments": 0, "likes": -1, "outlier": 0.01, "followers": 44885, "video_url": "https://www.instagram.com/p/Db4FPDQhcZK/", "audio_url": "https://www.instagram.com/reels/audio/28226405197049951/", "hook": "You can quit people-pleasing without turning cold, I promise.\nPeople-pleasing gets sold as kindness and underneath it is a body that learned love has to be earned.\nYou kept everybody comfortable because somewhere young, that's how you stayed safe.\nLeaving it behind won't make you cold.\nYou feel the guilt when you say no and choose yourself anyway.\nYour body learns nothing bad happens and it learns through repetition, not one brave moment.\nI work with women who apologize their way through decades and are ready to feel a clean yes again.\nYou get to be warm and clear at the same time without the cover letter on every no.", "transcript": "You can quit people-pleasing without turning cold, I promise.\nPeople-pleasing gets sold as kindness and underneath it is a body that learned love has to be earned.\nYou kept everybody comfortable because somewhere young, that's how you stayed safe.\nLeaving it behind won't make you cold.\nYou feel the guilt when you say no and choose yourself anyway.\nYour body learns nothing bad happens and it learns through repetition, not one brave moment.\nI work with women who apologize their way through decades and are ready to feel a clean yes again.\nYou get to be warm and clear at the same time without the cover letter on every no.", "caption": "imagine a no that leaves your body without the guilt spiral after, comment WHOLE and i'll send you the details on working with me.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-10", "rank": 151}, {"handle": "revivetherapyservices", "title": "If your stomach drops every time your boss says got a minute, comment \"HEAL\" and I'll send you the work that goes where", "views": 628, "comments": 0, "likes": 19, "outlier": 0.41, "followers": 1522, "video_url": "https://www.instagram.com/p/DbwLuxrjV7I/", "audio_url": "https://www.instagram.com/reels/audio/28893321110256200/", "hook": "", "transcript": "", "caption": "If your stomach drops every time your boss says got a minute, comment \"HEAL\" and I'll send you the work that goes where that reaction lives.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 152}, {"handle": "guy_finocchiaro", "title": "Currently not collectible is one of the most underrated options out there.", "views": 598, "comments": 0, "likes": 4, "outlier": 0.54, "followers": 1103, "video_url": "https://www.instagram.com/p/Db9Cjs1yagj/", "audio_url": "https://www.instagram.com/reels/audio/323707086102202/", "hook": "", "transcript": "", "caption": "Currently not collectible is one of the most underrated options out there.\n\nWhen you qualify, the IRS stops active collection, no levies, no garnishment, and you pay nothing for a stretch.\n\nIt sounds too good, so people either chase it when they don\u2019t qualify or never learn it exists.\n\nThe fine print nobody mentions is this. It only works when the IRS\u2019s own math shows your necessary living expenses meet or beat your income, meaning there\u2019s nothing left to take without creating hardship.\n\nThe documentation is everything. You show your real numbers against the IRS\u2019s allowable standards, and a case built sloppily gets denied when you\u2019d otherwise qualify.\n\nI\u2019ve gotten clients into this status when they were bracing for a levy, and it bought them room to get stable again.\n\nYou earn it with paperwork, not with a phone call.\n\nComment PLAN and I\u2019ll send you the details on whether your numbers would hold up.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 153}, {"handle": "erseaberg", "title": "Be honest with me, when\u2019s the last time you took a week off and didn\u2019t check your phone in the bathroom at dinner? Exact", "views": 589, "comments": 0, "likes": 5, "outlier": 0.78, "followers": 756, "video_url": "https://www.instagram.com/p/Db4CADtAbWi/", "audio_url": "https://www.instagram.com/reels/audio/3224555394493285/", "hook": "", "transcript": "", "caption": "Be honest with me, when\u2019s the last time you took a week off and didn\u2019t check your phone in the bathroom at dinner? Exactly. That\u2019s why we\u2019re here.\n\nBecause you want the vacation so bad, but there\u2019s this little voice going \u201cgirl, if you stop answering messages for seven days this whole thing is toast,\u201d so you just don\u2019t go, or you go and you\u2019re on your laptop by the pool, which is somehow worse!\n\nAnd listen, I get it. I\u2019ve worked with founders and CEOs who everyone on their team ran to for everything. Their phone was never off, and they walked around calling and dictating into it like they are a slave to it. It wasn\u2019t dedication. It was being run ragged. They just didn\u2019t have any way to slow it down or to get ahead of it. They were the only ones who knew anything, and it was the only way that they were able to keep on living by continuing the same toxic pattern.\n\nThen you put the processes somewhere your team can actually find them, and suddenly they\u2019re answering their own questions and you\u2019re out here eating dinner like a normal person with your phone face down.\n\nThat\u2019s my whole thing. Boring backend work that nobody\u2019s making cute reels about, and it\u2019s the reason my clients can leave for a week and genuinely not care.\n\nComment SOUNDBOARD and let\u2019s figure out what\u2019s keeping you glued to your phone.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 154}, {"handle": "altaredstatesofconsciousness", "title": "everyone's going to tell you this is the wrong goal. but shadow work will not make you more palatable, sweetie. it will", "views": 584, "comments": 0, "likes": -1, "outlier": 0.01, "followers": 44885, "video_url": "https://www.instagram.com/p/Db9cic9SiWn/", "audio_url": "https://www.instagram.com/reels/audio/28050791077885993/", "hook": "Shadow work will not make you more palatable.\nIf you want to be easier to swallow, please hire someone else.\nEveryone's going to tell you healing should make you nicer, softer, easier to be around.\nThis work doesn't make you smaller, it makes you more honest.\nYou might get less agreeable and a lot more free.\nI've watched it happen over and over.\nWomen stop performing okay and start telling the truth.", "transcript": "Shadow work will not make you more palatable.\nIf you want to be easier to swallow, please hire someone else.\nEveryone's going to tell you healing should make you nicer, softer, easier to be around.\nThis work doesn't make you smaller, it makes you more honest.\nYou might get less agreeable and a lot more free.\nI've watched it happen over and over.\nWomen stop performing okay and start telling the truth.", "caption": "everyone's going to tell you this is the wrong goal. but shadow work will not make you more palatable, sweetie. it will make you more yourself, and sometimes those are opposite directions. if what you actually want is to be easier for other people to digest, this isn't the work for you. i'll die on this hill \ud83d\udda4", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-13", "rank": 155}, {"handle": "susiebower_", "title": "I want it to feel normal to see pain as information about what your body's carrying. Your body creates pain to get your", "views": 574, "comments": 3, "likes": 10, "outlier": 1.97, "followers": 291, "video_url": "https://www.instagram.com/p/DblgsvktXeQ/", "audio_url": "https://www.instagram.com/reels/audio/26616213374744147/", "hook": "", "transcript": "", "caption": "I want it to feel normal to see pain as information about what your body's carrying. Your body creates pain to get your attention about something it's been holding.\n\nWhen we treat every ache as a broken part, we miss what the body is saying, and we end up managing symptoms for years.\n\nWhen we treat pain as a message, we get curious, we look for the source, and we give the body a chance to let go. That mindset changes everything about how relief happens.\n\nI've watched people soften years of tension once they let go of the fight with their body and listened to it instead.\n\nCurious where yours is coming from? DM or comment PAIN below \ud83d\udc47\ud83c\udffc", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-03", "rank": 156}, {"handle": "corinne.naturopath", "title": "When your body holds onto weight and reacts to everything you eat, that's it in guard mode, bracing for a threat it thin", "views": 566, "comments": 2, "likes": 6, "outlier": 0.16, "followers": 3531, "video_url": "https://www.instagram.com/p/DbL-TJbgnVC/", "audio_url": "https://www.instagram.com/reels/audio/27867864802809632/", "hook": "", "transcript": "", "caption": "When your body holds onto weight and reacts to everything you eat, that's it in guard mode, bracing for a threat it thinks is still coming.\n \nSomewhere along the way it stopped believing food and rest were reliably coming, so it started holding on to everything it could.\n \nWhen you feed it consistently and get its minerals in, it slowly lets that guard down, and I've watched women get their first calm afternoon in years once their body finally felt safe.\n \nYou can't force that with discipline, you earn it by showing up steadily until your body trusts you again.\n \nIf years of pushing and cutting turned your body against you, comment INFO and I'll show you the way back.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-24", "rank": 157}, {"handle": "corinne.naturopath", "title": "If you're eating plenty and you're still hungry all the time, comment INFO and I'll show you how to actually turn that a", "views": 544, "comments": 2, "likes": 2, "outlier": 0.15, "followers": 3531, "video_url": "https://www.instagram.com/p/DbjILyADDXq/", "audio_url": "https://www.instagram.com/reels/audio/28659175860350215/", "hook": "If you're eating what seems like enough food, and you're still hungry all of the time, your body is trying to tell you something.\nFor years, I thought I just had a big appetite and liked an afternoon nap.\nBut it turned out my body couldn't switch fuels.\nThe tell is pretty simple.\nIf you're eating enough, which is at least 1,500 to 2,000 calories, and you're still hungry all the time, something deeper is going on here.\nUsually it means you're not fat adapted, so your body only knows how to run on sugar or glucose, and panics the second that it dips.\nThat same pattern keeps your blood sugar all over the place, low on vitamins and minerals.\nYour body needs to handle your life.\nThe real fix is getting metabolically flexible, so your body can burn its own fat for fuel, and this creates steady energy and minimizes the incessant cravings for food.\nOnce I got fat adapted, the constant hunger and the afternoon crash mostly took care of themselves.", "transcript": "If you're eating what seems like enough food, and you're still hungry all of the time, your body is trying to tell you something.\nFor years, I thought I just had a big appetite and liked an afternoon nap.\nBut it turned out my body couldn't switch fuels.\nThe tell is pretty simple.\nIf you're eating enough, which is at least 1,500 to 2,000 calories, and you're still hungry all the time, something deeper is going on here.\nUsually it means you're not fat adapted, so your body only knows how to run on sugar or glucose, and panics the second that it dips.\nThat same pattern keeps your blood sugar all over the place, low on vitamins and minerals.\nYour body needs to handle your life.\nThe real fix is getting metabolically flexible, so your body can burn its own fat for fuel, and this creates steady energy and minimizes the incessant cravings for food.\nOnce I got fat adapted, the constant hunger and the afternoon crash mostly took care of themselves.", "caption": "If you're eating plenty and you're still hungry all the time, comment INFO and I'll show you how to actually turn that around.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-02", "rank": 158}, {"handle": "guy_finocchiaro", "title": "A big chunk of what people owe the IRS is penalties stacked on top of the original tax, sometimes years of them.", "views": 519, "comments": 2, "likes": 2, "outlier": 0.47, "followers": 1103, "video_url": "https://www.instagram.com/p/DbHqagoxEOw/", "audio_url": "https://www.instagram.com/reels/audio/2139925233474698/", "hook": "", "transcript": "", "caption": "A big chunk of what people owe the IRS is penalties stacked on top of the original tax, sometimes years of them.\n\nPlenty of those penalties can come off if you know how to ask.\n\nThere\u2019s first time penalty abatement, which many business owners qualify for and never claim because nobody told them it exists.\n\nThen there\u2019s reasonable cause, where a real hardship, a medical event, or a disaster meant you couldn\u2019t file or pay on time.\n\nI\u2019ve had cases where removing the penalties changed the shape of the entire resolution, because the balance suddenly became something the client could handle.\n\nIt\u2019s one of the first things I check, right after the transcripts.\n\nThe IRS won\u2019t offer to take penalties off, you have to make the case for it.\n\nComment PLAN and let\u2019s map out whether your balance is padded with penalties we can challenge.", "trigger": ["Results & Testimonials"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-23", "rank": 159}, {"handle": "revivetherapyservices", "title": "A physical therapist came to me a while back, overwhelmed and completely out of ideas. She'd done therapy before, she kn", "views": 492, "comments": 0, "likes": 7, "outlier": 0.32, "followers": 1522, "video_url": "https://www.instagram.com/p/Dbgb9zMFWNQ/", "audio_url": "https://www.instagram.com/reels/audio/27715786104743808/", "hook": "", "transcript": "", "caption": "A physical therapist came to me a while back, overwhelmed and completely out of ideas. She'd done therapy before, she knew her patterns inside and out, and she suspected the answer had something to do with her body (she worked with bodies all day, after all!).\n \nShe was right!\n \nWe took a somatic approach, working with sensation and with what her body was holding, alongside EMDR. Over time she got back into her own body after years of living from the neck up (nobody warns you how common that is), and she learned to process her emotions instead of just managing them.\n \nThen she left an abusive relationship. That decision came from her, from a body that could finally feel what her thinking brain had spent years rationalizing.\n \nThese days she handles life stressors with a steadiness that used to feel completely out of reach for her!\n \nThat's what somatic work does. Your body has been keeping a record this ENTIRE time, and when you finally learn to listen to it, decisions that felt impossible start feeling obvious!\n \nIf you've spent years talking about your life and the symptoms haven't budged? That's information worth taking seriously. Consider this your sign to bring your body into the work!\n \nComment \"HEAL\" below and I'll send you the details!", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-01", "rank": 160}, {"handle": "corinne.naturopath", "title": "If you've done all the right things and nothing's landed, comment INFO and I'll show you what's blocking it.", "views": 489, "comments": 2, "likes": 9, "outlier": 0.14, "followers": 3531, "video_url": "https://www.instagram.com/p/DbeaYs2DICH/", "audio_url": "https://www.instagram.com/reels/audio/28118665534424446/", "hook": "If you're doing everything right and still feel stuck, your body has one job when it feels under attack.\nProtect you now, repair later.\nWhen it's fighting inflammation from food or stress, healing keeps getting bumped down to the bottom of the list.\nThat's why you can do all the right things and feel like nothing lands.\nAnd look at what's keeping that fight switched on, because that's what's blocking the rebuild.\nWhen the inflammation settles, your body finally gets a calm window to repair itself.\nGive it that window, and the work you're already doing starts to show.", "transcript": "If you're doing everything right and still feel stuck, your body has one job when it feels under attack.\nProtect you now, repair later.\nWhen it's fighting inflammation from food or stress, healing keeps getting bumped down to the bottom of the list.\nThat's why you can do all the right things and feel like nothing lands.\nAnd look at what's keeping that fight switched on, because that's what's blocking the rebuild.\nWhen the inflammation settles, your body finally gets a calm window to repair itself.\nGive it that window, and the work you're already doing starts to show.", "caption": "If you've done all the right things and nothing's landed, comment INFO and I'll show you what's blocking it.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-31", "rank": 161}, {"handle": "altaredstatesofconsciousness", "title": "If you've got all the insight and still can't feel better, comment WHOLE and i'll send you the details of working togeth", "views": 481, "comments": 0, "likes": -1, "outlier": 0.01, "followers": 44885, "video_url": "https://www.instagram.com/p/Db61_f4gKPI/", "audio_url": "https://www.instagram.com/reels/audio/28955791317343582/", "hook": "Your next self-help book is a smart way to avoid yourself.\nAll right, tough love because you can take it.\nYou're using your self-awareness to dodge the feeling under it.\nYou can describe the wound in perfect detail and you've never sat in it for 90 seconds without narrating.\nThe next book won't do it.\nAnother framework is one more place for you to stay in your head where it's safe.\nI say this as a woman who read every book on the shelf before I let anything move through me.\nThe part of you that keeps wrecking the good thing already has all the information.\nWhat she wants is a conversation.", "transcript": "Your next self-help book is a smart way to avoid yourself.\nAll right, tough love because you can take it.\nYou're using your self-awareness to dodge the feeling under it.\nYou can describe the wound in perfect detail and you've never sat in it for 90 seconds without narrating.\nThe next book won't do it.\nAnother framework is one more place for you to stay in your head where it's safe.\nI say this as a woman who read every book on the shelf before I let anything move through me.\nThe part of you that keeps wrecking the good thing already has all the information.\nWhat she wants is a conversation.", "caption": "If you've got all the insight and still can't feel better, comment WHOLE and i'll send you the details of working together", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-12", "rank": 162}, {"handle": "kdmueller", "title": "No offense, but. Everything after that comma is an offense you planned, and everyone in the room knows it.", "views": 477, "comments": 0, "likes": 9, "outlier": 0.4, "followers": 1194, "video_url": "https://www.instagram.com/p/Db4GoE1OhYk/", "audio_url": "https://www.instagram.com/reels/audio/26597599079898297/", "hook": "", "transcript": "", "caption": "No offense, but. Everything after that comma is an offense you planned, and everyone in the room knows it.\n\u00a0\nYou always, and you never. Absolutes turn feedback into a trial, and now you\u2019re arguing history instead of fixing Thursday.\n\u00a0\nIt\u2019s fine, said through your teeth. The resentment builds every day, and the person never finds out what fine was covering.\n\u00a0\nWe need to talk, sent at 5pm with no context. You\u2019ve wrecked their night and guaranteed a defensive morning, over something that took four minutes.\n\u00a0\nSome people are saying. Borrowed authority is a way to hide, own the feedback or keep it.\n\u00a0\nWhat I use instead fits in two sentences. The standard, then the belief. This missed, and I know you can close it.\n\u00a0\nIf your feedback keeps landing wrong, comment \u201cALIGNED\u201d and let\u2019s talk about it.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 163}, {"handle": "altaredstatesofconsciousness", "title": "people overcomplicate shadow work on purpose, so here it is with no jargon. it\u2019s not reliving your trauma or blaming you", "views": 467, "comments": 0, "likes": 2, "outlier": 0.01, "followers": 44885, "video_url": "https://www.instagram.com/p/DcAH7AfSZLL/", "audio_url": "https://www.instagram.com/reels/audio/27462799110087764/", "hook": "Let me explain what shadow work actually is in the plainest way I can.\nNo jargon.\nNo fear-mongering.\nShadow work is not reliving your trauma, and it's not blaming your parents.\nIt's understanding yourself so deeply that your patterns finally start to make sense.\nIt's meeting the parts of you you had to repress because someone told you they were unacceptable.\nAnd realizing those parts were never the problem.\nThey were trying to protect you.", "transcript": "Let me explain what shadow work actually is in the plainest way I can.\nNo jargon.\nNo fear-mongering.\nShadow work is not reliving your trauma, and it's not blaming your parents.\nIt's understanding yourself so deeply that your patterns finally start to make sense.\nIt's meeting the parts of you you had to repress because someone told you they were unacceptable.\nAnd realizing those parts were never the problem.\nThey were trying to protect you.", "caption": "people overcomplicate shadow work on purpose, so here it is with no jargon. it\u2019s not reliving your trauma or blaming your parents. it\u2019s understanding yourself so deeply your patterns finally make sense. it\u2019s meeting the parts you were taught to hide and realizing they were never the problem, they were protecting you \ud83d\udda4 start with my free 5-day series, linked in bio.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-14", "rank": 164}, {"handle": "kdmueller", "title": "picture this instead. you hand something off, a real thing, and you never touch it again.", "views": 467, "comments": 0, "likes": 15, "outlier": 0.39, "followers": 1193, "video_url": "https://www.instagram.com/reel/Db95vFkhVSI/?igsh=OWZiNmZnbXd6Mmds&igsi=OWZiNmZnbXd6Mmds", "audio_url": "https://www.instagram.com/reels/audio/2182945188490581/", "hook": "Can't breathe, uh Can't dance, can't", "transcript": "Can't breathe, uh Can't dance, can't", "captio er, you are at the event or gathering instead of canceling, and the people who know your history start to notice before you fully trust it within yourself.\nIt happens on this timeline because the foundations move in a certain order.\nThe first weeks are the assessment and starting to refill what's previously been empty, and by around three months, the energy and your steadiness has changed enough that your life looks different to the ones who are watching.\nThe method under it is fairly unglamorous, and that's exactly why it holds.\nYou feel the foundations, you repair what stopped absorbing, you replenish the vitamins and minerals your body runs on, and you let the results show up in the order the body actually heals in.\nThe text is the evidence, not the goal.\nWhen a friend asks, how did you fix your health?\nIt means that the change got big enough to be seen, and that is usually the moment women finally believe it's real.", "caption": "If you're quietly hoping to be the one people ask how you did it, comment INFO and I'll DM you where the first three months start.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-08", "rank": 170}, {"handle": "guy_finocchiaro", "title": "When a case lands on my desk, I don\u2019t take the client\u2019s number and I don\u2019t take the number the IRS gave them over the ph", "views": 410, "comments": 0, "likes": 2, "outlier": 0.37, "followers": 1103, "video_url": "https://www.instagram.com/p/DbjA6shSBGZ/", "audio_url": "https://www.instagram.com/reels/audio/198262126164087/", "hook": "", "transcript": "", "caption": "When a case lands on my desk, I don\u2019t take the client\u2019s number and I don\u2019t take the number the IRS gave them over the phone.\n\nI pull the account transcripts and read them line by line before I have an opinion.\n\nThis week I found a payment that was never credited, a penalty that qualified to come off, and a collection date closer to expiring than the client knew.\n\nThat never surfaces on its own.\n\nMost people treat the IRS number as the final number, and that assumption is expensive.\n\nThe agency makes mistakes constantly, and the way you catch them is by reading the record instead of trusting the letter.\n\nType PLAN in the comments and I\u2019ll get you the rundown of what we look for first.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-02", "rank": 171}, {"handle": "corinne.naturopath", "title": "The identity almost no one names out loud is the graduate.", "views": 409, "comments": 0, "likes": 11, "outlier": 0.12, "followers": 3531, "video_url": "https://www.instagram.com/p/Dbt2d2xgh-j/", "audio_url": "https://www.instagram.com/reels/audio/26755264467483075/", "hook": "", "transcript": "", "caption": "The identity almost no one names out loud is the graduate.\n\nShe is the woman who can say I used to have chronic Lyme, or I used to have mold illness, or I used to be the sick one, and say it without her voice catching. Her old lab work is a case study now, not a current event.\n\nFor a long time you may have been afraid to even claim the chronic illness label, because saying it felt like signing a contract you could never get out of. And you may be just as afraid to imagine the graduate, because hoping for her has cost you before.\n\nShe is the ordinary result of rebuilding your foundations in the right order and letting your body do what it was built to do, not a fantasy.\n\nThe goal is to need the protocols less and less until one day the whole thing is something you used to deal with, not to become an expert at managing this forever, collecting protocols like a second job.\n\nYou are allowed to want to graduate. That version of you is a real place, and wanting her is not naive.\n\nIf you're ready to stop managing this forever and start heading toward \"I used to,\" commen s.\n\nYou don\u2019t have to wait for the balance to hit zero to feel like yourself again, you need to know a competent person has the wheel.\n\nComment PLAN and I\u2019ll walk you through what getting that off your plate looks like.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-01", "rank": 174}, {"handle": "revivetherapyservices", "title": "A client of mine saved 12,000 dollars once her body finally believed it was safe enough to stop bracing. Comment \"[SAFE]", "views": 362, "comments": 0, "likes": 3, "outlier": 0.24, "followers": 1519, "video_url": "https://www.instagram.com/p/Db00v0yE0rd/", "audio_url": "https://www.instagram.com/reels/audio/27413925108307815/", "hook": "I have a client, when we started working together, $0 in savings, living paycheck to paycheck.\nFast forward to working with them, and they now have probably close to 10, 12K saved up, and it wasn't because they got a raise.\nHere's the thing when it comes to trauma, especially complex trauma and money.\nIt makes it really hard for you to plan for the future.\nCPTSD makes it so you're in this chronic state of hyper arousal, hyper vigilance, nothing in the world is safe.\nYou're always looking out for danger.\nAnd when your brain is in that mode, it turns off your ability to plan for the future.\nAnd that includes financial planning.\nWith this specific client, once we were able to bring her body back down to a place where safety was actually accessible, that's when that future planning part of her brain was able to start coming back online, and she was actually able to plan for her future and start putting away money.\nMy point is, maybe your issues with spending money don't actually have to do with money itself.\nIt has to do with a safety issue within your body.\nAnd maybe, just maybe, the treatment plan for that is to bring that safety back using bottom-up measures like EMDR, somatic experiencing, IFS, all that fun shit.\nThat's what I mean when I say therapy is an investment.\nIt's not just a money set, guys.", "transcript": "I have a client, when we started working together, $0 in savings, living paycheck to paycheck.\nFast forward to working with them, and they now have probably close to 10, 12K saved up, and it wasn't because they got a raise.\nHere's the thing when it comes to trauma, especially complex trauma and money.\nIt makes it really hard for you to plan for the future.\nCPTSD makes it so you're in this chronic state of hyper arousal, hyper vigilance, nothing in the world is safe.\nYou're always looking out for danger.\nAnd when your brain is in that mode, it turns off your ability to plan for the future.\nAnd that includes financial planning.\nWith this specific client, once we were able to bring her body back down to a place where safety was actually accessible, that's when that future planning part of her brain was able to start coming back online, and she was actually able to plan for her future and start putting away money.\nMy point is, maybe your issues with spending money don't actually have to do with money itself.\nIt has to do with a safety issue within your body.\nAnd maybe, just maybe, the treatment plan for that is to bring that safety back using bottom-up measures like EMDR, somatic experiencing, IFS, all that fun shit.\nThat's what I mean when I say therapy is an investment.\nIt's not just a money set, guys.", "caption": "A client of mine saved 12,000 dollars once her body finally believed it was safe enough to stop bracing. Comment \"[SAFE]\" and I'll send you my Therapize Yourself worksheet so you can start where she did.", "trigger": ["Results & Testimonials"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-09", "rank": 175}, {"handle": "corinne.naturopath", "title": "Before you buy one more bottle, comment INFO and I'll tell you what to fix first.", "views": 361, "comments" d is to believe that too.\nA fill feels faster.\nYou're not removing everything.\nYou are just topping up the growth and you tell yourself you saved 20 minutes.\nYou did not save 20 minutes to move them.\nEvery fill leaves old product behind and old product hides lifting and debris in the middle of the nail that you cannot see under fresh gel.\nTwo, three fills later, you are chasing a set that keeps failing and you cannot figure out why.\nA fill is a tax you pay because the removal underneath scared you.\nThat is the honest version.\nWhen removal is slow and messy, of course you avoid it.\nSo you keep layering on top and hoping the foundation holds.\nIt does not hold and the client feels the bulk before she can explain it.\nI know the fix is boring and it is the whole game.\nDo a full overlay every time, remove 95 to 99 percent, start clean, rebuild the structure with less product, and you get a set that lasts because there's nothing rotten underneath it.\nLess is more was never a slogan, actually was a removal standard.\nI know a full removal feel risky when your days are packed, but the packed day is caused by the fills because every failing set comes back as a midweek fix.\nDo the removal and the midweek texts stop, and suddenly your chair feels calm.", "caption": "If you're doing fills because full removals feel too slow, comment \"BUILDER\" and I'll DM you the one-bit removal that makes a full overlay faster than your fill.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-11", "rank": 177}, {"handle": "jolihappynails", "title": "If \"I'm still learning\" has been your reason to not raise your rate, comment \"RETENTION\" and I'll DM you the free call s", "views": 355, "comments": 1, "likes": 19, "outlier": 0.12, "followers": 2872, "video_url": "https://www.instagram.com/p/Db7HLPsAFQ8/", "audio_url": "https://www.instagram.com/reels/audio/37551886861126264/", "hook"

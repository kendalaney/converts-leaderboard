"rank": 73}, {"handle": "elle.hypnotherapy", "title": "Not another self-help book you\u2019ll put down by chapter 3. Not another app subscription. Not another promise to journal th", "views": 2369, "comments": 2, "likes": 12, "outlier": 0.28, "followers": 8355, "video_url": "https://www.instagram.com/p/DbyWcKGtyiI/", "audio_url": "https://www.instagram.com/reels/audio/26280495481642475/", "hook": "", "transcript": "", "caption": "Not another self-help book you\u2019ll put down by chapter 3. Not another app subscription. Not another promise to journal that fades by Thursday. Support in your ears\u2026made specifically for baby loss\u2026that meets you inside the actual hard moments. I\u2019m biased, obviously \ud83d\ude05. I made it. But let me tell you what I made it this way. After my triplets died, the gap I kept falling into wasn\u2019t the weekly-session gap. It was Tuesday at 4pm, ambushed in a shop. It was 2am, wide awake, brain refusing to switch off. The moments between support, where nothing could reach me. The Loss Mama Survival Kit is for those exact moments. Three guided audios and extra support tools. Instant access. Recorded by a therapist who\u2019s personally lived every one of those ambushes. Moms tell me it\u2019s the first thing that met them where they actually were\u2026in the mess, mid-wave. Not in some calm hypothetical where they had energy for a workbook. $36. One small decision. And this year gets a floor under it. If it\u2019s one thing this year, mama\u2026let it be the thing built for your hardest moments \ud83e\udd0d Comment \u201cKIT\u201d and I\u2019ll DM you everything you need. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-08", "rank": 74}, {"handle": "elle.hypnotherapy", "title": "One\u2026talking about your grief is a bandaid on a bullet wound. It helps at first, it truly does. But until you get the bul", "views": 2316, "comments": 14, "likes": 32, "outlier": 0.28, "followers": 8355, "video_url": "https://www.instagram.com/p/DbQ4EthNwlg/", "audio_url": "https://www.instagram.com/reels/audio/193374545400363/", "hook": "", "transcript": "", "caption": "One\u2026talking about your grief is a bandaid on a bullet wound. It helps at first, it truly does. But until you get the bullet out and close the wound, you can\u2019t heal properly. Two\u2026you never have to \u2018accept\u2019 that your baby died in order to heal. Grief and joy can coexist. Healing actually means a stronger connection to your baby, because pain stops being your main anchor to them. Three\u2026healing can happen so much faster than anyone tells you. Moving forward in months instead of years doesn\u2019t mean you loved them less. It means you did the work. Four\u2026generic grief support isn\u2019t enough for baby loss. Losing your baby means losing a whole future you\u2019d already built in your heart. That deserves support designed for exactly that. I didn\u2019t find these beliefs in a text book. I found them after my triplets died, when I couldn\u2019t find a single person offering what I actually needed. So I trained, and trained, and built it myself. Psychology degree, hypnotherapy, NLP, Superconscious breakthrough therapy\u2026more trauma training than I can list. Four years and 150+ moms later, these hills have held up. I\u2019m not climbing down \ud83e\udd0d Drop a \u2018METHOD\u2019 in the comments if you want the full breakdown. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-26", "rank": 75}, {"handle": "jolihappynails", "title": "Nail Techs, you know that thing you do where you write a booking in your paper planner, then again in your phone calenda", "views": 2287, "comments": 0, "likes": 18, "outlier": 0.8, "followers": 2872, "video_url": "https://www.instagram.com/p/Db9aNzBJbrs/", "audio_url": "https://www.instagram.com/reels/audio/184302697727078/", "hook": "", "transcript": "", "caption": "Nail Techs, you know that thing you do where you write a booking in your paper planner, then again in your phone calendar, then on a sticky note stuck to the desk?\n\nThat is not you being organized. That is what it looks like when losing one booking feels like it could end you. I know that feeling because I have lived close to it.\n\nWhen your income depends entirely on a full week, a single missed appointment stops being an error and starts feeling like proof the whole thing is fragile. So you triple write everything and you still check it four times a night.\n\nThe three-place system is a symptom. The real problem is that your calendar is not stable enough for your nervous system to trust it.\n\nWhen retention is low and half your bookings are one-time clients, of course every slot feels precious, because you do not know if it comes back.\n\nThe fix is not a better planner. The fix is client retention, so the same faces fill your week on repeat and you stop bracing for the empty slot.\n\nWhen your regulars book their next appointment in the chair before they leave, the sticky notes disappear on their own. You deserve a week you do not have to guard like it might run away. xx \ud83d\udc8e\n\nIf you write your bookings in three places because losing one feels terminal, comment \"RETENTION\" and I'll DM you the in-chair rebooking habit that steadied my calendar.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-13", "rank": 76}, {"handle": "dragana.jasprica", "title": "Low carb is one of the sneakiest traps for women who lift, because at first it looks like it\u2019s working. \ud83d\ude2c", "views": 2224, "comments": 8, "likes": 11, "outlier": 0.05, "followers": 42593, "video_url": "https://www.instagram.com/p/Db5AMcahXFW/", "audio_url": "https://www.instagram.com/reels/audio/846563127666323/", "hook": "", "transcript": "", "caption": "Low carb is one of the sneakiest traps for women who lift, because at first it looks like it\u2019s working. \ud83d\ude2c\n\n(btw if you want my exact macro + meal timing structure that I use with all my clients so they finally look like they lift, comment \u201cMACROS\u201c \ud83c\udf5d) \n\nYou cut the carbs, the scale drops a little, and you think you\u2019ve found the thing that finally works.\n\nSo you keep going. Less bread, less rice, less fruit. \u201eEarning\u201c the few carbs you let yourself have.\n\nAnd it makes sense, because it\u2019s the message everywhere. \n\n\u261d\ud83c\udffc\u00a0Carbs spike your insulin. \n\u261d\ud83c\udffc\u00a0Carbs are keeping you soft. \n\u261d\ud83c\udffc\u00a0Cut them and you\u2019ll finally lean out.\n\nBut going lower and lower doesn\u2019t lean you out. It does the opposite.\n\nBecause you\u2019re not a couch potato. You lift, you do your cardio, and your body needs to be fueled for that. Strip the carbs while you\u2019re training hard and your body gets stressed, and a stressed body gets inflamed and looks softer\u2026 not leaner. \ud83e\udee0\n\nSo now you\u2019re hunting for a snack all afternoon, never quite satisfied. Foggy and slow, reaching for another coffee. Soft no matter how clean you eat. Your sessions leaving you drained instead of stronger. And feral for something sweet by 9pm. \ud83c\udf6b\n\nYet here you are convinced you just have a sweet tooth.\n\nWhat no one tells you: it\u2019s not your age, your hormones, your metabolism or the self-declared sugar addiction. \n\nThat\u2019s three so-called stress hormones, cortisol, adrenaline and glucagon, climbing because you took away the fuel your body actually runs on.\n\nI lived this one myself. \n\nWhen I went low carb, I didn\u2019t get leaner, I got softer and the scale climbed. I have almost no photos from that time. The day I strategically brought carbs back up again, my body finally started changing.\n\n\u2705\u00a0A short, strategic lower carb phase for a real reason is one thing. \n\n\u274c\u00a0Living low carb as your everyday way of eating, while you lift and do cardio, will backfire every time.\n\nCarbs aren\u2019t what\u2019s keeping you soft. Not knowing how to fuel your body with", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-11", "rank": 77}, {"handle": "corinne.naturopath", "title": "If eating the \"right\" food for your body has turned into a test you feel like you keep failing, this is the year I'd lov", "views": 2220, "comments": 0, "likes": 6, "outlier": 0.63, "followers": 3531, "video_url": "https://www.instagram.com/p/DbbFWr4FDBX/", "audio_url": "https://www.instagram.com/reels/audio/37610801291899252/", "hook": "", "transcript": "", "caption": "If eating the \"right\" food for your body has turned into a test you feel like you keep failing, this is the year I'd love for you to change what it means to you.\n\nFor so many of the women I work with, this has nothing to do with weight. The fear is about what the food might set off. The bloating, the histamine flare, the blood sugar crash, the symptom you can't quite predict.\n\nAnd the confusing part is it happens even with the clean food. You picked the good, healthy, whole thing, did everything right, and your body still reacted. So you start wondering if there's anything actually safe to eat.\n\nWhat turns it around is seeing those reactions for what they are. Your body is inflamed and depleted right now, so even good food can feel like too much for it to handle. Once you rebuild what it's missing, more vitamins and minerals, more protein, more of what it can actually use, it stops treating normal food like a threat.\n\nThe fear loosens on its own once your body starts feeling steady after you eat.\n\nIf you're ready to stop dreading your own plate, comment INFO and I'll show you where I'd start.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-30", "rank": 78}, {"handle": "susiebower_", "title": "Twenty five years of bodywork and eight surgeries of my own. I did not read about the body keeping the score. I lived it", "views": 2216, "comments": 3, "likes": 10, "outlier": 7.62, "followers": 291, "video_url": "https://www.instagram.com/reel/Db-MCsLKP9b/?igsh=MXJheXhjY2pyaWVmcg==", "audio_url": "https://www.instagram.com/reels/audio/26606461265703434/", "hook": "", "transcript": "", "caption": "Twenty five years of bodywork and eight surgeries of my own. I did not read about the body keeping the score. I lived it. \n\nIf your pain keeps outsmarting every fix, you want someone who has been on both sides of it. Book a call in my bio. \n\n#chronicpain #backpain #somatichealing #nervoussystem", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-13", "rank": 79}, {"handle": "altaredstatesofconsciousness", "title": "save this one, babe. the way home to yourself isn't a personality transplant. it's learning to feel your own yes land be", "views": 2202, "comments": 0, "likes": 18, "outlier": 0.05, "followers": 44885, "video_url": "https://www.instagram.com/p/DcAeho2BmH1/", "audio_url": "https://www.instagram.com/reels/audio/27789881233963466/", "hook": "Just trust me you'll be fine And when I'm back in Chicago I feel", "transcript": "Just trust me you'll be fine And when I'm back in Chicago I feel", "caption": "save this one, babe. the way home to yourself isn't a personality transplant. it's learning to feel your own yes land before you consult everyone else's comfort. it's meeting the part that taught you to override it. it's letting one person witness what you've always carried alone. this is the same roadmap i walk with my 1:1 clients \ud83d\udda4", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-14", "rank": 80}, {"handle": "allandib", "title": "You used to be in by six because the day didn't start until you arrived. Now you stroll in at nine, and the three things", "views": 2167, "comments": 1, "likes": 13, "outlier": 0.36, "followers": 6053, "video_url": "https://www.instagram.com/p/Dbt863VDSi-/", "audio_url": "https://www.instagram.com/reels/audio/28225068270420907/", "hook": "", "transcript": "", "caption": "You used to be in by six because the day didn't start until you arrived. Now you stroll in at nine, and the three things that would have been sitting on your desk are already handled.\n\nSomebody made the call you would have made. The proposal went out without your eyes on it. The client who only ever asked for you got a great answer from someone who wasn't you and didn't even think to consult you.\n\nThis is what owning the system really looks like. It buys you the same hours you always had, except now your hands are off the controls and the business still moves. The strategy that used to live in your head now lives on a page your team follows.\n\nThe first morning it happens, you feel a strange mix of pride and uselessness. The uselessness is the point. When the business needs you less, you've stopped having a job and started owning one.\n\nIf you want to build toward mornings that look like this, comment LEAN and I'll show you the one page it starts with.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 81}, {"handle": "dragana.jasprica", "title": "For years now, you\u2019ve been stuck trying to shrink yourself.", "views": 2136, "comments": 4, "likes": 8, "outlier": 0.05, "followers": 42593, "video_url": "https://www.instagram.com/p/DbpjY2Th964/", "audio_url": "https://www.instagram.com/reels/audio/1683782555941486/", "hook": "", "transcript": "", "caption": "For years now, you\u2019ve been stuck trying to shrink yourself. \n\u00a0\n\ud83e\udee0 Semi-strict Monday to Friday\n\ud83e\udee0 Loose on the weekend\n\ud83e\udee0 Always a little bit on a diet and\n\ud83e\udee0 Never actually getting anywhere. \n\u00a0\nSound familiar?\n\u00a0\nAnd that has quietly cost you a DECADE of looking exactly the same.\n\u00a0\nSo here\u2019s the re-brand \ud83d\udc47\ud83c\udffc\n\u00a0\nYou stop trying to shrink, and you become a woman who BUILDS. Who takes up space. Who eats enough to actually get strong. \n\u00a0\nAnd yes, who still cuts hard for one short, focused window when the data says go, but then LEAVES it and goes back to building.\n\u00a0\nBecause you were BUILT FOR MORE than making yourself smaller.\n\u00a0\nIt means your training and your nutrition finally come from ONE place, pointed at ONE goal. Instead of a trainer pulling you one way and some app pulling you the other, with the two never adding up to anything.\n\u00a0\n\ud83d\ude45\ud83c\udffc\u200d\u2640\ufe0f The women I coach stop introducing themselves as someone \u201etrying to lose a few kilos.\u201c \n\u00a0\n\ud83d\udc81\ud83c\udffc\u200d\u2640\ufe0f They start training like the athlete they\u2019ve been all along, and their body finally starts to show it.\n\u00a0\n2026 is the year you stop shrinking and start taking up space. \ud83d\udcaa\ud83c\udffc\n\u00a0\nIf you\u2019re ready to stop shrinking and finally build...\n\u00a0\n\u2705 Comment LOOK\nand I\u2019ll send you my free masterclass on how we do it.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-05", "rank": 82}, {"handle": "guy_finocchiaro", "title": "Picture the IRS leaving you alone. No more letters, no threat of a levy, the case marked resolved.", "views": 2126, "comments": 0, "likes": 13, "outlier": 1.93, "followers": 1103, "video_url": "https://www.instagram.com/p/DbrOtcmSJTS/", "audio_url": "https://www.instagram.com/reels/audio/26261188156890234/", "hook": "", "transcript": "", "caption": "Picture the IRS leaving you alone. No more letters, no threat of a levy, the case marked resolved.\n\nThis is the path I\u2019d take.\n\nFirst, pull my transcripts so I know the real balance and every deadline attached to it.\n\nSecond, get every unfiled return in, because the IRS won\u2019t close anything while years are missing.\n\nThird, put power of attorney in place so the agency deals with my representative and I stop being the one on hold explaining my life.\n\nFourth, lock in the right resolution for my numbers and stay compliant so nothing reopens.\n\nThat last step is the one people skip. Getting resolved and staying resolved take different work, and the clients who never come back keep filing and paying on time afterward.\n\nDone together, these are what put a case to bed.\n\nIf that\u2019s the outcome you want, comment PLAN and I\u2019ll send it over.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-05", "rank": 83}, {"handle": "elle.hypnotherapy", "title": "I still take my own medicine. Every tool I teach my clients, I use on myself\u2026because becoming a grief therapist didn\u2019t m", "views": 2119, "comments": 0, "likes": 17, "outlier": 0.25, "followers": 8355, "video_url": "https://www.instagram.com/p/DbqoF8WN9b8/", "audio_url": "https://www.instagram.com/reels/audio/972775955389908/", "hook": "", "transcript": "", "caption": "I still take my own medicine. Every tool I teach my clients, I use on myself\u2026because becoming a grief therapist didn\u2019t make me exempt from grief. The waves still find me. I just know how to ride them now. I talk to my babies in the garden. Out loud, sometimes mid-weeding. The tomatoes don\u2019t judge. I mark their dates before I check anyone else\u2019s calendar. Client work get scheduled around my triplets days\u2026never over them. I cry about client wins. When a mom tells me she got through her first baby shower, or that she\u2019s pregnant again and leading with hope instead of fear? I\u2019m a mess, every time. The best kind of mess. And sometimes, before a heavy session, I sit in the car with a metal album turned up far too loud. Healing comes in many forms. Mine occasionally has a drum solo in it. I share all this because there\u2019s a myth that healed means finished. Polished. Untouchable. I\u2019m five years in. A mother of four. And I carry my three alongside everything I do. Healing gave me a life around my grief\u2026not a life without it. That\u2019s what I want for you too, mama. The real version \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-05", "rank": 84}, {"handle": "dragana.jasprica", "title": "Let\u2019s actually do the math on this, because it\u2019s kinda brutal. \ud83e\udee0", "views": 2100, "comments": 0, "likes": 9, "outlier": 0.05, "followers": 42593, "video_url": "https://www.instagram.com/p/DbgHLsmBF-e/", "audio_url": "https://www.instagram.com/reels/audio/346242446101360/", "hook": "", "transcript": "", "caption": "Let\u2019s actually do the math on this, because it\u2019s kinda brutal. \ud83e\udee0\n\nStrict Monday to Friday. Loose all weekend. And across the week it averages out to\u2026 maintenance.\n\nSo you spend all that discipline and your body doesn\u2019t change.\n\nSome of you have been doing this for TEN years. That\u2019s a decade of dieting to weigh the same. Read that again.\n\nA real fat loss phase looks nothing like that from week one.\n\nYou stay fed through the day, so the weekend stops being the release valve. And the deficit becomes something we can actually SEE in your weight trend, instead of something you\u2019re hoping is happening.\n\nYour lifts get tracked the whole way, because the whole point is losing fat while you get STRONGER.\n\nMost of our clients even hit PBs in a fat loss phase. The second that stops being true, the numbers tell us immediately.\n\nAnd it ends on a date we picked BEFORE it started, with your reverse diet already waiting on the other side.\n\nThen comes the part you never get to when you\u2019re permanently mid-diet. Months at maintenance or in a surplus, lifting heavier, thinking about food way less, while your shape changes in a way no deficit could ever give you.\n\nYou\u2019ve HAD the discipline this whole time. It\u2019s just been going into a cycle that was never going to get you there.\n\nPoint it at one phase with an end date and watch what happens.\n\nIf you\u2019re done doing this alone and you want a step by step roadmap with your phases locked in...\n\n\u2764\ufe0f\u200d\ud83d\udd25 Comment \u201cAUDIT\u201d and I\u2019ll personally reach out to see if you qualify for our body composition audit where we review what you\u2019re missing to achieve your dream physique and lay out the plan how to fix it.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-01", "rank": 85}, {"handle": "elle.hypnotherapy", "title": "Some corners of the healing world love a silver lining. Everything happens for a reason. Your angel chose you. What is t", "views": 2058, "comments": 0, "likes": 52, "outlier": 0.25, "followers": 8355, "video_url": "https://www.instagram.com/p/DbtM2Tgt87Z/", "audio_url": "https://www.instagram.com/reels/audio/383640680154480/", "hook": "", "transcript": "", "caption": "Some corners of the healing world love a silver lining. Everything happens for a reason. Your angel chose you. What is this teaching you? I will never do that to you. And I want you to know why. Your baby dying was not a lesson. There\u2019s nothing hidden inside the loss that makes it make sense\u2026and searching for one just hands you another impossible job on top of your grief. What I\u2019ve seen instead, across 150+ loss moms, is this. Meaning is something you build, not something you find buried in the loss. You build it in how you carry your baby forward. In who you become. In the other moms you quietly help years later, just by surviving out loud. That\u2019s completely different from a lesson. A lesson says the loss had a purpose. Meaning says you made something beautiful out of a thing that never should\u2019ve happened. I built my whole practice out of losing my triplets. Does that make their deaths worth it? No. Nothing ever could. But it makes them present in everything I do. That\u2019s not a silver lining, mama. That\u2019s their legacy. And I chose it. You get to choose yours too\u2026in your own time, with no homework attached \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 86}, {"handle": "elle.hypnotherapy", "title": "It\u2019s one of the most common messages I get. \u201cThe invite came. I want to go, I love her\u2026but I don\u2019t know if I can do it.\u201d", "views": 2005, "comments": 5, "likes": 39, "outlier": 0.24, "followers": 8355, "video_url": "https://www.instagram.com/p/DblecA2NEK4/", "audio_url": "", "hook": "", "transcript": "", "caption": "It\u2019s one of the most common messages I get. \u201cThe invite came. I want to go, I love her\u2026but I don\u2019t know if I can do it.\u201d First, mama\u2026whatever you decide is allowed. Going is allowed. Declining is allowed. Going for twenty minutes and quietly leaving is allowed. There is no version that makes you a bad friend. If you do go, we prepare your body before we worry about your feelings. You calm your nervous system on the way there\u2026not in the toilets mid-panic. You plan your exit in advance, so leaving is a decision instead of an escape. And afterwards? You treat yourself like someone who just did something enormous. Because you did. No replaying the moments you went quiet. No grading yourself on how well you performed. My clients used to survive these events on white knuckles alone. Now they walk in with support in their ears\u2026literally. Guided audios made for exactly these moments. Before, during the car park wobble, and after. That\u2019s why I built the Survival Kit. For real moments\u2026the ones no therapy homework ever covered \ud83e\udd0d Want to learn more? Comment \u201cKIT\u201d and I\u2019ll send it your way. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-03", "rank": 87}, {"handle": "elle.hypnotherapy", "title": "Most loss moms are doing this backwards\u2026and it\u2019s not their fault. They\u2019re trying to think their way through a grief wave", "views": 1941, "comments": 3, "likes": 21, "outlier": 0.23, "followers": 8355, "video_url": "https://www.instagram.com/p/DbTc2rdtYPJ/", "audio_url": "https://www.instagram.com/reels/audio/792811833877357/", "hook": "", "transcript": "", "caption": "Most loss moms are doing this backwards\u2026and it\u2019s not their fault. They\u2019re trying to think their way through a grief wave while their body is in full alarm. When something triggers you, your nervous system reacts before your thoughts even load. Heart racing. Chest tight. Tears already coming. That\u2019s biology, mama. Not weakness. So the order matters. Body first\u2026breath, grounding, a voice guiding you back down. Then, once your system settles, your mind can actually do something with what it\u2019s feeling. This one change is why my clients stop losing entire days to a single trigger. The wave still comes. But it moves through them in minutes, instead of wrecking the whole afternoon. Does it take years of practice? No. It takes the right tools and a little repetition. I recorded three guided audios for exactly these moments\u2026the supermarket car park moments, the 2am moments, the just-saw-the-annoucement moments. They live inside The Loss Mama Survival Kit, and moms tell me they\u2019ll come back to them for years. Because support shouldn\u2019t only exist inside a therapy session. It should be there the moment you need it \ud83e\udd0d Comment \u2018KIT\u2019 and I\u2019ll DM you everything you need. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-27", "rank": 88}, {"handle": "dragana.jasprica", "title": "Add up what the last few years actually cost you.", "views": 1901, "comments": 0, "likes": 17, "outlier": 0.04, "followers": 42593, "video_url": "https://www.instagram.com/p/DbhuKSPBZrc/", "audio_url": "https://www.instagram.com/reels/audio/221276381853734/", "hook": "", "transcript": "", "caption": "Add up what the last few years actually cost you.\n\nThere was the trainer who never once asked about your food.\n\nThe nutritionist who never looked at your training.\n\nAnd probably a program you bought at 11pm and quietly dropped by week three. \ud83e\udee0\n\nMost women who apply to work with us have spent THOUSANDS over the years, and they\u2019re still standing in front of the mirror looking soft. \ud83d\udcb8\ud83d\udcb8\ud83d\udcb8\n\nOne of them had a personal trainer AND a nutritionist.\n\nShe gained 14kg in 8 months and had to buy jeans three sizes bigger. And no, she did not look like she lifted.\n\nWhat actually works is one coach running both, toward one goal at a time.\n\nYou get fueled first. You cut ONCE, with an end date. You reverse out when it\u2019s done. THEN you spend real months building, which is where the shape you\u2019ve been cutting for all these years finally gets made.\n\nAnd our clients do all of this with busy lives.\n\nBusinesses, kids, travel weeks. Without overhauling everything either.\n\nWe take what you\u2019re already doing and tweak it so it\u2019s specific and intentional.\n\nOne of our best results came from a woman whose training we nearly cut in HALF.\n\nTen years of half-fixes costs more than any coach ever will. In money, and in time you can\u2019t buy back.\n\nIf you\u2019re done piecing it together from different places and hoping it adds up...\n\n\ud83d\udcac Comment \u201cTRANSFORM\u201d\nand I\u2019ll get back to you and walk you through how we\u2019d do it for you.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-02", "rank": 89}, {"handle": "jolihappynails", "title": "Nail Techs, someone once called me the Queen of Simple, and I understood what they meant, but here is how I actually see", "views": 1870, "comments": 0, "likes": 30, "outlier": 0.65, "followers": 2872, "video_url": "https://www.instagram.com/p/Db7N2qohjKS/", "audio_url": "https://www.instagram.com/reels/audio/1263941094320818/", "hook": "", "transcript": "", "caption": "Nail Techs, someone once called me the Queen of Simple, and I understood what they meant, but here is how I actually see it. I am more of a sculptor than a painter.\n\nThe foundation being perfect is what makes the artsy parts on top look greater. The best techs are not the ones with the flashiest designs. They are the ones obsessed with structure, because they know decoration sits on top of a foundation and a bad foundation shows through everything.\n\nPainters fix problems on the surface. Sculptors prevent them underneath. This is an identity choice, not just a technique. When you decide you are a sculptor of the nail, you stop chasing trends for the feed and start building the underlying structure that makes a set last six weeks and a client stay six years. The art becomes the easy part once the sculpture is right.\n\nYou are allowed to be known for the structure nobody photographs. That is where the money and the loyalty actually live.\n\nLess is MORE was never about doing less, it was about the foundation being so right that nothing loud is needed. Decide which one you are. Then build like it. xx \ud83d\udc8e\n\n If you want to work like a sculptor of the nail instead of a painter, comment \"RETENTION\" and I'll DM you where structure-first actually starts.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 90}, {"handle": "themckensiem", "title": "The conservative church handed you submission. Shrink, follow, defer, and call it godly.", "views": 1842, "comments": 0, "likes": 12, "outlier": 12.28, "followers": 150, "video_url": "https://www.instagram.com/p/DbPURk6tul5/", "audio_url": "https://www.instagram.com/reels/audio/1741362503149150/", "hook": "", "transcript": "", "caption": "The conservative church handed you submission. Shrink, follow, defer, and call it godly.\n\nThe culture handed you dominance. Decenter men, need nothing, and call it healed.\n\nBoth took a piece of truth and taught it as the entire truth, and Christian single women are standing in the gap between them, unable to believe either one all the way.\n\nThe original Hebrew of Genesis offers a third option. Ezer Kenegdo. Warrior companion. Equal and strong, standing face to face. Not beneath a man, and not armored against him.\n\nIt requires more of both people. A woman who thinks for herself, evaluates for herself, and brings full strength into partnership. A man formed enough to want that woman instead of fearing her.\n\nThis changes how you date. There\u2019s no softness to perform and no independence to prove. You\u2019re evaluating whether a man can stand beside the woman you are, at full strength.\n\nMost women have never been taught this. It changed what I looked for, and it\u2019s the foundation of everything I teach.\n\nWant to learn more? Comment \u201cDiscern\u201d and I\u2019ll reach out. \n\n#ChristianDating #DatingDiscernment #EzerKenegdo #ChristianSingleWomen #BiblicalWomanhood", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-26", "rank": 91}, {"handle": "corinne.naturopath", "title": "When I was climbing out of my worst years, I stopped chasing the fancy stuff and got clear on the few things my body act", "views": 1817, "comments": 2, "likes": 7, "outlier": 0.51, "followers": 3531, "video_url": "https://www.instagram.com/p/DbdqrE6lbEV/", "audio_url": "https://www.instagram.com/reels/audio/28039286415666621/", "hook": "", "transcript": "", "caption": "When I was climbing out of my worst years, I stopped chasing the fancy stuff and got clear on the few things my body actually needs to do its job.\n\nWhat I figured out is that my body doesn't care much about calories. It cares about absorbing enough nutrients. So everything I do now comes back to that.\n\nThe first piece is food. I eat the things my body recognizes as nourishing, and I pull back on the ones it treats as a threat and mounts an inflammatory response to. That alone changed how much I actually got out of every meal.\n\nThe second is a multivitamin and a multimineral. I used to think that was overkill, until I looked at the numbers. An orange today has about eight times less vitamin C than one did sixty years ago. There's no eating your way out of that. Nobody can eat eight times the food just to hit the basic vitamins and minerals a body needs. That gap is really malnutrition, and over time it's what turns into chronic illness.\n\nThe third is moving through cycles of feasting and fasting to stay fat adapted. That's what keeps my body metabolically flexible, so it can cleanse, detox, and manage its own blood sugar without me forcing it.\n\nThese are my non negotiables. They're the foundation my own body runs on, and I only landed on them after trying a hundred other things first.\n\nIf you feel like you've already done the real breakfast, the protein before actually needs, before you touch a fat loss phase.\n\n\u2705 More energy.\n\u2705 Cravings gone.\n\u2705 The food noise quiets down.\n\u2705 And for the first time in years, you know exactly what you\u2019re doing and why.\n\nYou found the right corner of the internet.\n\nAnd if you want that answer to \u201cshould I cut or build,\u201d that\u2019s exactly what the first 14 days of our 4-week Sculpt Challenge give you. We start Aug 3rd.\n\n\ud83d\udc98 Comment \u201cSCULPT\u201d and I\u2019ll send you the link.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-31", "rank": 93}, {"handle": "dragana.jasprica", "title": "I\u2019m looking for the business owner who treats her body like one more project she should be able to optimise, and can\u2019t w", "views": 1738, "comments": 0, "likes": 32, "outlier": 0.04, "followers": 42593, "video_url": "https://www.instagram.com/p/DbkS5ARBTUI/", "audio_url": "https://www.instagram.com/reels/audio/462137087554819/", "hook": "", "transcript": "", "caption": "I\u2019m looking for the business owner who treats her body like one more project she should be able to optimise, and can\u2019t work out why it\u2019s the one project that refuses to respond. \ud83e\udee0\n\nI\u2019m looking for the coach who gives brilliant advice to other women all day long, while her own physique hasn\u2019t budged in years.\n\nAnd I\u2019m looking for the woman who trains at 6am before a full day of meetings, travels for work regularly, and is SO tired of coaches handing her rigid plans that fall apart the second she\u2019s away.\n\nI know she\u2019s out there. She messages me sometimes.\n\nEvery one of them has trained seriously for YEARS. And every one of them has progress photos that stopped changing a long time ago.\n\nWe built Women Strength Society for exactly her.\n\nOne system, where the training and the nutrition finally point at the same goal, and every decision gets made from her DATA instead of a guess.\n\nMore than 500 women in 6 years. And the pattern repeats so often that we can usually describe a woman\u2019s last few years back to her before she\u2019s told us a thing. \ud83d\ude0f\n\nSo do your thing, algorithm.\n\nShe\u2019s out there deadlifting more than her colleagues would ever believe, and still throwing a hoodie over all of it.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-03", "rank": 94}, {"handle": "elle.hypnotherapy", "title": "Year one, I said yes to everything. The gatherings. The visits. The conversations I wasn\u2019t ready for. Yes, because sayin", "views": 1733, "comments": 3, "likes": 40, "outlier": 0.21, "followers": 8355, "video_url": "https://www.instagram.com/p/DbbLP4-NOpZ/", "audio_url": "https://www.instagram.com/reels/audio/878551928566397/", "hook": "", "transcript": "", "caption": "Year one, I said yes to everything. The gatherings. The visits. The conversations I wasn\u2019t ready for. Yes, because saying no needed an explanation\u2026and my explanation made rooms go quiet. The gender reveal I attended eleven weeks after my triplets died still lives somewhere in my body. I smiled through the whole thing. I don\u2019t remember the drive home. So this is the boundary I\u2019d set a hundred times over\u2026\u201dI\u2019m not able to come, but I\u2019m so happy for you.\u201d Full stop. No essay attached. No proof of grief required. And you know what? The people worth keeping accepted it with love. Almost everyone did. The disaster I kept bracing for existed mostly in my head\u2026and the few who huffed about it told me everything I needed to know. What I actually taught people that first year, with all my brave yeses, was that I was fine. Then I quietly resented them for believing me. A boundary is just information, mama. It teaches people how to love you accurately. One sentence. No explanation. You\u2019re allowed\u2026starting today \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-30", "rank": 95}, {"handle": "elle.hypnotherapy", "title": "Their anniversary doesn\u2019t sneak up on me anymore. I see it coming weeks out\u2026I plan for it like the significant day it is", "views": 1721, "comments": 0, "likes": 19, "outlier": 0.21, "followers": 8355, "video_url": "https://www.instagram.com/p/DbgU4d8NZyp/", "audio_url": "https://www.instagram.com/reels/audio/818824557636756/", "hook": "", "transcript": "", "caption": "Their anniversary doesn\u2019t sneak up on me anymore. I see it coming weeks out\u2026I plan for it like the significant day it is. I clear the calendar. No client sessions, nothing that needs me to be \u201con.\u201d I learned the hard way pretending it\u2019s a normal day costs me double the next day. I do our rituals. Candles, their garden spot, the things that are just ours. Connection on purpose, instead of pain by ambush. I let Sonny be part of it in his own three-year-old way. He knows he has siblings. Their names are normal words in this house. And I keep my tools close\u2026the same ones I teach my clients. Because a wave will still come, and I\u2019d rather ride it than fight it. The part that took me years to learn? The dread of the date is almost always worse than the date itself, when you meet it prepared instead of blindsided. The hard dates never stop being hard, mama. But they stopped being days I just survive. Now they\u2019re days I spend with my babies. And there\u2019s something almost sacred in that \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-01", "rank": 96}, {"handle": "themckensiem", "title": "I  wasn\u2019t dating only for myself.", "views": 1701, "comments": 2, "likes": 9, "outlier": 11.34, "followers": 150, "video_url": "https://www.instagram.com/p/Db89JEkOEQS/", "audio_url": "https://www.instagram.com/reels/audio/176929003152333/", "hook": "", "transcript": "", "caption": "I  wasn\u2019t dating only for myself.\n\nI had children watching, a home to protect, and a family culture already being formed. That meant chemistry, attention, and how loved a man made me feel could never be the evaluation on their own.\n\nI paid attention to his character. His faith, and what it had cost him. His stability. The way he handled responsibility. The kind of influence he would bring into my daughters\u2019 lives.\n\nAnd I moved with more rigor because of them, because every standard I dropped would have become a lesson they learned by watching.\n\nMarriage is already a serious decision. When children are involved, it deserves more discernment, and you\u2019re allowed to take that seriously without anyone calling you picky.\n\nMy daughters watched me require evidence. They watched me walk away from men who didn\u2019t provide it. And then they watched the right man drive 3 hours every weekend, and treat their mother with a care I\u2019d stopped believing existed.\n\nThat\u2019s the curriculum. Not a lecture about standards. A mother they watched live them.\n\n#ChristianDating #ChristianSingleWomen #BiblicalDating #DatingDiscernment #ChristianMarriage", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 97}, {"handle": "revivetherapyservices", "title": "So much of high functioning looks like pure competence from the outside and feels like low grade fear on the inside.", "views": 1700, "comments": 0, "likes": 16, "outlier": 1.12, "followers": 1519, "video_url": "https://www.instagram.com/p/Db3wM89lCeo/", "audio_url": "https://www.instagram.com/reels/audio/38051952524395655/", "hook": "", "transcript": "", "caption": "So much of high functioning looks like pure competence from the outside and feels like low grade fear on the inside.\n\nPicture sending the email with your rate in it and not immediately over explaining or shaving the number down in the very next line, because you named it and let it sit there without flinching.\n\nPicture making a genuinely big decision, the job or the move or the ending, from a steady place in your body instead of from the old panic that says just pick whatever keeps everyone else comfortable.\n\nPicture a random Wednesday where you got almost nothing done and your sense of being worth something didn't move a single inch, because your worth stopped being contingent on your output.\n\nFor a lot of high functioning women, being useful was how you stayed safe and stayed loved, so your body learned to tie your value straight to your productivity, and that is a survival pattern that body based work can help recalibrate. You are a badass bitch whether or not you were productive today.\n\nYou can still care and still work hard, and your worth simply stops being the thing on the line every single time you rest.\n\nIf your value feels welded to your output, comment \"[WORTH]\" and I'll send you where to start, no pitch and no pressure!", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 98}, {"handle": "revivetherapyservices", "title": "You wake up at 3am with a wave of dread and no reason for it, and you lie there in the dark scanning for a threat your b", "views": 1668, "comments": 3, "likes": 23, "outlier": 1.1, "followers": 1519, "video_url": "https://www.instagram.com/p/Db3g9SNPfgM/", "audio_url": "https://www.instagram.com/reels/audio/655076383764260/", "hook": "", "transcript": "", "caption": "You wake up at 3am with a wave of dread and no reason for it, and you lie there in the dark scanning for a threat your body swears is standing in the room.\n\nThen it shows up in the middle of a normal Tuesday meeting, where your chest goes tight and your stomach clenches while somebody talks about a spreadsheet, and nothing is actually wrong.\n\nYour heart races at random moments and you have quietly stopped trying to explain it to anyone, because there is no story that makes it make sense.\n\nYour nervous system is doing its job a little too well, because somewhere along the way it learned that staying on guard kept you safe, and it never got the memo that the danger is over.\n\nThe dread at 3am is an old alarm that got stored in your body and never recalibrated, so it keeps going off long after the thing that set it off is gone.\n\nYour body has been working overtime to protect you like a smoke alarm that will not reset on its own, and that alarm can absolutely be turned down.\n\nIf you wake up at 3am scanning for a threat that isn\u2019t there, comment \u201c[CALM]\u201d and I\u2019ll send you the free nervous system worksheet I wish I\u2019d had back when mine wouldn\u2019t shut off. No pressure!", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 99}, {"handle": "revivetherapyservices", "title": "There's a specific kind of tired that comes from waking up already braced for something you can't even name.", "views": 1600, "comments": 0, "likes": 31, "outlier": 1.05, "followers": 1519, "video_url": "https://www.instagram.com/p/Db9Bj5-lW9a/", "audio_url": "https://www.instagram.com/reels/audio/27911730448466252/", "hook": "", "transcript": "", "caption": "There's a specific kind of tired that comes from waking up already braced for something you can't even name.\n\nPicture a Tuesday where you open your eyes and the first thing you feel is just the morning, so you make your coffee with your shoulders down where they actually belong and you take a breath that goes all the way in.\n\nPicture standing in your own kitchen late at night and feeling like the house is yours and you are safe inside it, not scanning the hallway, not listening for something that isn't there.\n\nThat dread was never a character flaw or a sign that something is wrong with you, because it's your nervous system still running an old alarm from a time when staying alert is what kept you safe, and this is body based work that helps those alarms get recalibrated so your body can finally register that you're safe now and it's over.\n\nYou don't have to earn this by white knuckling harder, and it won't happen overnight, but a body that has been dysregulated for years really can learn to settle.\n\nIf you want the name for what's actually happening in your body when that dread hits, comment \"[SAFE]\" and I'll send you where to start, no pressure and no pitch!", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 100}, {"handle": "altaredstatesofconsciousness", "title": "you know that feeling when you type why do i feel so numb and disconnected into the search bar at midnight and then dele", "views": 1593, "comments": 0, "likes": 8, "outlier": 0.04, "followers": 44885, "video_url": "https://www.instagram.com/p/Db9WpFIvcq-/", "audio_url": "https://www.instagram.com/reels/audio/722782234774353/", "hook": "", "transcript": "", "caption": "you know that feeling when you type why do i feel so numb and disconnected into the search bar at midnight and then delete it before anyone could ever see? babe. that search was you reaching for yourself. clearing it was the old survival talking. you don't have to keep pretending you're fine \ud83d\udda4 comment shadow and i'll send you my free Villain Archetype quiz", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-12", "rank": 101}, {"handle": "dragana.jasprica", "title": "Most of the women who apply to work with us have been training longer and harder than anyone they know.", "views": 1575, "comments": 0, "likes": 12, "outlier": 0.04, "followers": 42593, "video_url": "https://www.instagram.com/p/Db5AKOkhA8n/", "audio_url": "https://www.instagram.com/reels/audio/2603183200076984/", "hook": "", "transcript": "", "caption": "Most of the women who apply to work with us have been training longer and harder than anyone they know.\n\nYet every summer they\u2019re still reaching for the cover-up, because another year of work went by and they look... the same. \ud83e\udee0\n\nWhen we dig into what they\u2019ve been doing, the same thing shows up almost EVERY. SINGLE. TIME.\n\nA mild deficit, high protein, and the hope that fat loss and muscle growth will both magically happen if she just waits long enough.\n\nBut all that waiting costs you, because fat loss moves at least 4x faster than muscle gain.\n\nSo you stay in what I call the level of suck. You never really lean out, and you never really build anything either. And you can stay there for DECADES, still soft, still no definition.\n\nBecause your training came from one place and your macros from another. A trainer, an app, a calculator. They were never set up together.\n\nWe coach it differently. Your training and nutrition match and pull in the same direction the whole time. One phase at a time. That\u2019s 4 nutrition levers and 4 training levers dialled in together for what YOUR body needs. \ud83c\udfaf\n\nThen we run you through the phases in the right order.\n\n1\ufe0f\u20e3 Discovery, so we know your real starting point instead of guessing.\n\n2\ufe0f\u20e3 Fat loss, with an end date.\n\n3\ufe0f\u20e3 Stabilization, so it sticks.\n\n4\ufe0f\u20e3 Then real months of building the muscle and capacity that give you an athlete\u2019s shape (and no, 4-5 months is not enough, babe).\n\n5\ufe0f\u20e3 Integration, where you keep it without living in a tracking app.\n\nHow long each phase runs is based on your body composition, your performance in the gym, and how you\u2019re actually recovering. \n\nNot a vibe check at the end of the month. \ud83d\ude0f\n\n500+ women over 6 years, and the pattern repeats every time. \n\nUntil we fix it.\n\nIf you\u2019re tired of living in the level of suck \ud83d\udc47\ud83c\udffc\n\nDM me the word \u201dAUDIT\u201c and I\u2019ll get back to you to see if you qualify for our free audit that reveals the missing piece to get your dream body.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 102}, {"handle": "tiffanytaylorcoaching", "title": "I know the stack on your nightstand. The attachment one and the desire one and the communication one, all highlighted, a", "views": 1547, "comments": 4, "likes": 18, "outlier": 1.85, "followers": 838, "video_url": "https://www.instagram.com/p/DbJ0-tztC3Q/", "audio_url": "https://www.instagram.com/reels/audio/1452181562978023/", "hook": "", "transcript": "", "caption": "I know the stack on your nightstand. The attachment one and the desire one and the communication one, all highlighted, and you could teach a seminar on your own marriage at this point. And your body still braces when he reaches for you. Hear me out. The next book stays on the shelf, and the next ten minutes a day goes somewhere no book can reach. You lie down somewhere you won\u2019t be found, you breathe until the breath drops below your chest, and you let your jaw unclench, then your shoulders, then that spot between your ribs that\u2019s been tight since 2019. You don\u2019t fix or process anything, you let your body be off duty and see what it does with the unfamiliar freedom. The first week your mind will fight you for the job back. The books gave you understanding, and understanding matters, and a regulated nervous system can\u2019t be read into existence any more than flexibility can. The pattern lives in tissue and breath and reflex, and that\u2019s where the new experience has to happen. Ten minutes a day for a month will do what the last five books couldn\u2019t. Comment \u201cBODY\u201d below and I\u2019ll send you more details. Your body already knows the way. If you\u2019ve been living in your head and craving deeper connection,this is where you shift from obligation to pleasure. Follow @TiffanyTaylorCoaching for self love, nervous system safety, embodied intimacy, and feminine reclamation.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-23", "rank": 103}, {"handle": "altaredstatesofconsciousness", "title": "I don't teach this from a mountaintop. I teach it from the middle of it, still living with chronic illness symptoms and", "views": 1534, "comments": 0, "likes": 19, "outlier": 0.03, "followers": 44885, "video_url": "https://www.instagram.com/p/DbrzGmcPwys/", "audio_url": "https://www.instagram.com/reels/audio/1145851344072089/", "hook": "", "transcript": "", "caption": "I don't teach this from a mountaintop. I teach it from the middle of it, still living with chronic illness symptoms and a perfectionist who knocks around every launch.\n\nA few things kept me steady while I did the deepest work of my life.\n\nI checked in with myself before I let anyone else check in with me. I treated my triggers like mail addressed to me, not interruptions. I let myself feel envy and irritation without turning them into character flaws.\n\nAnd I found people who could hold the messy version of me without trying to tidy it.\n\nThis work never handed me a finish line, and I stopped asking it for one. It made me make sense to myself, and I think meeting yourself like that is the most profound thing a person can do.\n\nIf your triggers keep running your day, comment SHADOW and I'll send you the free five day series to start reading them", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 104}, {"handle": "dragana.jasprica", "title": "If you\u2019re a woman in your 30s or 40s who\u2019s done with looking soft despite training hard and you want to build a lean & s", "views": 1521, "comments": 3, "likes": 19, "outlier": 0.04, "followers": 42593, "video_url": "https://www.instagram.com/p/DbSzt_DBytL/", "audio_url": "https://www.instagram.com/reels/audio/26667941659548659/", "hook": "One of the biggest reasons why you still look soft instead of defined, although you're training consistently in the gym and paying attention to your nutrition, has everything to do with your commitment to the process.\nAnd here's what I mean by that.\nYou are playing it safe.\nNo matter if you're going through a fat loss or a building phase, you're never actually pushing your limits.\nAnd when you're not pushing your limits and you're not outgrowing yourself, how can you expect to get different results?\nYou will always stay stuck in that same level of suck, putting a lot of effort in, but getting always the same results out.\nSo the next time you're committing to a building or a fat loss phase, I want you to go all in.\nI want you to ask yourself, what can I do to get better results than I did last time?\nHow do I need to show up?\nWhat daily actions do I need to put in?\nWhat systems do I need to have in place?\nWhat kind of structure in my daily life?\nWhat kind of mindset do I need to show up every single day?\nLeveling up your execution and pushing your limits, going beyond what you thought was possible for you.\nThis is where you need to break through so that you can achieve that next level physique that you're after.", "transcript": "One of the biggest reasons why you still look soft instead of defined, although you're training consistently in the gym and paying attention to your nutrition, has everything to do with your commitment to the process.\nAnd here's what I mean by that.\nYou are playing it safe.\nNo matter if you're going through a fat loss or a building phase, you're never actually pushing your limits.\nAnd when you're not pushing your limits and you're not outgrowing yourself, how can you expect to get different results?\nYou will always stay stuck in that same level of suck, putting a lot of effort in, but getting always the same results out.\nSo the next time you're committing to a building or a fat loss phase, I want you to go all in.\nI want you to ask yourself, what can I do to get better results than I did last time?\nHow do I need to show up?\nWhat daily actions do I need to put in?\nWhat systems do I need to have in place?\nWhat kind of structure in my daily life?\nWhat kind of mindset do I need to show up every single day?\nLeveling up your execution and pushing your limits, going beyond what you thought was possible for you.\nThis is where you need to break through so that you can achieve that next level physique that you're after.", "caption": "If you\u2019re a woman in your 30s or 40s who\u2019s done with looking soft despite training hard and you want to build a lean & strong physique\u2026\n\n\u2705 DM me \u201cTRANSFORM\u201d\nto learn how we\u2019ll set up your personalized game plan to achieve your goal \u2764\ufe0f\u200d\ud83d\udd25", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-27", "rank": 105}, {"handle": "elle.hypnotherapy", "title": "One year. And everyone around you seems to think that should mean something. Like grief comes with a deadline you didn\u2019t", "views": 1518, "comments": 0, "likes": 27, "outlier": 0.18, "followers": 8355, "video_url": "https://www.instagram.com/p/DbJJv8lNNbF/", "audio_url": "", "hook": "", "transcript": "", "caption": "One year. And everyone around you seems to think that should mean something. Like grief comes with a deadline you didn\u2019t know about. So you hide in the bathroom at work. You cry as quietly as you can, fix your face, and walk back to your desk like nothing happened. Mama\u2026you\u2019re not behind. There is no schedule for this. I sit with moms every single week who are six months, a year, two years out and still getting knocked down by a baby announcement in the group chat. Not because they\u2019re weak. Because nobody ever gave them more than \u201cit just takes time\u201d And I\u2019ll always be honest with you\u2026time alone doesn\u2019t heal this. Time gives you the space and capacity to find what works for you. But the healing itself? That takes real support. I learned that in 2021, after my triplets died. Googling for help at 3am and finding nothing made for moms like us. The bathroom cry isn\u2019t a failure. It\u2019s a sign you\u2019ve been carrying this alone for far too long. And this kind of loss was never meant to be carried by one person \ud83e\udd0d Comment \u2018METHOD\u2019 below and I\u2019ll send you the details. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-23", "rank": 106}, {"handle": "dragana.jasprica", "title": "Someone told you it\u2019s your cortisol. Or your metabolism is damaged. Or that the fat loss will start once your hormones g", "views": 1514, "comments": 0, "likes": 14, "outlier": 0.04, "followers": 42593, "video_url": "https://www.instagram.com/p/DbLg1lgBekB/", "audio_url": "https://www.instagram.com/reels/audio/400898608115459/", "hook": "", "transcript": "", "caption": "Someone told you it\u2019s your cortisol. Or your metabolism is damaged. Or that the fat loss will start once your hormones get sorted.\n\nI bought all of it once, back when I was the one stuck.\n\nI have PCOS. I was diagnosed. So I had the perfect excuse sitting right there, and I could have stopped looking.\n\nInstead I did the protocols. Took the supplements. Bought the blood glucose monitor. Paid for the naturopath, the cortisol tests, the DUTCH test, the metabolism-boosting program. And at one point I paid 1000\u20ac to freeze the fat cells in my inner thighs.\n\nNothing changed. \ud83e\udee0\n\nWhat changed was getting a coach who matched my training and my food to ONE goal for the first time in my life.\n\n\ud83d\udcaa\ud83c\udffc Fueled sessions.\n\ud83d\udcaa\ud83c\udffc A program where the weights actually went up.\n\ud83d\udcaa\ud83c\udffc Enough food to build with.\n\nMy body changed AND I got my period back.\n\nSo no, I\u2019m not telling you your hormones aren\u2019t real.\n\nFor some of you they are. I\u2019m telling you the fix is the same either way.\n\nYou still have to dial in your training, your nutrition and your recovery, and THEN your body comp improves, your strength goes up, and your health markers follow.\n\nAlmost every woman who comes to us is scared she\u2019s the special case.\n\nAnd why wouldn\u2019t you be.\n\nYou open Instagram and there\u2019s another reel about cortisol. Another one about insulin. Another one about your hormones being the reason.\n\nSo you buy another fix, when nobody has ever looked at what you\u2019re actually eating or how you\u2019re actually training.\n\nBecause when we do look, it\u2019s the same thing almost every time. No proper meal structure, so you have no idea how much to eat, what to eat, or when, for YOUR body.\n\nAnd no idea how much strength training or cardio you should be doing, or at what intensity.\n\nIf a coach blames your hormones before they\u2019ve matched your training and your nutrition and checked all 8 levers, run.\n\nIf you\u2019re DONE doing this alone and you want someone to just tell you exactly what to do so you finally look like you lift\u2026\n\n\u2764\ufe0f\u200d\ud83d\udd25Comm", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-24", "rank": 107}, {"handle": "tiffanytaylorcoaching", "title": "I don\u2019t mean a bubble bath, and I don\u2019t mean a vision board, I mean something more physical than either. I mean noticing", "views": 1493, "comments": 2, "likes": 23, "outlier": 1.78, "followers": 838, "video_url": "https://www.instagram.com/p/DbHOJe7JMa1/", "audio_url": "https://www.instagram.com/reels/audio/1452181562978023/", "hook": "", "transcript": "", "caption": "I don\u2019t mean a bubble bath, and I don\u2019t mean a vision board, I mean something more physical than either. I mean noticing you have a body at 2pm on a Tuesday, and that it\u2019s been clenched since breakfast without your permission. I mean being able to answer the question what do you want with -something real & from below the collarbone, instead of reciting whatever everyone else needs from memory. I mean your pleasure counting as a reason. Wanting the dance class is enough, and wanting the long morning is enough, with no justification filed and no productivity attached. I mean feeling your feelings in real time instead of six months later in a parking lot over something small. And inside a marriage I mean this. Most women think the options are stay and keep sacrificing or leave and start over, and there\u2019s a third one almost nobody talks about, staying while you stop abandoning yourself. The marriage often changes once you do, because you brought an actual person back to it, and he gets to meet her again too. You\u2019ve been away a long time, but you can come back whenever you\u2019re ready. Drop a \u201cBODY\u201d in the comments if you want the full breakdown. Your body already knows the way. If you\u2019ve been living in your head and craving deeper connection,this is where you shift from obligation to pleasure. Follow @TiffanyTaylorCoaching for self love, nervous system safety, embodied intimacy, and feminine reclamation. #nervoussystemhealing #selflovejourney #overfunctioning #feminineenergy", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-22", "rank": 108}, {"handle": "dragana.jasprica", "title": "Stay with me on this one, because I know how it sounds.", "views": 1492, "comments": 0, "likes": 5, "outlier": 0.04, "followers": 42593, "video_url": "https://www.instagram.com/p/DbV4ZK6glzv/", "audio_url": "https://www.instagram.com/reels/audio/1063800460476099/", "hook": "", "transcript": "", "caption": "Stay with me on this one, because I know how it sounds.\n\nOur client came to us after two years on a fat loss plan from her old coach. Eating 1800 calories. Doing 5 lifting sessions AND 5 cardio sessions a week.\n\nExhausted. And her body hadn\u2019t changed in two years.\n\nSo the first thing we did was put her food UP to 2700 calories and pull her training back to 4 lifts and 1 cardio.\n\nRead that again. More food. Less training.\n\nAnd yes, the scale went up in those first weeks. That\u2019s the part nobody warns you about, and it\u2019s the part most women bail on. \ud83e\udee0\n\nBut her body finally had enough fuel to respond. Her sessions came back. Her strength went up.\n\nTHEN we ran a real fat loss phase. With a start date, an end date, and a rate of loss target.\n\nAnd at 45, she stood in front of a camera for her first ever bikini photoshoot, with the most defined legs she\u2019s ever had in her life.\n\nShe packed her own food on every single work trip, because she stopped waiting for life to calm down that was never coming.\n\nAnd she\u2019s already planned her next building and photoshoot prep phase with us for 2027/2028. \ud83d\udc83\n\nEating more first feels backwards when you\u2019ve spent years cutting. But its the ONE thing that finally lets all that training show up on your body.\n\nIf you\u2019re ready to reach your next level physique and go from soft to looking lean & defined\u2026\n\n\u2764\ufe0f\u200d\ud83d\udd25 Comment \u201cTRANSFORM\u201d\nand I\u2019ll personally reach out to see if we\u2019d be a good fit and send you the details.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 109}, {"h

n my own body runs on, and I only landed on them after trying a hundred other things first.\n\nIf you feel like you've already done the real breakfast, the protein before coffee, the salt in your water, and you're still not seeing traction, comment INFO and I'll send you the short list I actually live by.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-31", "rank": 75}, {"handle": "dragana.jasprica", "title": "You\u2019re the one who never skips a session.", "views": 1746, "comments": 0, "likes": 13, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/DbdiX5Khe91/", "audio_url": "https://www.instagram.com/reels/audio/2376652662794006/", "hook": "", "transcript": "", "caption": "You\u2019re the one who never skips a session.\n\nYou\u2019re at dinner asking if the chicken can come without the sauce, sides swapped for extra veg, while your friend orders the carbonara without a second thought.\n\nYour alarm goes at 5:45 and you\u2019re at the gym before the first meeting. You\u2019ve been doing that for years.\n\nAnd by 9pm you\u2019re on the couch scrolling back through your camera roll, and last summer\u2019s photo looks exactly like this summer\u2019s. Soft in the same places.\n\nSo you\u2019re back in Google typing \u201cshould I cut or build,\u201d like the answer might have changed since last week. \ud83e\udee0\n\nNobody around you gets it, because to them you ARE the fit one. So you say nothing. Because complaining about your body to people who think you\u2019ve got it sorted feels kinda ridiculous.\n\nThe women we coach are you. Executives, business owners, entrepreneurs, and coaches and trainers who feel this one the hardest.\n\nWomen who\u2019ve trained hard for YEARS, well past the beginner stage, and still don\u2019t look like they lift.\n\nAnd it\u2019s almost always the same thing.\n\n\u274c A permanent mild deficit.\n\u274c Training and nutrition pulling in different directions.\n\u274c Every big decision made from a guess.\n\nWhich is why we start with a Discovery Phase. 14 days to get clear on what your body actually needs, before you touch a fat loss phase.\n\n\u2705 More energy.\n\u2705 Cravings gone.\n\u2705 The food noise quiets down.\n\u2705 And for the first time in years, you know exactly what you\u2019re doing and why.\n\nYou found the right corner of the internet.\n\nAnd if you want that answer to \u201cshould I cut or build,\u201d that\u2019s exactly what the first 14 days of our 4-week Sculpt Challenge give you. We start Aug 3rd.\n\n\ud83d\udc98 Comment \u201cSCULPT\u201d and I\u2019ll send you the link.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-31", "rank": 76}, {"handle": "dragana.jasprica", "title": "I\u2019m looking for the business owner who treats her body like one more project she should be able to optimise, and can\u2019t w", "views": 1738, "comments": 0, "likes": 32, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/DbkS5ARBTUI/", "audio_url": "https://www.instagram.com/reels/audio/462137087554819/", "hook": "", "transcript": "", "caption": "I\u2019m looking for the business owner who treats her body like one more project she should be able to optimise, and can\u2019t work out why it\u2019s the one project that refuses to respond. \ud83e\udee0\n\nI\u2019m looking for the coach who gives brilliant advice to other women all day long, while her own physique hasn\u2019t budged in years.\n\nAnd I\u2019m looking for the woman who trains at 6am before a full day of meetings, travels for work regularly, and is SO tired of coaches handing her rigid plans that fall apart the second she\u2019s away.\n\nI know she\u2019s out there. She messages me sometimes.\n\nEvery one of them has trained seriously for YEARS. And every one of them has progress photos that stopped changing a long time ago.\n\nWe built Women Strength Society for exactly her.\n\nOne system, where the training and the nutrition finally point at the same goal, and every decision gets made from her DATA instead of a guess.\n\nMore than 500 women in 6 years. And the pattern repeats so often that we can usually describe a woman\u2019s last few years back to her before she\u2019s told us a thing. \ud83d\ude0f\n\nSo do your thing, algorithm.\n\nShe\u2019s out there deadlifting more than her colleagues would ever believe, and still throwing a hoodie over all of it.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-03", "rank": 77}, {"handle": "themckensiem", "title": "I  wasn\u2019t dating only for myself.", "views": 1701, "comments": 2, "likes": 9, "outlier": 5.94, "followers": 150, "video_url": "https://www.instagram.com/p/Db89JEkOEQS/", "audio_url": "https://www.instagram.com/reels/audio/176929003152333/", "hook": "", "transcript": "", "caption": "I  wasn\u2019t dating only for myself.\n\nI had children watching, a home to protect, and a family culture already being formed. That meant chemistry, attention, and how loved a man made me feel could never be the evaluation on their own.\n\nI paid attention to his character. His faith, and what it had cost him. His stability. The way he handled responsibility. The kind of influence he would bring into my daughters\u2019 lives.\n\nAnd I moved with more rigor because of them, because every standard I dropped would have become a lesson they learned by watching.\n\nMarriage is already a serious decision. When children are involved, it deserves more discernment, and you\u2019re allowed to take that seriously without anyone calling you picky.\n\nMy daughters watched me require evidence. They watched me walk away from men who didn\u2019t provide it. And then they watched the right man drive 3 hours every weekend, and treat their mother with a care I\u2019d stopped believing existed.\n\nThat\u2019s the curriculum. Not a lecture about standards. A mother they watched live them.\n\n#ChristianDating #ChristianSingleWomen #BiblicalDating #DatingDiscernment #ChristianMarriage", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 78}, {"handle": "revivetherapyservices", "title": "So much of high functioning looks like pure competence from the outside and feels like low grade fear on the inside.", "views": 1700, "comments": 0, "likes": 16, "outlier": 0.64, "followers": 1519, "video_url": "https://www.instagram.com/p/Db3wM89lCeo/", "audio_url": "https://www.instagram.com/reels/audio/38051952524395655/", "hook": "", "transcript": "", "caption": "So much of high functioning looks like pure competence from the outside and feels like low grade fear on the inside.\n\nPicture sending the email with your rate in it and not immediately over explaining or shaving the number down in the very next line, because you named it and let it sit there without flinching.\n\nPicture making a genuinely big decision, the job or the move or the ending, from a steady place in your body instead of from the old panic that says just pick whatever keeps everyone else comfortable.\n\nPicture a random Wednesday where you got almost nothing done and your sense of being worth something didn't move a single inch, because your worth stopped being contingent on your output.\n\nFor a lot of high functioning women, being useful was how you stayed safe and stayed loved, so your body learned to tie your value straight to your productivity, and that is a survival pattern that body based work can help recalibrate. You are a badass bitch whether or not you were productive today.\n\nYou can still care and still work hard, and your worth simply stops being the thing on the line every single time you rest.\n\nIf your value feels welded to your output, comment \"[WORTH]\" and I'll send you where to start, no pitch and no pressure!", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 79}, {"handle": "revivetherapyservices", "title": "You wake up at 3am with a wave of dread and no reason for it, and you lie there in the dark scanning for a threat your b", "views": 1668, "comments": 3, "likes": 23, "outlier": 0.53, "followers": 1519, "video_url": "https://www.instagram.com/p/Db3g9SNPfgM/", "audio_url": "https://www.instagram.com/reels/audio/655076383764260/", "hook": "", "transcript": "", "caption": "You wake up at 3am with a wave of dread and no reason for it, and you lie there in the dark scanning for a threat your body swears is standing in the room.\n\nThen it shows up in the middle of a normal Tuesday meeting, where your chest goes tight and your stomach clenches while somebody talks about a spreadsheet, and nothing is actually wrong.\n\nYour heart races at random moments and you have quietly stopped trying to explain it to anyone, because there is no story that makes it make sense.\n\nYour nervous system is doing its job a little too well, because somewhere along the way it learned that staying on guard kept you safe, and it never got the memo that the danger is over.\n\nThe dread at 3am is an old alarm that got stored in your body and never recalibrated, so it keeps going off long after the thing that set it off is gone.\n\nYour body has been working overtime to protect you like a smoke alarm that will not reset on its own, and that alarm can absolutely be turned down.\n\nIf you wake up at 3am scanning for a threat that isn\u2019t there, comment \u201c[CALM]\u201d and I\u2019ll send you the free nervous system worksheet I wish I\u2019d had back when mine wouldn\u2019t shut off. No pressure!", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 80}, {"handle": "revivetherapyservices", "title": "There's a specific kind of tired that comes from waking up already braced for something you can't even name.", "views": 1600, "comments": 0, "likes": 31, "outlier": 0.58, "followers": 1519, "video_url": "https://www.instagram.com/p/Db9Bj5-lW9a/", "audio_url": "https://www.instagram.com/reels/audio/27911730448466252/", "hook": "", "transcript": "", "caption": "There's a specific kind of tired that comes from waking up already braced for something you can't even name.\n\nPicture a Tuesday where you open your eyes and the first thing you feel is just the morning, so you make your coffee with your shoulders down where they actually belong and you take a breath that goes all the way in.\n\nPicture standing in your own kitchen late at night and feeling like the house is yours and you are safe inside it, not scanning the hallway, not listening for something that isn't there.\n\nThat dread was never a character flaw or a sign that something is wrong with you, because it's your nervous system still running an old alarm from a time when staying alert is what kept you safe, and this is body based work that helps those alarms get recalibrated so your body can finally register that you're safe now and it's over.\n\nYou don't have to earn this by white knuckling harder, and it won't happen overnight, but a body that has been dysregulated for years really can learn to settle.\n\nIf you want the name for what's actually happening in your body when that dread hits, comment \"[SAFE]\" and I'll send you where to start, no pressure and no pitch!", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 81}, {"handle": "altaredstatesofconsciousness", "title": "you know that feeling when you type why do i feel so numb and disconnected into the search bar at midnight and then dele", "views": 1593, "comments": 0, "likes": 8, "outlier": 0.01, "followers": 44885, "video_url": "https://www.instagram.com/p/Db9WpFIvcq-/", "audio_url": "https://www.instagram.com/reels/audio/722782234774353/", "hook": "", "transcript": "", "caption": "you know that feeling when you type why do i feel so numb and disconnected into the search bar at midnight and then delete it before anyone could ever see? babe. that search was you reaching for yourself. clearing it was the old survival talking. you don't have to keep pretending you're fine \ud83d\udda4 comment shadow and i'll send you my free Villain Archetype quiz", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-12", "rank": 82}, {"handle": "dragana.jasprica", "title": "Most of the women who apply to work with us have been training longer and harder than anyone they know.", "views": 1575, "comments": 0, "likes": 12, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/Db5AKOkhA8n/", "audio_url": "https://www.instagram.com/reels/audio/2603183200076984/", "hook": "", "transcript": "", "caption": "Most of the women who apply to work with us have been training longer and harder than anyone they know.\n\nYet every summer they\u2019re still reaching for the cover-up, because another year of work went by and they look... the same. \ud83e\udee0\n\nWhen we dig into what they\u2019ve been doing, the same thing shows up almost EVERY. SINGLE. TIME.\n\nA mild deficit, high protein, and the hope that fat loss and muscle growth will both magically happen if she just waits long enough.\n\nBut all that waiting costs you, because fat loss moves at least 4x faster than muscle gain.\n\nSo you stay in what I call the level of suck. You never really lean out, and you never really build anything either. And you can stay there for DECADES, still soft, still no definition.\n\nBecause your training came from one place and your macros from another. A trainer, an app, a calculator. They were never set up together.\n\nWe coach it differently. Your training and nutrition match and pull in the same direction the whole time. One phase at a time. That\u2019s 4 nutrition levers and 4 training levers dialled in together for what YOUR body needs. \ud83c\udfaf\n\nThen we run you through the phases in the right order.\n\n1\ufe0f\u20e3 Discovery, so we know your real starting point instead of guessing.\n\n2\ufe0f\u20e3 Fat loss, with an end date.\n\n3\ufe0f\u20e3 Stabilization, so it sticks.\n\n4\ufe0f\u20e3 Then real months of building the muscle and capacity that give you an athlete\u2019s shape (and no, 4-5 months is not enough, babe).\n\n5\ufe0f\u20e3 Integration, where you keep it without living in a tracking app.\n\nHow long each phase runs is based on your body composition, your performance in the gym, and how you\u2019re actually recovering. \n\nNot a vibe check at the end of the month. \ud83d\ude0f\n\n500+ women over 6 years, and the pattern repeats every time. \n\nUntil we fix it.\n\nIf you\u2019re tired of living in the level of suck \ud83d\udc47\ud83c\udffc\n\nDM me the word \u201dAUDIT\u201c and I\u2019ll get back to you to see if you qualify for our free audit that reveals the missing piece to get your dream body.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 83}, {"handle": "altaredstatesofconsciousness", "title": "I don't teach this from a mountaintop. I teach it from the middle of it, still living with chronic illness symptoms and", "views": 1534, "comments": 0, "likes": 19, "outlier": 0.01, "followers": 44885, "video_url": "https://www.instagram.com/p/DbrzGmcPwys/", "audio_url": "https://www.instagram.com/reels/audio/1145851344072089/", "hook": "", "transcript": "", "caption": "I don't teach this from a mountaintop. I teach it from the middle of it, still living with chronic illness symptoms and a perfectionist who knocks around every launch.\n\nA few things kept me steady while I did the deepest work of my life.\n\nI checked in with myself before I let anyone else check in with me. I treated my triggers like mail addressed to me, not interruptions. I let myself feel envy and irritation without turning them into character flaws.\n\nAnd I found people who could hold the messy version of me without trying to tidy it.\n\nThis work never handed me a finish line, and I stopped asking it for one. It made me make sense to myself, and I think meeting yourself like that is the most profound thing a person can do.\n\nIf your triggers keep running your day, comment SHADOW and I'll send you the free five day series to start reading them", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 84}, {"handle": "dragana.jasprica", "title": "If you\u2019re a woman in your 30s or 40s who\u2019s done with looking soft despite training hard and you want to build a lean & s", "views": 1521, "comments": 3, "likes": 19, "outlier": 0.0, "followers": 42593, "video_url": "https://www.instagram.com/p/DbSzt_DBytL/", "audio_url": "https://www.instagram.com/reels/audio/26667941659548659/", "hook": "One of the biggest reasons why you still look soft instead of defined, although you're training consistently in the gym and paying attention to your nutrition, has everything to do with your commitment to the process.\nAnd here's what I mean by that.\nYou are playing it safe.\nNo matter if you're going through a fat loss or a building phase, you're never actually pushing your limits.\nAnd when you're not pushing your limits and you're not outgrowing yourself, how can you expect to get different results?\nYou will always stay stuck in that same level of suck, putting a lot of effort in, but getting always the same results out.\nSo the next time you're committing to a building or a fat loss phase, I want you to go all in.\nI want you to ask yourself, what can I do to get better results than I did last time?\nHow do I need to show up?\nWhat daily actions do I need to put in?\nWhat systems do I need to have in place?\nWhat kind of structure in my daily life?\nWhat kind of mindset do I need to show up every single day?\nLeveling up your execution and pushing your limits, going beyond what you thought was possible for you.\nThis is where you need to break through so that you can achieve that next level physique that you're after.", "transcript": "One of the biggest reasons why you still look soft instead of defined, although you're training consistently in the gym and paying attention to your nutrition, has everything to do with your commitment to the process.\nAnd here's what I mean by that.\nYou are playing it safe.\nNo matter if you're going through a fat loss or a building phase, you're never actually pushing your limits.\nAnd when you're not pushing your limits and you're not outgrowing yourself, how can you expect to get different results?\nYou will always stay stuck in that same level of suck, putting a lot of effort in, but getting always the same results out.\nSo the next time you're committing to a building or a fat loss phase, I want you to go all in.\nI want you to ask yourself, what can I do to get better results than I did last time?\nHow do I need to show up?\nWhat daily actions do I need to put in?\nWhat systems do I need to have in place?\nWhat kind of structure in my daily life?\nWhat kind of mindset do I need to show up every single day?\nLeveling up your execution and pushing your limits, going beyond what you thought was possible for you.\nThis is where you need to break through so that you can achieve that next level physique that you're after.", "caption": "If you\u2019re a woman in your 30s or 40s who\u2019s done with looking soft despite training hard and you want to build a lean & strong physique\u2026\n\n\u2705 DM me \u201cTRANSFORM\u201d\nto learn how we\u2019ll set up your personalized game plan to achieve your goal \u2764\ufe0f\u200d\ud83d\udd25", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-27", "rank": 85}, {"handle": "dragana.jasprica", "title": "Someone told you it\u2019s your cortisol. Or your metabolism is damaged. Or that the fat loss will start once your hormones g", "views": 1514, "comments": 0, "likes": 14, "outlier": 0.0, "followers": 42593, "video_url": "https://www.instagram.com/p/DbLg1lgBekB/", "audio_url": "https://www.instagram.com/reels/audio/400898608115459/", "hook": "", "transcript": "", "caption": "Someone told you it\u2019s your cortisol. Or your metabolism is damaged. Or that the fat loss will start once your hormones get sorted.\n\nI bought all of it once, back when I was the one stuck.\n\nI have PCOS. I was diagnosed. So I had the perfect excuse sitting right there, and I could have stopped looking.\n\nInstead I did the protocols. Took the supplements. Bought the blood glucose monitor. Paid for the naturopath, the cortisol tests, the DUTCH test, the metabolism-boosting program. And at one point I paid 1000\u20ac to freeze the fat cells in my inner thighs.\n\nNothing changed. \ud83e\udee0\n\nWhat changed was getting a coach who matched my training and my food to ONE goal for the first time in my life.\n\n\ud83d\udcaa\ud83c\udffc Fueled sessions.\n\ud83d\udcaa\ud83c\udffc A program where the weights actually went up.\n\ud83d\udcaa\ud83c\udffc Enough food to build with.\n\nMy body changed AND I got my period back.\n\nSo no, I\u2019m not telling you your hormones aren\u2019t real.\n\nFor some of you they are. I\u2019m telling you the fix is the same either way.\n\nYou still have to dial in your training, your nutrition and your recovery, and THEN your body comp improves, your strength goes up, and your health markers follow.\n\nAlmost every woman who comes to us is scared she\u2019s the special case.\n\nAnd why wouldn\u2019t you be.\n\nYou open Instagram and there\u2019s another reel about cortisol. Another one about insulin. Another one about your hormones being the reason.\n\nSo you buy another fix, when nobody has ever looked at what you\u2019re actually eating or how you\u2019re actually training.\n\nBecause when we do look, it\u2019s the same thing almost every time. No proper meal structure, so you have no idea how much to eat, what to eat, or when, for YOUR body.\n\nAnd no idea how much strength training or cardio you should be doing, or at what intensity.\n\nIf a coach blames your hormones before they\u2019ve matched your training and your nutrition and checked all 8 levers, run.\n\nIf you\u2019re DONE doing this alone and you want someone to just tell you exactly what to do so you finally look like you lift\u2026\n\n\u2764\ufe0f\u200d\ud83d\udd25Comm", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-24", "rank": 86}, {"handle": "dragana.jasprica", "title": "Stay with me on this one, because I know how it sounds.", "views": 1492, "comments": 0, "likes": 5, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/DbV4ZK6glzv/", "audio_url": "https://www.instagram.com/reels/audio/1063800460476099/", "hook": "", "transcript": "", "caption": "Stay with me on this one, because I know how it sounds.\n\nOur client came to us after two years on a fat loss plan from her old coach. Eating 1800 calories. Doing 5 lifting sessions AND 5 cardio sessions a week.\n\nExhausted. And her body hadn\u2019t changed in two years.\n\nSo the first thing we did was put her food UP to 2700 calories and pull her training back to 4 lifts and 1 cardio.\n\nRead that again. More food. Less training.\n\nAnd yes, the scale went up in those first weeks. That\u2019s the part nobody warns you about, and it\u2019s the part most women bail on. \ud83e\udee0\n\nBut her body finally had enough fuel to respond. Her sessions came back. Her strength went up.\n\nTHEN we ran a real fat loss phase. With a start date, an end date, and a rate of loss target.\n\nAnd at 45, she stood in front of a camera for her first ever bikini photoshoot, with the most defined legs she\u2019s ever had in her life.\n\nShe packed her own food on every single work trip, because she stopped waiting for life to calm down that was never coming.\n\nAnd she\u2019s already planned her next building and photoshoot prep phase with us for 2027/2028. \ud83d\udc83\n\nEating more first feels backwards when you\u2019ve spent years cutting. But its the ONE thing that finally lets all that training show up on your body.\n\nIf you\u2019re ready to reach your next level physique and go from soft to looking lean & defined\u2026\n\n\u2764\ufe0f\u200d\ud83d\udd25 Comment \u201cTRANSFORM\u201d\nand I\u2019ll personally reach out to see if we\u2019d be a good fit and send you the details.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 87}, {"handle": "revivetherapyservices", "title": "Research shows most people no longer meet PTSD criteria after a standard course of EMDR, so comment \"SESSION\" and I'll s", "views": 1477, "comments": 6, "likes": 22, "outlier": 0.55, "followers": 1522, "video_url": "https://www.instagram.com/p/DbtolosDOFF/", "audio_url": "https://www.instagram.com/reels/audio/27566919012988455/", "hook": "", "transcript": "", "caption": "Research shows most people no longer meet PTSD criteria after a standard course of EMDR, so comment \"SESSION\" and I'll show you what that course involves.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 88}, {"handle": "dragana.jasprica", "title": "Let me be honest about who I actually work with.", "views": 1445, "comments": 0, "likes": 16, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/Dbvqv3EhSA-/", "audio_url": "https://www.instagram.com/reels/audio/1550123486358424/", "hook": "", "transcript": "", "caption": "Let me be honest about who I actually work with.\n\nIf your only goal is to be smaller, to shrink yourself down as much as possible and stay there, I\u2019m probably not your coach. \ud83e\udd37\ud83c\udffc\u200d\u2640\ufe0f\n\nBut if you\u2019re ready to actually BUILD?\n\nTo eat enough, get genuinely strong, take up space, and finally create the physique you\u2019ve been training years for?  Keep reading, because this is for you.\n\nHere\u2019s what almost no woman ever does... committing to seriously building muscle. \n\nNearly everyone only ever focuses on ONE thing. Fat loss. Losing, shrinking, getting smaller, year after year.\n\nAnd then wonders why she still doesn\u2019t look like she lifts. \ud83e\udd2d\n\nThe women who DO look like they lift got there a different way. They committed to building. And that\u2019s where everything levels up at once.\n\nYour strength goes UP, with real numbers to prove it.\n\nYou build the muscle that actually creates the shape you\u2019ve been chasing this whole time.\n\nAnd it\u2019s not just your physique. Your metabolic health improves, your energy, your recovery, your digestion, your hormones, your performance. ALL OF IT.\n\nI did it myself. Two proper building phases each 15x months long and multiple maintenance phases over the last 6 years got me the body I\u2019d trained years for.\n\nAnd honestly, I\u2019ve never been stronger or healthier.\n\nYou were never meant to shrink forever, babe.\nYou were BUILT FOR MORE. \ud83d\udcaa\ud83c\udffc", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 89}, {"handle": "revivetherapyservices", "title": "You are not too much and you are not broken, your nervous system just learned a long time ago that closeness was risky!", "views": 1429, "comments": 4, "likes": 31, "outlier": 0.58, "followers": 1519, "video_url": "https://www.instagram.com/p/Db1P_2VG9_T/", "audio_url": "https://www.instagram.com/reels/audio/27788340897525680/", "hook": "If you push people away and then the minute they go, you start panicking, hang out with me for just a second.\nThis is actually a really common thing with people.\nYou crave closeness more than anything and then the minute someone gets too close, your body kind of just goes, Mayday, I don't wanna be close to anyone and it pushes them away.\nThen here's the good old switcheroo.\nThey start pulling away a little bit.\nMaybe it's they don't respond to your texts as quickly as they did before and then hits the anxiety.\nYou send them five texts, boom, boom, boom, boom, boom, seeking and yearning for that connection and attention from them.\nAnd after you send those five texts, you definitely are hating yourself.\nFor some reason, you keep choosing these emotionally unavailable people while the steady, kind person who actually likes you makes your skin crawl.\nBy the way, none of this means you're needy or broken or bad at love.\nWhat most likely is happening is your nervous system learned really early on that connection was unpredictable.\nSo it treats closeness with someone as a thing it so desperately wants and so desperately hates at the same time.\nThe thing is your body is running this script where getting hurt and getting close to someone live in the same area.\nSo it's like reaching out and flinching at the same time.\nSo that pattern that you're judging yourself for, it's there for a reason.\nAnd the nice thing is it can be recalibrated.\nIt doesn't have to be like that for forever.", "transcript": "If you push people away and then the minute they go, you start panicking, hang out with me for just a second.\nThis is actually a really common thing with people.\nYou crave closeness more than anything and then the minute someone gets too close, your body kind of just goes, Mayday, I don't wanna be close to anyone and it pushes them away.\nThen here's the good old switcheroo.\nThey start pulling away a little bit.\nMaybe it's they don't respond to your texts as quickly as they did before and then hits the anxiety.\nYou send them five texts, boom, boom, boom, boom, boom, seeking and yearning for that connection and attention from them.\nAnd after you send those five texts, you definitely are hating yourself.\nFor some reason, you keep choosing these emotionally unavailable people while the steady, kind person who actually likes you makes your skin crawl.\nBy the way, none of this means you're needy or broken or bad at love.\nWhat most likely is happening is your nervous system learned really early on that connection was unpredictable.\nSo it treats closeness with someone as a thing it so desperately wants and so desperately hates at the same time.\nThe thing is your body is running this script where getting hurt and getting close to someone live in the same area.\nSo it's like reaching out and flinching at the same time.\nSo that pattern that you're judging yourself for, it's there for a reason.\nAnd the nice thing is it can be recalibrated.\nIt doesn't have to be like that for forever.", "caption": "You are not too much and you are not broken, your nervous system just learned a long time ago that closeness was risky! If you spiral into the anxious texts the second someone pulls back, comment \"[CLOSE]\" and I'll send you the free worksheet I wish I'd had. No pressure!", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-09", "rank": 90}, {"handle": "revivetherapyservices", "title": "I was a licensed therapist crying in the bathtub over things I could explain perfectly, so comment \"SESSION\" and I'll te", "views": 1405, "comments": 3, "likes": 55, "outlier": 0.5, "followers": 1522, "video_url": "https://www.instagram.com/p/DbtVrUdjYmF/", "audio_url": "https://www.instagram.com/reels/audio/28693550293579683/", "hook": "", "transcript": "", "caption": "I was a licensed therapist crying in the bathtub over things I could explain perfectly, so comment \"SESSION\" and I'll tell you what finally changed my body.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 91}, {"handle": "jolihappynails", "title": "If you have caught yourself sealing a lift under top coat to save time, comment \"BUILDER\" and I'll DM you the free call", "views": 1387, "comments": 0, "likes": 38, "outlier": 0.3, "followers": 2872, "video_url": "https://www.instagram.com/p/Db4qQ3eBdeS/", "audio_url": "https://www.instagram.com/reels/audio/27972887355696276/", "hook": "So, this is for the nail text, specifically for those that can relate to this scenario.\nSo, there is a thumb in one of your last three sets with a lifted edge that you painted top coat right over, and that thumb is the reason she's not texting you back.\nSo, I want to talk about the little moment nobody films.\nYou finish a set, you spot a tiny lift on the thumb, and instead of starting that finger over, you glide top coat across it and tell her it's done.\nI've done it too early on when I was tired and the next client was already sitting in the chair.\nHere is actually what happens after she leaves.\nThat seal lift becomes a pocket, moisture gets under it, and somewhere around day five, it catches on a sweater, and she feels it.\nShe does not call you to complain.\nShe just quietly books with someone else and tells herself your work is a little too delicate for her life.\nThe mistake is not the lift.\nThe mistake is deciding that a hidden problem is the same thing as a solved problem.\nOn a natural nail, a lift you cannot see is still a lift the client will find because she lives inside those hands all day and you only see them for two hours.\nSo, when I train the removal and prep sequence, the whole point is that you start every set so clean there is nothing to hide.\nIf you remove 95 to 99% of the old product and you prep the edge properly, that lift does not appear on day five because you did not seal a weak spot in on day one.\nSo, the next time you are tempted to top coat over a thumb, stop and redo the finger.\nIt costs you four minutes now.\nSealing it costs you the client, and she was the one who was going to send you her friend.", "transcript": "So, this is for the nail text, specifically for those that can relate to this scenario.\nSo, there is a thumb in one of your last three sets with a lifted edge that you painted top coat right over, and that thumb is the reason she's not texting you back.\nSo, I want to talk about the little moment nobody films.\nYou finish a set, you spot a tiny lift on the thumb, and instead of starting that finger over, you glide top coat across it and tell her it's done.\nI've done it too early on when I was tired and the next client was already sitting in the chair.\nHere is actually what happens after she leaves.\nThat seal lift becomes a pocket, moisture gets under it, and somewhere around day five, it catches on a sweater, and she feels it.\nShe does not call you to complain.\nShe just quietly books with someone else and tells herself your work is a little too delicate for her life.\nThe mistake is not the lift.\nThe mistake is deciding that a hidden problem is the same thing as a solved problem.\nOn a natural nail, a lift you cannot see is still a lift the client will find because she lives inside those hands all day and you only see them for two hours.\nSo, when I train the removal and prep sequence, the whole point is that you start every set so clean there is nothing to hide.\nIf you remove 95 to 99% of the old product and you prep the edge properly, that lift does not appear on day five because you did not seal a weak spot in on day one.\nSo, the next time you are tempted to top coat over a thumb, stop and redo the finger.\nIt costs you four minutes now.\nSealing it costs y     m.videos++; m.views+=d.views; m.best=Math.max(m.best,d.views); m.bestOut=Math.max(m.bestOut,d.outlier); m.followers=Math.max(m.followers,d.followers);
  });
  const list=Object.values(map).sort((a,b)=>b.views-a.views);
  box.innerHTML = `<div class="colhead" style="grid-template-columns:52px 1fr 120px 82px 92px"><span>Rank</span><span>Creator</span><span class="r">Total views</span><span class="r">Videos</span><span class="r">Best outlier</span></div>`+
  list.map((c,i)=>`<div class="crow${i===0?' lead':''}">
      <div class="rank${i<3?' top3':''} tnum">${i+1}</div>
      <div><div class="handle" style="font-weight:800;font-size:15px">@${esc(c.handle)}</div>
        <div class="t" style="font-size:12px;color:var(--text-dim);margin-top:2px">${nf(c.followers)} followers · best video ${nf(c.best)} views</div></div>
      <div class="cviews views-cell"><b class="tnum">${nf(c.views)}</b></div>
      <div class="metric sm c-hide tnum" style="text-align:right">${c.videos}</div>
      <div class="metric big c-hide" style="text-align:right"><span class="otag${c.bestOut>=3?' hot':''} tnum">${fmtOutlier(c.bestOut)}×</span></div>
    </div>`).join("");
}

/* ---------- orchestration ---------- */
function renderAll(){
  const pool=currentPool(); rankPool(pool);
  document.querySelectorAll(".divpill").forEach(p=>p.setAttribute("aria-selected",String(p.dataset.div===state.division)));
  document.querySelectorAll("#winToggle button").forEach(b=>b.setAttribute("aria-selected",String(+b.dataset.days===state.days)));
  renderStats(pool); renderDivbar(); renderPodium(pool); renderBoard(pool); renderCreators(pool);
}
function switchView(v){
  state.view=v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===v)));
  $("#videosView").hidden = v!=="videos"; $("#creatorsView").hidden = v!=="creators";
  $(".rightctl").style.visibility = v==="videos"?"visible":"hidden";
}

/* ---------- theme ---------- */
function initTheme(){
  const btn=$("#themeBtn");
  const apply=t=>{ if(t==="system")document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t);
    const dark = t==="dark" || (t==="system" && matchMedia("(prefers-color-scheme:dark)").matches);
    $("#themeIcon").textContent = dark?"☾":"☀"; $("#themeLabel").textContent = t.charAt(0).toUpperCase()+t.slice(1); };
  let cur="system"; apply(cur);
  btn.addEventListener("click",()=>{ cur = cur==="system"?"light":cur==="light"?"dark":"system"; apply(cur); });
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(cur==="system") apply("system"); });
}

/* ---------- wire ---------- */
initTheme();
renderHeaderStatic();
renderAll();
$("#winToggle").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.days=+b.dataset.days; renderAll(); });
$("#search").addEventListener("input",e=>{ state.q=e.target.value; renderBoard(currentPool()); });
$("#sort").addEventListener("change",e=>{ state.sort=e.target.value; const p=currentPool(); rankPool(p); renderBoard(p); });
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchView(t.dataset.view)));
</script>
</body>

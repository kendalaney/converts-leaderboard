de that sentence for longer than I want to admit.\nI kept treating myself as almost ready, always one more course away from being allowed to charge properly.\nMeanwhile, my hands were already doing the premium work, and my rate was stuck where a beginner would set it.\nAsk yourself when you first set your current price.\nFor most techs, the honest answer is a version of you from two or three years ago, someone with less skill, and you never went back to update the number because still learning felt safer than the confrontation.\nLearning never stops, and it should not, but it's not the thing standing between you and a higher rate.\nRemoval is clean, your structure holds, your clients rebook.\nThose are the facts.\nStill learning is the story you tell, so you never have to test whether the market agrees with the facts.\nSeparate the two, keep learning forever, that is the craft.\nAnd this week, look at the client who has been with you a year and set the price you would set if you fully believed what your hands already know.\nShe has been waiting for you to catch up to yourself.", "caption": "If \"I'm still learning\" has been your reason to not raise your rate, comment \"RETENTION\" and I'll DM you the free call so you can start pricing for the tech you already are.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-12", "rank": 178}, {"handle": "guy_finocchiaro", "title": "Getting on top of your taxes doesn\u2019t take an overhaul.", "views": 345, "comments": 0, "likes": 2, "outlier": 0.31, "followers": 1103, "video_url": "https://www.instagram.com/p/DbM3o_qy2ZI/", "audio_url": "https://www.instagram.com/reels/audio/27692083430425371/", "hook": "", "transcript": "", "caption": "Getting on top of your taxes doesn\u2019t take an overhaul.\n\nIt takes a handful of small moves that pull the stress out of the season.\n\nOpen a second checking account, label it taxes, and set an automatic transfer of a fixed percentage every time you get paid.\n\nThe gut drop when the bill arrives goes away, because the money\u2019s already sitting there.\n\nPhotograph every receipt into one folder on your phone instead of stuffing them in a shoebox.\n\nForward any IRS letter to your representative the day it comes, before it turns into a spiral on your kitchen counter.\n\nPut one recurring reminder on your calendar the week before each quarter.\n\nThe clients who never end up in a crisis made the small stuff automatic.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-25", "rank": 179}, {"handle": "corinne.naturopath", "title": "If you're dragging by the afternoon, comment INFO and I'll show you how to use salt the right way.", "views": 341, "comments": 0, "likes": 9, "outlier": 0.1, "followers": 3531, "video_url": "https://www.instagram.com/p/DbjjjpJCBph/", "audio_url": "https://www.instagram.com/reels/audio/37570474422566660/", "hook": "If you're tired all the time, salt might be the easiest fix that you're skipping.\nSodium is one of the most underrated foundations for steady energy, and most people barely give it a thought.\nIt runs your energy, your fluid balance, and how well the rest of your minerals do their job.\nMost of the tired women I actually work with are running low on it.\nI salt my water throughout the day and my food liberally, and I do so on purpose, and I use a high-quality, mineral-rich salt.\nIt's one of the simplest shifts I give my clients, and one of the fastest ones to actually feel.", "transcript": "If you're tired all the time, salt might be the easiest fix that you're skipping.\nSodium is one of the most underrated foundations for steady energy, and most people barely give it a thought.\nIt runs your energy, your fluid balance, and how well the rest of your minerals do their job.\nMost of the tired women I actually work with are running low on it.\nI salt my water throughout the day and my food liberally, and I do so on purpose, and I use a high-quality, mineral-rich salt.\nIt's one of the simplest shifts I give my clients, and one of the fastest ones to actually feel.", "caption": "If you're dragging by the afternoon, comment INFO and I'll show you how to use salt the right way.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-02", "rank": 180}, {"handle": "susiebower_", "title": "For years the answer to pain was to find the sore spot and work it harder. Even 25 years ago, I never felt aligned with", "views": 335, "comments": 2, "likes": 5, "outlier": 1.15, "followers": 291, "video_url": "https://www.instagram.com/p/Db6Vt6nNfDD/", "audio_url": "https://www.instagram.com/reels/audio/493696187829057/", "hook": "", "transcript": "", "caption": "For years the answer to pain was to find the sore spot and work it harder. Even 25 years ago, I never felt aligned with this.\n\nThe approach growing now looks in a different direction, at the nervous system and the stress the body has been holding. It treats pain as an adaptive strategy, something your body chose to protect you, rather than a part that's broken.\n\nIt brings in breath, movement, and bodywork without pretending any one of them has all the answers. It invites you to get curious about your own body instead of handing it over to be fixed.\n\nThis is where things are heading, and it's the work I've already been doing for 25 years.\n\nComment PAIN if you want me to send you more.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-11", "rank": 181}, {"handle": "corinne.naturopath", "title": "If you're the woman who's tried everything and refuses to quit, comment INFO and I'll show you what I did.", "views": 333, "comments": 2, "likes": 12, "outlier": 0.09, "followers": 3531, "video_url": "https://www.instagram.com/p/Dbn9GUXk0RB/", "audio_url": "https://www.instagram.com/reels/audio/27419238727747970/", "hook": "People call me lucky for getting my health back, and I kind of have to laugh about it.\nThere was a stretch where I couldn't stand up long enough to shower, and I was told to make managing my illness my full-time job, and this was by the medical doctor who diagnosed me.\nBy addressing one plain foundational step at a time, over years, not overnight, I was able to figure it out as I went along.\nEvery stretch where my health held taught me something, and the stretches that tested me taught me even more.\nLuck didn't do that.\nDoing the right things in the right order did.", "transcript": "People call me lucky for getting my health back, and I kind of have to laugh about it.\nThere was a stretch where I couldn't stand up long enough to shower, and I was told to make managing my illness my full-time job, and this was by the medical doctor who diagnosed me.\nBy addressing one plain foundational step at a time, over years, not overnight, I was able to figure it out as I went along.\nEvery stretch where my health held taught me something, and the stretches that tested me taught me even more.\nLuck didn't do that.\nDoing the right things in the right order did.", "caption": "If you're the woman who's tried everything and refuses to quit, comment INFO and I'll show you what I did.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-04", "rank": 182}, {"handle": "guy_finocchiaro", "title": "The IRS will happily hand you a payment plan. What they hand you is the plan that\u2019s best for them.", "views": 329, "comments": 0, "likes": 4, "outlier": 0.3, "followers": 1103, "video_url": "https://www.instagram.com/p/DbyxKS2S_zR/", "audio_url": "https://www.instagram.com/reels/audio/1184259673015640/", "hook": "", "transcript": "", "caption": "The IRS will happily hand you a payment plan. What they hand you is the plan that\u2019s best for them.\n\nThe number in that letter is usually the balance split into what gets them paid fastest, with no look at whether you qualify for something lighter.\n\nBusiness owners see the official letter, assume it\u2019s the only option, and lock into payments that squeeze them for years.\n\nWhat most people never hear is that you might qualify for a partial payment plan, or a lower amount based on your real finances, or a stretch where you owe nothing because the math shows you can\u2019t pay.\n\nThe letter says nothing about any of it.\n\nI build the number from your real income and expenses and the IRS\u2019s own standards, and it\u2019s often a fraction of the automatic offer.\n\nThe default plan is a starting point, not the deal you\u2019re stuck with.\n\nType PLAN in the comments and I\u2019ll get you the details on what you might qualify for.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-08", "rank": 183}, {"handle": "guy_finocchiaro", "title": "It\u2019s the same pattern almost every time.", "views": 328, "comments": 0, "likes": 2, "outlier": 0.3, "followers": 1103, "video_url": "https://www.instagram.com/p/Dbj82H4ycLd/", "audio_url": "https://www.instagram.com/reels/audio/921447351682109/", "hook": "", "transcript": "", "caption": "It\u2019s the same pattern almost every time.\n\nYou have a good year, you\u2019re proud of it, and then the tax bill lands and nothing was set aside for it.\n\nYou pay part of it, or none, and roll it forward telling yourself next year runs differently.\n\nThen April comes and the new bill sits on top of the old one, and now you\u2019re behind on two years.\n\nThe thing driving it is that nobody\u2019s paying quarterly estimates, which means the IRS never gets fed during the year and the full amount hits at once.\n\nFixing it means treating taxes like a bill you owe every quarter, instead of a surprise you brace for every spring.\n\nOnce a client pays in as they go, the cycle breaks, and we can clean up the back years without new ones stacking on.\n\nComment NOW and I\u2019ll send you the details on setting this up before it costs you another April.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-03", "rank": 184}, {"handle": "altaredstatesofconsciousness", "title": "i know it sounds backwards, bby. we're taught healing is a renovation project, tear the bad parts out. but the parts you", "views": 322, "comments": 0, "likes": 4, "outlier": 0.01, "followers": 44884, "video_url": "https://www.instagram.com/p/DcCfPczPHBr/", "audio_url": "https://www.instagram.com/reels/audio/1138942933463909/", "hook": "the next, video!!", "transcript": "the next, video!!", "caption": "i know it sounds backwards, bby. we're taught healing is a renovation project, tear the bad parts out. but the parts you keep trying to delete are the exact ones asking to be witnessed. the moment you stop trying to fix yourself and start trying to know yourself is where everything shifts. that's the whole work \ud83d\udda4", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-14", "rank": 185}, {"handle": "revivetherapyservices", "title": "If it's Sunday at 4pm and you're technically resting while your brain runs Monday on a loop, comment \"SESSION\" and I'll", "views": 319, "comments": 0, "likes": 3, "outlier": 0.21, "followers": 1522, "video_url": "https://www.instagram.com/p/Dbq2GtIiMdC/", "audio_url": "https://www.instagram.com/reels/audio/37422417410739450/", "hook": "", "transcript": "", "caption": "If it's Sunday at 4pm and you're technically resting while your brain runs Monday on a loop, comment \"SESSION\" and I'll send you the next step.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-05", "rank": 186}, {"handle": "revivetherapyservices", "title": "One of my clients went from 3am wakeups five nights a week to sleeping through most of the month after about four months", "views": 311, "comments": 0, "likes": 5, "outlier": 0.2, "followers": 1522, "video_url": "https://www.instagram.com/p/DbwKFrZlH0H/", "audio_url": "https://www.instagram.com/reels/audio/28153699364248051/", "hook": "", "transcript": "", "caption": "One of my clients went from 3am wakeups five nights a week to sleeping through most of the month after about four months of recalibrating the alarm underneath, so comment \"SESSION\" if you want your sleep back.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 187}, {"handle": "corinne.naturopath", "title": "Picture ninety days from now with your energy back, comment INFO and I'll map the plan with you.", "views": 308, "comments": 2, "likes": 2, "outlier": 0.09, "followers": 3531, "video_url": "https://www.instagram.com/p/DboSOXQEp7E/", "audio_url": "https://www.instagram.com/reels/audio/28347610014824391/", "hook": "If I woke up sick and overwhelmed again, I wouldn't panic by supplements or schedule the fanciest lab work test.\nThe first thing I'd do is feed myself real food and get my blood sugar to hold steady.\nThen I'd rebuild my vitamins and minerals to give my body something to work with.\nI'd repair my gut to get all of those nutrients absorbed instead of wasted.\nOnly after my nutrients were replenished would I work on getting fat adapted so my body could become metabolically flexible.\nAnd I wouldn't try to do it all alone the way I did the first time. 90 days of that in the right order changes what your body can finally do.", "transcript": "If I woke up sick and overwhelmed again, I wouldn't panic by supplements or schedule the fanciest lab work test.\nThe first thing I'd do is feed myself real food and get my blood sugar to hold steady.\nThen I'd rebuild my vitamins and minerals to give my body something to work with.\nI'd repair my gut to get all of those nutrients absorbed instead of wasted.\nOnly after my nutrients were replenished would I work on getting fat adapted so my body could become metabolically flexible.\nAnd I wouldn't try to do it all alone the way I did the first time. 90 days of that in the right order changes what your body can finally do.", "caption": "Picture ninety days from now with your energy back, comment INFO and I'll map the plan with you.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-04", "rank": 188}, {"handle": "guy_finocchiaro", "title": "People assume the only way out of tax debt is a giant lump sum, so they raid savings, cash out retirement, or decide it\u2019", "views": 307, "comments": 0, "likes": 2, "outlier": 0.28, "followers": 1103, "video_url": "https://www.instagram.com/p/DbmnJEHykEK/", "audio_url": "https://www.instagram.com/reels/audio/2154576294803559/", "hook": "", "transcript": "", "caption": "People assume the only way out of tax debt is a giant lump sum, so they raid savings, cash out retirement, or decide it\u2019s hopeless and do nothing.\n\nThat was never the requirement.\n\nThe IRS bases what you pay on what you can afford right now, your current income against your real expenses.\n\nI\u2019ve had clients about to pull from a 401k to throw at a balance, and once we ran their real numbers, they qualified for a monthly payment that left the savings alone.\n\nIn some cases the right answer is currently not collectible status, where you pay nothing for a stretch because the math shows you can\u2019t.\n\nYou have options that don\u2019t wreck your future to fix your past, but you only find them when someone runs your finances the way the IRS does first.\n\nComment PLAN and I\u2019ll send you the details on what your numbers might qualify for.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-04", "rank": 189}, {"handle": "susiebower_", "title": "If I woke up with back pain every morning and wanted it gone within a few months, this is the plan I'd follow.", "views": 302, "comments": 0, "likes": 4, "outlier": 1.04, "followers": 291, "video_url": "https://www.instagram.com/p/DbkxyYZq-4m/", "audio_url": "https://www.instagram.com/reels/audio/3132622323696161/", "hook": "", "transcript": "", "caption": "If I woke up with back pain every morning and wanted it gone within a few months, this is the plan I'd follow.\n\nInstead of asking how do I get rid of this, I'd ask what my body is trying to solve by holding on right here.\n\nI'd look at the stress I've been carrying that never had anywhere to go, because your fascia and body hold what your mind hasn't finished processing.\n\nI'd use breathwork to reach the part of me my logical brain can't talk to, the part still clinging on from something old.\n\nThen I'd let my body feel safe enough to release it, one layer at a time.\n\nThis is the work I've done with people for 25 years, and it's why the relief stays.\n\nDrop PAIN in the comments if you want the full breakdown.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-03", "rank": 190}, {"handle": "erseaberg", "title": "Listen, I say this with so much love, you cannot be the CEO and the bottleneck at the same time. It is one or the other,", "views": 299, "comments": 0, "likes": 4, "outlier": 0.4, "followers": 756, "video_url": "https://www.instagram.com/p/Dbzccf_MDY8/", "audio_url": "https://www.instagram.com/reels/audio/37316320268014909/", "hook": "", "transcript": "", "caption": "Listen, I say this with so much love, you cannot be the CEO and the bottleneck at the same time. It is one or the other, and right now the business is voting for bottleneck.\n\nThe bottleneck is the person every decision waits on, the one whose inbox is the reason things stall, the one who cannot log off because the whole thing runs through her head. That role is exhausting and it is also completely invisible on a title.\n\nThe CEO builds it so the business does not wait on her. The processes are written, the team owns their pieces, and the machine keeps moving whether she is in the room or on the water with her phone face down.\n\nYou do not get to both hold every answer and be free. Pick the identity you actually want, and then build the foundation that makes it true.\n\nFuture you is going to want to hug you so bad for starting this now. Comment SOUNDBOARD and let\u2019s get you out of the bottleneck seat.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-09", "rank": 191}, {"handle": "corinne.naturopath", "title": "The biggest lesson I've learned about healing chronic illness is that a body only mends when it has the raw materials an", "views": 297, "comments": 0, "likes": 2, "outlier": 0.08, "followers": 3531, "video_url": "https://www.instagram.com/p/DbotMlwlEPL/", "audio_url": "https://www.instagram.com/reels/audio/27842994335359058/", "hook": "", "transcript": "", "caption": "The biggest lesson I've learned about healing chronic illness is that a body only mends when it has the raw materials and enough calm to use them, and not a second before, no matter how good the protocol looks.\n\nEveryone wants the overnight fix, the one supplement that changes everything by Friday, and I get the appeal, I chased it too.\n\nBut I've watched a woman who was sick for forty years start to turn a corner in a single month, once we finally got the order right.\n\nNothing about it was flashy, we fed the foundation and let the sequence do the work.\n\nIf you want the sequence I mean, comment INFO and I'll lay it out for you.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-04", "rank": 192}, {"handle": "corinne.naturopath", "title": "If you keep starting over and losing steam, comment INFO and I'll send you the basics I lean on.", "views": 296, "comments": 0, "likes": 1, "outlier": 0.08, "followers": 3531, "video_url": "https://www.instagram.com/p/DblYrJQElkw/", "audio_url": "https://www.instagram.com/reels/audio/27708363525457629/", "hook": "There are two kinds of sick women, the ones chasing protocols, and the ones who nailed the basics.\nWhen I was climbing out of my worst years in my health, I stopped chasing the fancy stuff and got clear on a few non-negotiables.\nThe big shift was realizing my body cares about absorbing nutrients, not counting calories.\nSo I eat the food my body actually recognizes as nourishing, my body, uniquely mine.\nAnd I pull back on the ones that my body treats as inflammatory.\nI take a multivitamin and a multimineral.\nBecause our food has nowhere near the vitamins and minerals it had 60 years ago.\nAnd orange today has about eight times less vitamin C than it had back then.\nAnd there's no eating your way out of that gap.\nAnd I cycle through feasting and fasting to stay fat adapted and metabolically flexible.\nNone of it is trendy, but it's the foundation the body runs on.\nAnd I only found it out after trying everything else.", "transcript": "There are two kinds of sick women, the ones chasing protocols, and the ones who nailed the basics.\nWhen I was climbing out of my worst years in my health, I stopped chasing the fancy stuff and got clear on a few non-negotiables.\nThe big shift was realizing my body cares about absorbing nutrients, not counting calories.\nSo I eat the food my body actually recognizes as nourishing, my body, uniquely mine.\nAnd I pull back on the ones that my body treats as inflammatory.\nI take a multivitamin and a multimineral.\nBecause our food has nowhere near the vitamins and minerals it had 60 years ago.\nAnd orange today has about eight times less vitamin C than it had back then.\nAnd there's no eating your way out of that gap.\nAnd I cycle through feasting and fasting to stay fat adapted and metabolically flexible.\nNone of it is trendy, but it's the foundation the body runs on.\nAnd I only found it out after trying everything else.", "caption": "If you keep starting over and losing steam, comment INFO and I'll send you the basics I lean on.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-03", "rank": 193}, {"handle": "revivetherapyservices", "title": "You can name what they did without handing them a diagnosis first. Comment \"[SAFE]\" and I'll send you where the real wor", "views": 295, "comments": 0, "likes": 7, "outlier": 0.19, "followers": 1519, "video_url": "https://www.instagram.com/p/Dbyfp3mEV46/", "audio_url": "https://www.instagram.com/reels/audio/38315126718074351/", "hook": "Not everyone who hurt you is a narcissist despite what the internet might say and by swearing they are narcissists might be the thing that's keeping you stuck.\nSocial media right now has convinced like everyone that their ex that hurt them or their friend that hurt them is a narcissist and I promise you not all of these people meet the clinical criteria for narcissistic personality disorder.\nI think we like to put that label on someone because for some reason it creates validation that they did indeed hurt us but here's the thing people in general hurt people sometimes because we're all human and we're not perfect and that does not mean everyone is a narcissist and here's the thing when we take all of our energy and put it on that person that we have deemed a narcissist we're taking the attention and putting it on them instead of turning it on us and helping ourselves create safety and healing with it.\nDemonizing that person can feel so powerful and does it really change anything in your body?\nNow don't get me wrong being self-aware of how someone hurt you is a good thing but here's the thing when we become so in our heads and we know the attachment style and we know the diagnosis we're giving them and the research says X Y & Z but those things don't actually help us change the way we feel about ourselves and help our healing.\nEvery hour you spend pointing the finger and diagnosing people is an hour you are missing out on attending to yourself and your own needs and also even if you are right even if they do have narcissistic personality disorder does that really regulate and heal your body at the end of the day?\nHere's the thing you are allowed to say how they treated you was fucked up but we need to take that next step and then turn inward and tend to ourselves and tend to that bracing we're constantly having that tightness that despair we're feeling it hurt 100% it hurt and focusing on them doesn't help you heal.", "transcript": "Not everyone who hurt you is a narcissist despite what the internet might say and by swearing they are narcissists might be the thing that's keeping you stuck.\nSocial media right now has convinced like everyone that their ex that hurt them or their friend that hurt them is a narcissist and I promise you not all of these people meet the clinical criteria for narcissistic personality disorder.\nI think we like to put that label on someone because for some reason it creates validation that they did indeed hurt us but here's the thing people in general hurt people sometimes because we're all human and we're not perfect and that does not mean everyone is a narcissist and here's the thing when we take all of our energy and put it on that person that we have deemed a narcissist we're taking the attention and putting it on them instead of turning it on us and h  But if nothing\u2019s written down, that poor new hire is coming to you for every tiny thing, and suddenly you\u2019ve got a second full-time job called managing them.\n\nI watched a client hire before she had documented her process, and after she had documented it, and the difference in the new hire success was night and day. Instead of just hoping it would click, she provided the instructions that laid the foundation for their success.\n\nBuild the backend first, girl, then bring someone in who can run it.\n\nComment AUDIT below and I\u2019ll send you the details.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 196}, {"handle": "jolihappynails", "title": "If \"I'm an artist, not a business person\" has been your reason to avoid the money side, comment \"BUILDER\" and I'll DM yo", "views": 288, "comments": 0, "likes": 12, "outlier": 0.1, "followers": 2872, "video_url": "https://www.instagram.com/p/Db_0d_TpoXG/", "audio_url": "https://www.instagram.com/reels/audio/29021623557427148/", "hook": "You don't have to turn into some whole business person to build a nail business that finally pays you.\nI say that as someone who hid behind, I am an artist for years.\nThe objection under a lot of stalled businesses is quiet.\nI am an artist, not a business person.\nIt sounds like a personality fact.\nIt is actually a shield and I held it up for a long time.\nSo I know exactly what it protects you from.\nIt protects you from learning the one skill that would change your income.\nBecause if you are just an artist, then pricing, positioning, retention are somebody else's job and you are allowed to stay confused about them forever without being your fault.\nSo here is the freeing part.\nYou do not have to become a business person.\nThat is a false trait.\nYou can stay every bit the craftswoman you are and simply learn a handful of concrete moves.\nHow to define a dream result in the first 30 minutes.\nHow to rebook in the same chair.\nHow to set a price and hold it.\nNone of that requires a personality transplant.\nThe tech who out-earns you is usually not more of a business type than you.\nShe just refused to let the artist's identity excuse her from three or four learnable skills.\nShe kept the art and added the mechanics.\nAnd the mechanics are far simpler than the art you already master.\nSo drop the either or.\nYou can still know your numbers.\nIn fact, the best version of your art only reaches people when a little structure carries it there.\nLearn the few moves, keep the whole artist and watch the business finally hold up to the work you are already proud of.", "transcript": "You don't have to turn into some whole business person to build a nail business that finally pays you.\nI say that as someone who hid behind, I am an artist for years.\nThe objection under a lot of stalled businesses is quiet.\nI am an artist, not a business person.\nIt sounds like a personality fact.\nIt is actually a shield and I held it up for a long time.\nSo I know exactly what it protects you from.\nIt protects you from learning the one skill that would change your income.\nBecause if you are just an artist, then pricing, positioning, retention are somebody else's job and you are allowed to stay confused about them forever without being your fault.\nSo here is the freeing part.\nYou do not have to become a business person.\nThat is a false trait.\nYou can stay every bit the craftswoman you are and simply learn a handful of concrete moves.\nHow to define a dream result in the first 30 minutes.\nHow to rebook in the same chair.\nHow to set a price and hold it.\nNone of that requires a personality transplant.\nThe tech who out-earns you is usually not more of a business type than you.\nShe just refused to let the artist's identity excuse her from three or four learnable skills.\nShe kept the art and added the mechanics.\nAnd the mechanics are far simpler than the art you already master.\nSo drop the either or.\nYou can still know your numbers.\nIn fact, the best version of your art only reaches people when a little structure carries it there.\nLearn the few moves, keep the whole artist and watch the business finally hold up to the work you are already proud of.", "caption": "If \"I'm an artist, not a business person\" has been your reason to avoid the money side, comment \"BUILDER\" and I'll DM you the free call that'll give you the few skills that actually move your income.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-13", "rank": 197}, {"handle": "corinne.naturopath", "title": "If you're tired of being sold to instead of helped, comment INFO and I'll point you somewhere real.", "views": 286, "comments": 0, "likes": 3, "outlier": 0.08, "followers": 3531, "video_url": "https://www.instagram.com/p/Dbb13D8D_Fc/", "audio_url": "https://www.instagram.com/reels/audio/27675622515465884/", "hook": "The wellness industry makes its money keeping you confused.\nDetox teas that dehydrate you and make you proud of how rough you feel.\nThe $400 stool test sold as step one before anyone checks if you can absorb your food.\nSingle supplements marketed like they'll fix a body that's short across the board.\nAll of it sells because the shiny thing markets better than the foundation.\nThe foundation is not sexy, but it's the part that reliably works.\nI'd rather lose the sale than send you chasing another dead end.", "transcript": "The wellness industry makes its money keeping you confused.\nDetox teas that dehydrate you and make you proud of how rough you feel.\nThe $400 stool test sold as step one before anyone checks if you can absorb your food.\nSingle supplements marketed like they'll fix a body that's short across the board.\nAll of it sells because the shiny thing markets better than the foundation.\nThe foundation is not sexy, but it's the part that reliably works.\nI'd rather lose the sale than send you chasing another dead end.", "caption": "If you're tired of being sold to instead of helped, comment INFO and I'll point you somewhere real.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-30", "rank": 198}, {"handle": "allandib", "title": "You open the dashboard in the morning, again after lunch, again before you leave, and the number is the same each time.", "views": 283, "comments": 0, "likes": 2, "outlier": 0.05, "followers": 6053, "video_url": "https://www.instagram.com/p/DbwhxttCWQu/", "audio_url": "https://www.instagram.com/reels/audio/1613271497135853/", "hook": "", "transcript": "", "caption": "You open the dashboard in the morning, again after lunch, again before you leave, and the number is the same each time. Watching it is how you prove to yourself that you still matter to this business.\n\nWatching the number is not the same as moving the number. The dashboard tells you what already happened. It can't tell you whether anything's being built while you're not looking.\n\nA founder whose marketing runs on a system checks that number once a week, because the system moved it. A founder who is the system checks it six times a day, because their own attention is the only lever they trust.\n\nA marketing engine produces whether or not you're watching. That's what moves the number on the days you're completely offline.\n\nComment \"STRIPE\" if you're tired of wondering where your revenue is going to come from.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-08", "rank": 199}, {"handle": "erseaberg", "title": "Bestie, this one used to sound insane to people, why would the COO deliberately make herself replaceable?", "views": 280, "comments": 0, "likes": 4, "outlier": 0.37, "followers": 756, "video_url": "https://www.instagram.com/p/Db32h67g_nd/", "audio_url": "https://www.instagram.com/reels/audio/26261188156890234/", "hook": "", "transcript": "", "caption": "Bestie, this one used to sound insane to people, why would the COO deliberately make herself replaceable?\n\nBecause I figured out early that being the only one who knows how everything works is not power, it is a cage with your name on it. If the business needs you awake and available to function, you do not get to have a life, and neither does anyone waiting on you.\n\nSo every operations role I have ever held, I did the same thing. I built the systems, wrote the training, and then hired and trained the person who could run it without me, on purpose, every time.\n\nThat is the whole philosophy behind how I work now. A business should stand on a foundation, not on one exhausted human, and the truest sign it is built right is that it keeps humming when you walk away.\n\nIf you are the only one who knows how your business runs, that is not job security, it is a trap. Comment APPLY and let\u2019s build you out of it.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 200}, {"handle": "susiebower_", "title": "After 25 years of this work, a few things became non-negotiable for me.", "views": 273, "comments": 2, "likes": 1, "outlier": 0.94, "followers": 291, "video_url": "https://www.instagram.com/p/DbXpheXN1YP/", "audio_url": "https://www.instagram.com/reels/audio/2357321414711090/", "hook": "", "transcript": "", "caption": "After 25 years of this work, a few things became non-negotiable for me.\n\nI never treat only the spot that hurts, because it's rarely where the pain is coming from.\n\nI always ask what was happening in someone's life when the pain started, since the body keeps the score of what we don't process.\n\nI work with the breath to reach past the thinking mind, into the nervous system where the pattern you.\nA depleted body goes into complete guard mode, holding on to weight and reacting to everything because somewhere along the way, it stopped believing food and rest were coming.\nPlenty of women have tried just eating more and adding some minerals and nothing changed.\nThe piece that actually matters here is food your body can absorb without fighting inflammation at the same time, plus enough vitamins and minerals to run at its baseline foundational level.\nThat's when it finally puts its guard down.\nWhat the women I work with are really after is resilience and freedom.\nThey want to understand their own body again and feel back in the driver's seat, done revolving their whole life around their health.\nI've watched them find real peace once their body finally has enough to do its job.\nYou can't force that with discipline.\nYou earn it with consistency by showing up for it.", "caption": "If years of pushing and cutting turned your body against you, comment INFO and I'll show you the way back.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-01", "rank": 202}, {"handle": "revivetherapyservices", "title": "You're the one everyone calls when their world is falling apart, the one with the calm voice and the right words and the", "views": 263, "comments": 0, "likes": 4, "outlier": 0.17, "followers": 1519, "video_url": "https://www.instagram.com/p/Db8zf66gh-c/", "audio_url": "https://www.instagram.com/reels/audio/27508652882139295/", "hook": "", "transcript": "", "caption": "You're the one everyone calls when their world is falling apart, the one with the calm voice and the right words and the spare bandwidth nobody stops to wonder how you keep finding.\n\nAnd underneath all of it there is a low hum of panic you have never once let anyone see, because somewhere you learned that being the strong one was the price of being kept around.\n\nSo you hold everyone, and you answer every text, and you keep your own falling apart very quiet and very scheduled, usually for after everyone else is asleep.\n\nBeing the dependable one is not who you are all the way down, it is a survival response your nervous system built back when being needed felt a lot safer than being seen.\n\nYou are allowed to be the one who gets held for once. You are allowed to set the whole thing down and let someone else carry the calm voice for a minute.\n\nThat is not weakness and it is not you failing at being strong, it is a dysregulated system finally learning that it is safe now to stop bracing.\nComment \"[HELD]\" and I'll send you where this work actually starts. No performance required, just you.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 203}, {"handle": "revivetherapyservices", "title": "The wellness industry profits every time you decide you need one more protocol before you can rest, so comment \"HEAL\" if", "views": 260, "comments": 2, "likes": 4, "outlier": 0.17, "followers": 1522, "video_url": "https://www.instagram.com/p/DbQxmgrCORr/", "audio_url": "https://www.instagram.com/reels/audio/27756417850677298/", "hook": "", "transcript": "", "caption": "The wellness industry profits every time you decide you need one more protocol before you can rest, so comment \"HEAL\" if you want the version of healing with an endpoint.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-26", "rank": 204}, {"handle": "erseaberg", "title": "Okay, I love you, which is the only reason I\u2019m about to say this.", "views": 255, "comments": 0, "likes": 3, "outlier": 0.34, "followers": 756, "video_url": "https://www.instagram.com/p/Db_EcM0gRlN/", "audio_url": "https://www.instagram.com/reels/audio/26261188156890234/", "hook": "", "transcript": "", "caption": "Okay, I love you, which is the only reason I\u2019m about to say this.\n\nYou keep thinking you need another course or another shiny tool, but the thing keeping you stuck is that the whole business lives in your head, and you keep avoiding the work of getting it out.\n\nI know documenting feels like the last thing you want to do when you\u2019re already slammed. But that avoidance is the exact reason you\u2019re still slammed a year later.\n\nTwo hours and a blank doc would fix the thing driving you the most crazy right now, and you keep pushing it to next week.\n\nBe the founder who finally sits down and does it. Future you, the one on an actual vacation, is going to be so grateful.\n\nComment AUDIT below and I\u2019ll send you the details.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-13", "rank": 205}, {"handle": "susiebower_", "title": "If you sat across from me with a warm cup of tea and told me about your pain, I wouldn't start with your back.", "views": 255, "comments": 0, "likes": 4, "outlier": 0.88, "followers": 291, "video_url": "https://www.instagram.com/p/DcBRaECqRGf/", "audio_url": "https://www.instagram.com/reels/audio/3629624960687524/", "hook": "", "transcript": "", "caption": "If you sat across from me with a warm cup of tea and told me about your pain, I wouldn't start with your back.\n\nI'd ask when it started, and what your life looked like around then.\n\nNine times out of ten, something was going on that you pushed through, a loss, or a hard season where you held it all and never set it down.\n\nYour body tightened to carry you through, and it kept holding long after.\n\nThen I'd show you how to breathe into that, past the part of your mind that wants to analyze it, into the place your body can let go.\n\nThat conversation is where the real work starts, and it's nothing like being told to stretch more.\n\nReady to dig deeper? Comment ROOT and let's get into it.\n\n#backpain #backsurgeryrecovery #backpainrelief #backsurgery", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-14", "rank": 206}, {"handle": "revivetherapyservices", "title": "1. You reread the same text five times hunting for the threat hidden in the tone, deciding whether the period at the end", "views": 255, "comments": 0, "likes": 2, "outlier": 0.17, "followers": 1519, "video_url": "https://www.instagram.com/p/DbyP_bmCLx7/", "audio_url": "https://www.instagram.com/reels/audio/28389672033963638/", "hook": "", "transcript": "", "caption": "1. You reread the same text five times hunting for the threat hidden in the tone, deciding whether the period at the end means they are mad at you, when they were almost certainly just busy.\n \n2. You over prepare for everything, from a five minute phone call to a grocery run, because getting caught off guard feels less like an inconvenience and more like actual physical danger.\n \n3. You cannot relax on a day off, so you clean or check your phone or find one more task, because your body is still waiting for something bad to happen and sitting still feels unsafe.\n \n4 You wake up at the smallest sound and sleep with one ear open, because even in the middle of the night your body refuses to fully stand down.\n\nYour nervous system has been on shift for so long that you have forgotten what off duty even feels like! If two or more of these are you, it is a pattern your body learned and not a flaw in your wiring, and it can be recalibrated.\n\nComment \"[OFFDUTY]\" and I'll send you the free nervous system worksheet I put together for exactly this. No pressure!", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-08", "rank": 207}, {"handle": "erseaberg", "title": "Bestie, be honest with me, is the plan to fix the mess to go buy one more tool? Because I have watched that movie so man", "views": 25 ript": "", "caption": "Everyone keeps prescribing you a big trip while your body stays braced the other fifty weeks, so comment \"HEAL\" and I'll send you what daily proof of safety looks like.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 212}, {"handle": "revivetherapyservices", "title": "You built the career and hit the numbers and became the person other people quietly ask for advice, and every bit of tha", "views": 236, "comments": 0, "likes": 1, "outlier": 0.16, "followers": 1519, "video_url": "https://www.instagram.com/p/Dbvqe2vDkOU/", "audio_url": "https://www.instagram.com/reels/audio/28483122211272584/", "hook": "", "transcript": "", "caption": "You built the career and hit the numbers and became the person other people quietly ask for advice, and every bit of that is real and you earned it.\n\nAnd your nervous system is running on fumes, bracing through the wins, waiting for the other shoe that your body swears is always about to drop.\n\nYou keep waiting to feel as steady on the inside as you look on the outside, and it never quite arrives no matter how much you achieve.\nBoth of these things are true at the same time. The success is real and the exhaustion is real, and one does not cancel the other out or make you a fraud.\n\nThe high functioning and the depleted can live in the same body, because your drive is genuine and your body has just been running survival responses under all of it for years.\n\nYou do not have to burn the whole life down to heal, and you do not have to earn one more thing before you are allowed to feel safe in it.\nYou are a badass bitch whose body simply never got the memo that it is safe now, and that memo is teachable.\n\nComment \"[BOTH]\" and I'll show you what body based work looks like for a woman who has it together on paper. No pressure.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division  sugar swings in the first place.\nAnd I tried to figure it all out by myself, alone.\nThe turnaround came when I did less, in the right order, and stopped going it solo.\nFixing those four is what let my body finally move.", "transcript": "I made four mistakes for years that kept me sick, and most women are making them too.\nI chased detoxes on a body with nothing in reserve and paid for it with weeks in bed.\nI took big doses of supplements, my gut couldn't break down, and they did next to nothing.\nI kept chasing my blood sugar directly and diligently when the real fix was getting fat adapted and metabolically flexible and finding the foods that my body in its current state was flagging as inflammatory, since that's what drives blood sugar swings in the first place.\nAnd I tried to figure it all out by myself, alone.\nThe turnaround came when I did less, in the right order, and stopped going it solo.\nFixing those four is what let my body finally move.", "caption": "If any of these sound like your routine, comment INFO and I'll help you flip them.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-03", "rank": 217}, {"handle": "erseaberg", "title": "The moment right after someone books you is the most fragile part of the client relationship, and most founders fumble i", "views": 221, "comments": 0, "likes": 0, "outlier": 0.29, "followers": 756, "video_url": "https://www.instagram.com/p/DbMczhDAEoK/", "audio_url": "https://www.instagram.com/reels/audio/3132622323696161/", "hook": "", "transcript": "", "caption": "The moment right after someone books you is the most fragile part of the client relationship, and most founders fumble it. Come on, don\u2019t be shy, raise your hand if that\u2019s you!\n\nThey get the sale, do a little happy dance, then leave the client hanging while they scramble to figure out next steps. The client goes from thrilled to nervous in about 48 pens because you built the foundation during those busy months so that future you actually gets to clock out and rest.", "transcript": "Here's how your next off season is gonna look once the business can run without you being in the room.\nI want you to take a second to picture this low season that you've been dreaming about.\nNot the version where you're finally catching up on admin, the version where you finally genuinely rest because the work that has to keep happening is happening in the background without you needing to steer it.\nYour team is beautifully running the client experience off your documented processes.\nSo every onboarding, check-in, and every handoff is all moving on its own while you're completely off grid.\nAnd of course, this means the money's still coming in on a predictable rhythm because the business is no longer tied to your energy.\nIt's tied to the systems that you created.\nAnd it sounds cliche, but systems don't need a vacation.\nSo by the time season comes back around, you get to come in with a clear head and the actual capacity to plan the next stretch instead of digging out of the last one.\nThat's what an off season's supposed to feel like.\nBut none of this happens if you're wishing for a mid-season.\nIt happens because you built the foundation during those busy months so that future you actually gets to clock out and rest.", "caption": "The restful off-season is built during the busy one. Comment APPLY and let\u2019s make sure this one is different.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-08", "rank": 246}, {"handle": "erseaberg", "title": "Everyone\u2019s out here obsessing over the front-facing glow-up, the fonts, the website, the whole aesthetic, and meanwhile", "views": 148, "comments": 0, "likes": 6, "outlier": 0.2, "followers": 756, "video_url": "https://www.instagram.com/p/Db6khBngPxu/", "audio_url": "https://www.instagr  {"handle": "reland_brandstrategist", "title": "You give away the first call because you are afraid a fee will cost you the client. Add up the free ones. The hours, the", "views": 115, "comments": 0, "likes": 3, "outlier": 0.33, "followers": 349, "video_url": "https://www.instagram.com/p/Db-6M1SAeL2/", "audio_url": "https://www.instagram.com/reels/audio/27800259366264001/", "hook": "", "transcript": "", "caption": "You give away the first call because you are afraid a fee will cost you the client. Add up the free ones. The hours, the custom proposals, the strategy you handed over so someone could take it and try it alone. Free trains buyers to treat your time as optional and to shop around while they do it. A paid entry point does the opposite. Even a small fee changes how someone shows up, because people value what they invest in and tune out what they get for nothing. Getting paid from the first conversation is not aggressive, it is the thing that finally protects your time and filters for people who are serious. If you are done running unpaid discovery calls, comment PROFIT and I will DM you how the paid entry works.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-13", "rank": 272}, {"handle": "erseaberg", "title": "Every founder who finally stepped back had these three things first, and not one of them was a new app. Comment AUDIT an", "views": 112, "comments": 0, "likes": 6, "outlier": 0.15, "followers": 756, "video_url": "https://www.instagram.com/p/Db6gpmsA6ER/", "audio_url": "https://www.instagram.com/reels/audio/28222068707480923/", "hook": "There's three things every single business I have rebuilt needed before the founder could actually step back from it.\nNumber one is a documented client journey.\nEvery business that freed its founder had one full process written down from start to finish so the team could run the client experience without asking the owner what happe const daysAgo = d => { const [y,m,day]=d.split("-").map(Number); return (SNAP-new Date(y,m-1,day))/86400000; };

            <div class="dm"><b class="tnum">${nf(d.views)}</b><i>Views</i></div>
            <div class="dm"><b class="tnum">${fmtOutlier(d.outlier)}×</b><i>Outlier Score</i></div>
            <div class="dm"><b class="tnum">${nf(d.comments)}</b><i>Comments</i></div>
            <div class="dm"><b class="tnum">${nf(d.likes)}</b><i>Likes</i></div>
            <div class="dm"><b class="tnum">${nf(d.followers)}</b><i>Followers</i></div>
            <div class="dm"><b>${fmtDate(d.posted)}</b><i>Posted</i></div>
          </div>
          <div class="dlinks">
            ${d.video_url?`<a class="lk watch" href="${esc(d.video_url)}" target="_blank" rel="noopener">▶ Watch video</a>`:''}
            ${d.audio_url?`<a class="lk audio" href="${esc(d.audio_url)}" target="_blank" rel="noopener">♪ The audio</a>`:''}
          </div>
        </div>
      </div></div></div>
    </div>`;
  }).join("");
  bindRows();
}
function bindRows(){
  document.querySelectorAll(".row").forEach(row=>{
    const main=row.querySelector(".rowmain");
    const toggle=()=>{ const open=row.classList.toggle("open"); main.setAttribute("aria-expanded",open); main.querySelector(".chev").style.transform=open?"rotate(180deg)":""; };
    main.addEventListener("click",toggle);
    main.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
  });
}

/* ---------- creators ---------- */
function renderCreators(pool){
  const box=$("#creators");
  if(!pool.length){ box.innerHTML=`<div class="empty-state"><div class="big">🏁</div><h3>No creators yet</h3><p>No entries in this division for the ${windowLabel()}.</p></div>`; return; }
  const map={};
  pool.forEach(d=>{
    const m=map[d.handle]||(map[d.handle]={handle:d.handle,videos:0,views:0,best:0,bestOut:0,followers:d.followers});
    m.videos++; m.views+=d.views; m.best=Math.max(m.best,d.views); m.bestOut=Math.max(m.bestOut,d.outlier); m.followers=Math.max(m.followers,d.followers);
  });
  const list=Object.values(map).sort((a,b)=>b.views-a.views);
  box.innerHTML = `<div class="colhead" style="grid-template-columns:52px 1fr 120px 82px 92px"><span>Rank</span><span>Creator</span><span class="r">Total views</span><span class="r">Videos</span><span class="r">Best outlier</span></div>`+
  list.map((c,i)=>`<div class="crow${i===0?' lead':''}">
      <div class="rank${i<3?' top3':''} tnum">${i+1}</div>
      <div><div class="handle" style="font-weight:800;font-size:15px">@${esc(c.handle)}</div>
        <div class="t" style="font-size:12px;color:var(--text-dim);margin-top:2px">${nf(c.followers)} followers · best video ${nf(c.best)} views</div></div>
      <div class="cviews views-cell"><b class="tnum">${nf(c.views)}</b></div>
      <div class="metric sm c-hide tnum" style="text-align:right">${c.videos}</div>
      <div class="metric big c-hide" style="text-align:right"><span class="otag${c.bestOut>=3?' hot':''} tnum">${fmtOutlier(c.bestOut)}×</span></div>
    </div>`).join("");
}

/* ---------- orchestration ---------- */
function renderAll(){
  const pool=currentPool(); rankPool(pool);
  document.querySelectorAll(".divpill").forEach(p=>p.setAttribute("aria-selected",String(p.dataset.div===state.division)));
  document.querySelectorAll("#winToggle button").forEach(b=>b.setAttribute("aria-selected",String(+b.dataset.days===state.days)));
  renderStats(pool); renderDivbar(); renderPodium(pool); renderBoard(pool); renderCreators(pool);
}
function switchView(v){
  state.view=v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===v)));
  $("#videosView").hidden = v!=="videos"; $("#creatorsView").hidden = v!=="creators";
  $(".rightctl").style.visibility = v==="videos"?"visible":"hidden";
}

/* ---------- theme ---------- */
function initTheme(){
  const btn=$("#themeBtn");
  const apply=t=>{ if(t==="system")document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t);
    const dark = t==="dark" || (t==="system" && matchMedia("(prefers-color-scheme:dark)").matches);
    $("#themeIcon").textContent = dark?"☾":"☀"; $("#themeLabel").textContent = t.charAt(0).toUpperCase()+t.slice(1); };
  let cur="system"; apply(cur);
  btn.addEventListener("click",()=>{ cur = cur==="system"?"light":cur==="light"?"dark":"system"; apply(cur); });
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(cur==="system") apply("system"); });
}

/* ---------- wire ---------- */
initTheme();
renderHeaderStatic();
renderAll();
$("#winToggle").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.days=+b.dataset.days; renderAll(); });
$("#search").addEventListener("input",e=>{ state.q=e.target.value; renderBoard(currentPool()); });
$("#sort").addEventListener("change",e=>{ state.sort=e.target.value; const p=currentPool(); rankPool(p); renderBoard(p); });
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchView(t.dataset.view)));
</script>
</body>
</html>

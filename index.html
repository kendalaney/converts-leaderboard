<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creator Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F5F6F9; --surface-3:#EAEDF2;
    --border:#DCE0E8; --border-2:#CDD3DD;
    --text:#161A21; --text-dim:#5A6474; --text-faint:#8A93A2;
    --gold:#B4831F; --gold-bg:#FBF2DA; --gold-line:#E7CE93;
    --silver:#6E7987; --silver-bg:#EDEFF3;
    --bronze:#9C5F2E; --bronze-bg:#F6E9DD;
    --pos:#178A57; --accent:#2E6FB6; --accent-bg:#E7F0FA;
    --bar:#C6CDD8; --bar-lead:#D8B45A;
    --shadow:0 1px 2px rgba(20,26,36,.06),0 6px 20px rgba(20,26,36,.06);
    --shadow-lg:0 2px 6px rgba(20,26,36,.08),0 18px 44px rgba(20,26,36,.12);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Helvetica Neue","Arial Nova",Arial,system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#151A22; --surface-2:#1A2029; --surface-3:#20283340;
    --border:#262E3A; --border-2:#333D4C;
    --text:#EAEEF4; --text-dim:#98A2B2; --text-faint:#6C7686;
    --gold:#F2C14E; --gold-bg:#241E10; --gold-line:#5A481F;
    --silver:#C2CAD4; --silver-bg:#1B2029;
    --bronze:#D08A4E; --bronze-bg:#241A11;
    --pos:#38D08A; --accent:#5AA2EC; --accent-bg:#13202E;
    --bar:#2A3340; --bar-lead:#7A5E23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1015; --surface:#151A22; --surface-2:#1A2029; --surface-3:#20283340;
    --border:#262E3A; --border-2:#333D4C;
    --text:#EAEEF4; --text-dim:#98A2B2; --text-faint:#6C7686;
    --gold:#F2C14E; --gold-bg:#241E10; --gold-line:#5A481F;
    --silver:#C2CAD4; --silver-bg:#1B2029;
    --bronze:#D08A4E; --bronze-bg:#241A11;
    --pos:#38D08A; --accent:#5AA2EC; --accent-bg:#13202E;
    --bar:#2A3340; --bar-lead:#7A5E23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:1140px;margin:0 auto;padding:26px 18px 80px}
  .tnum{font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .masthead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;justify-content:space-between;margin-bottom:6px}
  .brand{display:flex;flex-direction:column;gap:8px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:8px}
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--gold);display:inline-block}
  h1{margin:0;font-size:clamp(30px,5.2vw,50px);font-weight:800;letter-spacing:-.026em;line-height:.98;text-wrap:balance}
  .sub{color:var(--text-dim);font-size:14.5px;max-width:64ch}
  .theme-toggle{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:8px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;font-weight:600}
  .theme-toggle:hover{border-color:var(--border-2);color:var(--text)}

  /* window toggle */
  .winbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 2px}
  .winlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
  .segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:2px}
  .segmented button{border:0;background:transparent;color:var(--text-dim);padding:9px 17px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
  .segmented button:hover{color:var(--text)}
  .segmented button[aria-selected="true"]{background:var(--surface);color:var(--gold);box-shadow:var(--shadow)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow)}
  .stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
  .stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
  .stat .v small{font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:0}

  /* division bar */
  .divbar{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;margin-top:8px;scrollbar-width:thin}
  .divbar::-webkit-scrollbar{height:6px}
  .divbar::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
  .divpill{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:border-color .15s,color .15s}
  .divpill:hover{border-color:var(--border-2);color:var(--text)}
  .divpill[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
  .divpill .emo{font-size:14px;line-height:1}
  .divpill .cnt{font-family:var(--mono);font-size:11px;background:var(--surface-2);color:var(--text-dim);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
  .divpill[aria-selected="true"] .cnt{background:var(--surface);color:var(--text)}

  .section-label{display:flex;align-items:center;gap:12px;margin:12px 0 14px}
  .section-label h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .section-label h2 .scope{color:var(--gold)}
  .section-label .line{flex:1;height:1px;background:var(--border)}
  .section-label .hint{font-family:var(--mono);font-size:11px;color:var(--text-faint);white-space:nowrap}

  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
  .pod{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 18px 18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;gap:12px}
  .pod.g1{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),var(--surface) 62%)}
  .pod.g3{border-color:var(--bronze-bg)}
  .pod .crown{position:absolute;top:14px;right:16px;font-size:22px}
  .medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;flex:none}
  .m1{background:var(--gold);color:#231a05}.m2{background:var(--silver);color:#1c222b}.m3{background:var(--bronze);color:#231204}
  .pod .who{display:flex;align-items:center;gap:11px}
  .pod .handle{font-weight:800;font-size:16px;letter-spacing:-.01em;word-break:break-word}
  .pod .rankword{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
  .pod .bigviews{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .pod .bigviews span{font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:0;margin-left:5px}
  .pod .podmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--border)}
  .pod .pm{display:flex;flex-direction:column;gap:1px}
  .pod .pm b{font-size:14px;font-weight:700;font-family:var(--mono)}
  .pod .pm i{font-size:10px;font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
  .pod .podtitle{font-size:12.5px;color:var(--text-dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pod .divtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:999px;align-self:flex-start}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 12px}
  .tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px}
  .tab{border:0;background:transparent;color:var(--text-dim);padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .rightctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 13px 9px 32px;font-size:13.5px;color:var(--text);min-width:230px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='%238A93A2' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.5' y2='16.5'/></svg>");background-repeat:no-repeat;background-position:11px center}
  .search:focus{outline:none;border-color:var(--accent)}
  .sortsel{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim)}
  .sortsel label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
  select.srt{appearance:none;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 30px 9px 12px;font-size:13px;font-weight:600;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238A93A2' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 9px center}

  .board{display:flex;flex-direction:column;gap:7px}
  .colhead{display:grid;grid-template-columns:52px 1fr 118px 92px 78px;gap:12px;padding:4px 16px;align-items:center}
  .colhead span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
  .colhead .r{text-align:right}
  .row{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s}
  .row:hover{border-color:var(--border-2)}
  .row.lead{border-color:var(--gold-line)}
  .rowmain{display:grid;grid-template-columns:52px 1fr 118px 92px 78px;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;position:relative}
  .rank{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--text-dim);text-align:center}
  .row.lead .rank{color:var(--gold)}
  .rank.top3{color:var(--text)}
  .vid{min-width:0}
  .vid .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .vid .handle{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
  .fmt{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:999px}
  .vid .t{font-size:12.5px;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .views-cell{text-align:right}
  .views-cell b{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .barwrap{height:4px;background:var(--bar);border-radius:3px;margin-top:5px;overflow:hidden}
  .barfill{height:100%;background:var(--accent);border-radius:3px}
  .row.lead .barfill{background:var(--bar-lead)}
  .metric{text-align:right;font-family:var(--mono);font-weight:600}
  .metric.big{font-size:15px}
  .metric.sm{font-size:13px;color:var(--text-dim)}
  .metric .lab{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-top:2px;font-family:var(--sans);font-weight:600}
  .otag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:13px}
  .otag.hot{background:var(--gold-bg);color:var(--gold)}
  .chev{position:absolute;right:12px;bottom:9px;color:var(--text-faint);transition:transform .2s;display:none}

  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
  .row.open .detail{grid-template-rows:1fr}
  .detail-inner{overflow:hidden;min-height:0}
  .row.open{box-shadow:var(--shadow-lg)}
  .dpad{padding:4px 16px 18px;border-top:1px solid var(--border);margin-top:2px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin-top:14px}
  @media(max-width:640px){.dgrid{grid-template-columns:1fr}}
  .block .blab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .block p{margin:0;font-size:13.5px;color:var(--text);line-height:1.62}
  .block p.empty{color:var(--text-faint);font-style:italic}
  .hookbox{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:8px;padding:11px 13px}
  .hookbox p{font-size:14px;font-weight:600}
  .transcript{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;max-height:230px;overflow:auto}
  .transcript p{font-size:13px;line-height:1.7;white-space:pre-wrap}
  .dmetrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin-top:2px}
  .dm{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .dm b{font-size:16px;font-weight:800;font-family:var(--mono);letter-spacing:-.01em}
  .dm i{display:block;font-size:9.5px;font-style:normal;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin-top:2px;font-weight:600}
  .dlinks{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
  .lk{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--border)}
  .lk.watch{background:var(--accent);color:#fff;border-color:transparent}
  .lk.watch:hover{text-decoration:none;filter:brightness(1.06)}
  .lk.audio{background:var(--surface-2);color:var(--text)}
  .lk.audio:hover{text-decoration:none;border-color:var(--border-2)}
  .triggers{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .trg{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);border:1px solid transparent;padding:2px 9px;border-radius:999px}

  .empty-state{text-align:center;padding:46px 20px;background:var(--surface);border:1px dashed var(--border-2);border-radius:16px;color:var(--text-dim)}
  .empty-state .big{font-size:30px;margin-bottom:8px}
  .empty-state h3{margin:0 0 4px;font-size:16px;color:var(--text)}
  .empty-state p{margin:0;font-size:13.5px}

  .creators{display:flex;flex-direction:column;gap:7px}
  .crow{display:grid;grid-template-columns:52px 1fr 120px 82px 92px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow)}
  .crow.lead{border-color:var(--gold-line)}
  .crow .cviews b{font-size:17px;font-weight:800;letter-spacing:-.02em}
  @media(max-width:680px){.crow{grid-template-columns:42px 1fr 92px;row-gap:8px}.crow .c-hide{display:none}}

  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);color:var(--text-faint);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
  footer .mono{font-family:var(--mono)}

  @media(max-width:720px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .podium{grid-template-columns:1fr}
    .colhead{display:none}
    .rowmain{grid-template-columns:40px 1fr auto;gap:10px;row-gap:6px;padding-bottom:20px}
    .rowmain .metric.big,.rowmain .metric.sm{display:none}
    .views-cell{grid-column:3}
    .chev{display:block}
    .vid .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <div class="eyebrow">CONVERTS&trade; System &middot; Client Standings</div>
      <h1>The Creator Leaderboard</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="theme-toggle" id="themeBtn" type="button" aria-label="Toggle color theme">
      <span id="themeIcon">◐</span><span id="themeLabel">Theme</span>
    </button>
  </header>

  <div class="winbar">
    <span class="winlabel">Time window</span>
    <div class="segmented" id="winToggle" role="tablist" aria-label="Time window">
      <button role="tab" data-days="7">7 days</button>
      <button role="tab" data-days="30">30 days</button>
      <button role="tab" data-days="90">90 days</button>
      <button role="tab" data-days="365">365 days</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="divbar" id="divbar" role="tablist" aria-label="Divisions"></div>

  <div class="section-label">
    <h2>🏆 On the Podium <span class="scope" id="podScope"></span></h2><div class="line"></div>
    <span class="hint">Ranked by views</span>
  </div>
  <div id="podium"></div>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Leaderboard view">
      <button class="tab" role="tab" id="tab-videos" aria-selected="true" data-view="videos">Top Videos</button>
      <button class="tab" role="tab" id="tab-creators" aria-selected="false" data-view="creators">Creator Standings</button>
    </div>
    <div class="rightctl">
      <input class="search" id="search" type="search" placeholder="Search handle or hook" aria-label="Search videos">
      <div class="sortsel">
        <label for="sort">Sort</label>
        <select class="srt" id="sort" aria-label="Sort by">
          <option value="views">Views</option>
          <option value="outlier">Outlier Score</option>
          <option value="comments">Comments</option>
          <option value="likes">Likes</option>
        </select>
      </div>
    </div>
  </div>

  <div id="videosView"><div id="board" class="board"></div></div>
  <div id="creatorsView" hidden><div class="creators" id="creators"></div></div>

  <footer>
    <span>Data: CONVERTS&trade; Client Data &middot; <span class="mono" id="period"></span></span>
    <span class="mono" id="snapshot"></span>
  </footer>
</div>

<script>

fferent tracks just to like see if I knew it.\nAnd also to get the feeling of the stage in my body, because when you're a swing,", "caption": "the job description of a swing sounds fake because WHAT DO YOU MEAN that\u2019s what they do \ud83d\ude02\ud83d\ude02\n\n#broadway #understudy #theatre #musicaltheatre #musicaltheater", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-01", "rank": 13}, {"handle": "justinschumanofficial", "title": "there\u2019s hope for funny people yet", "views": 5653, "comments": 22, "likes": 379, "outlier": 0.03, "followers": 186888, "video_url": "https://www.instagram.com/p/DbuA4FkKsMj/", "audio_url": "https://www.instagram.com/reels/audio/28274387315498971/", "hook": "", "transcript": "one of the most depressing things i see on social media every day is the death of funny people i meet people in this world, oftentimes like creatives, and i'm like, you're a funny bitch like, we would get on well invariably, the question of like, oh, what do you do, blah blah blah and i say i do work on social media, personal branding, storytelling i help people translate their personality and be themselves online such that we can use social media as like a tool for self-development and they're always like, well that's really interesting and that i would far prefer that version of social media i'm like, yeah, wouldn't you? wouldn't that be great? i'm always like, do you create? and they're like, oh no, i fucking hate it yeah yeah and then there's the few people that have tried it and i've like watched their content and i'm like, where did you go? there's something about putting yourself on camera and making yourself highly visible in this space where you are terrified to be cringey and have a fear that people you know are going to see you doing the cringey thing that like wipes the slate clean like everything that makes you so special and angular in the world is agram.com/p/DbjbBREu15f/", "audio_url": "https://www.instagram.com/reels/audio/1041427958369976/", "hook": "", "transcript": "", "caption": "Being the cheapest in your area feels safe because it might fill your book faster, but it fills it with people who leave as soon as somebody down the street gives a discount.\n\nI was the bargain for years, working 12 hour days and taking home almost nothing to show for it. The clients who came for the deal only cared about the deal, and they never stuck around once I stopped being \"a good deal\".\n\nWhen I raised my prices and let my content do the talking, the right women found me and they stayed with me.\n\nYou built real skill over the years, and it's time your prices reflected that.\n\nComment VALUE to get the system my students use, and that personally use to base my pricing on my value.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-02", "rank": 16}, {"handle": "dragana.jasprica", "title": "For years, I did all the wrong things with FULL conviction.", "views": 2555, "comments": 11, "likes": 14, "outlier": 0.06, "followers": 42593, "video_url": "https://www.instagram.com/p/DbsIKDsBTfi/", "audio_url": "https://www.instagram.com/reels/audio/2035740753358396/", "hook": "", "transcript": "", "caption": "For years, I did all the wrong things with FULL conviction.\n\n\ud83c\udf7d\ufe0f I jumped from diet to diet, always chasing the next thing that promised to finally work. Low carb, keto, blood type, metabolic balance, you name it, I tried it. None of it was built around what my body actually needed.\n\n\ud83c\udf5e I cut my carbs, for months and got softer, not leaner. It ended in the heaviest weigh-in of my life. So I gave up on it pretty fast, and learned the hard way that cutting carbs wasn\u2019t the answer, it was part of the problem.\n\n\ud83e\udd75 I trained hard and constantly, athletic style training in a group setting. My fitness ause a coach swore they\u2019d detox my legs. \ud83d\ude05\n\nNothing changed.\n\nWhat actually changed it was matching my training and my nutrition to ONE goal at a time, and running the phases in the right order.\n\nWork out what my body actually needed first. Then a real fat loss phase. Then stabilize it so it stuck. Then months of properly building.\n\nOne after the other. Not all at once, which is what I\u2019d been doing for years without realizing it.\n\nAnd my health came back WHILE my body changed. Not instead of it.\n\n6 years of coaching later and I\u2019ve watched women do the same unglamorous work, and then get told by someone that they\u2019re just lucky. \ud83d\ude43\n\nLuck was never the thing you were missing.\n\nIf you\u2019re done doing this alone and you want someone to finally look at the whole picture...\n\n\u2764\ufe0f\u200d\ud83d\udd25 Comment \u201cTRANSFORM\u201d\nand I\u2019ll personally reach out.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-31", "rank": 21}, {"handle": "justinschumanofficial", "title": "literally begging you to be more self-indulgent", "views": 1972, "comments": 5, "likes": 144, "outlier": 0.01, "followers": 186881, "video_url": "https://www.instagram.com/p/Dbyg-OsK1Xs/", "audio_url": "https://www.instagram.com/reels/audio/27795122780172556/", "hook": "", "transcript": "The most slept on skill if you wanna be a successful content creator is the ability to notice shit in your own life and like the ha moments that happen in your head that would ordinarily just like fly by the barcode scanner of your consciousness as you like throw them into your mental basket.\nOf course you think that the most impactful content you could create is like value packed and created for your ideal audience member when in reality the audience that you want to grow, an audience that knows you for you, an audience that the size of which is going to yield opportunities that could  supplements like the next bottle was going to be the one that finally fixed me.", "views": 1595, "comments": 9, "likes": 23, "outlier": 0.45, "followers": 3531, "video_url": "https://www.instagram.com/p/DbWQiqXDc9A/", "audio_url": "https://www.instagram.com/reels/audio/27609338855384320/", "hook": "", "transcript": "", "caption": "For years I kept buying supplements like the next bottle was going to be the one that finally fixed me.\n\nI had a cabinet worth thousands of dollars and somehow felt worse than before I started, and every new expert had one more thing for me to add on top.\n\nWhat none of them checked was whether my body could break any of it down, because a body that's inflamed and low on stomach acid doesn't absorb much of what you hand it, so I was swallowing all of it and losing most of it.\n\nWhen I finally fixed my digestion and replenished my mineral and vitamin stores, the things I was already taking started to matter, and it turned out I needed far less than the internet had me believing.\n\nIf your cabinet's full and your energy still isn't, comment INFO and I'll walk you through the absorption check I start every woman on.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 26}, {"handle": "justinschumanofficial", "title": "good news: magnetism is still free. wanna learn how? comment \u2018newsletter\u2019 for a direct line to my brain in your inbox \ud83e\udde0", "views": 1587, "comments": 8, "likes": 143, "outlier": 0.01, "followers": 186888, "video_url": "https://www.instagram.com/p/Db3GhraOcP8/", "audio_url": "https://www.instagram.com/reels/audio/28147477731542485/", "hook": "", "transcript": "i have a theory, and to prove it true i'm gonna prop you up on this water bottle and i'm gonna first tell you that i was on broadway for 3 years, which we're gonna return to but my theory is, you are obsessed with production quality in your videos e Authority"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-10", "rank": 27}, {"handle": "lori_nails", "title": "For years I treated my page like a photo album, all pretty nails (but no prices,) and nothing that told her how to book", "views": 1515, "comments": 0, "likes": 71, "outlier": 0.02, "followers": 69231, "video_url": "https://www.instagram.com/p/Dbtd_Vhu-jy/", "audio_url": "https://www.instagram.com/reels/audio/657518723487598/", "hook": "", "transcript": "", "caption": "For years I treated my page like a photo album, all pretty nails (but no prices,) and nothing that told her how to book me.\n\nThe likes came pouring in from other nail artists while my books sat there looking the same as always.\n\nA storefront tells people what you do and what it costs... and it makes it easy to walk in,. The day mine started doing that, strangers turned into paying clients.\n\nYour work is worth showing off, but showing it off on its own was never going to fill your chair.\n\nComment AUDIT and I'll take a look at your page and tell you what's stopping it from booking.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 28}, {"handle": "justinschumanofficial", "title": "oh wait\u2026 what if this *was* the work?", "views": 1463, "comments": 13, "likes": 409, "outlier": 0.01, "followers": 186884, "video_url": "https://www.instagram.com/p/DbQDqvyq0KV/", "audio_url": "https://www.instagram.com/reels/audio/972775955389908/", "hook": "", "transcript": "", "caption": "oh wait\u2026 what if this *was* the work?\n\n[if this is the first time you\u2019re seeing my face, hi. i\u2019m justin.]\n\ni spent years performing on broadway.\n\nquietly, in my dressing room five stories above the stage, i started posting on social media and finding my own voice.\n\nnow i run a company from wherever i happen to be in the world:\n\nsometimes from a hotel room, sometimes from the delta sky club, \nand sometimes from a train through hokkaido.\n\nbroadway taught me how to perform.\n\nnow my work is helping people become more fully themselves while someone is watching. (ie not performing even when there\u2019s an audience.)\n\ni built this business by leaning into the parts of me i used to think were too much:\n\nmy ambition.\nmy violent productivity.\nmy hypersensitivity to other people\u2019s feelings.\nmy need to build a life that feels extraordinary to me.\n\ni\u2019m obsessed with provoking nonlinear thinkers and people who never quite fit\u2026 the ones who were told to get to the fucking point, stop being so sensitive, or quit being long-winded\u2026 into no longer editing themselves for the room\u2019s approval. \n\ni teach them how to stop disappearing the second the camera turns on, to treat social media as a tool for personality rehab, and to build influence without becoming an influencer.\n\ni\u2019m very much still working.\n\n(probably more than ever.)\n\ni\u2019m just no longer convinced work has to look like missing my own life.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-26", "rank": 29}, {"handle": "dragana.jasprica", "title": "After 6 years and 500+ women, here\u2019s what I\u2019d NEVER tell you to do. Even though most coaches will. \ud83d\udc47\ud83c\udffc", "views": 1372, "comments": 5, "likes": 24, "outlier": 0.03, "followers": 42593, "video_url": "https://www.instagram.com/p/Db00bMsBwDt/", "audio_url": "https://www.instagram.com/reels/audio/175829676434280/", "hook": "", "transcript": "", "caption": "After 6 years and 500+ women, here\u2019s what I\u2019d NEVER tell you to do. Even though most coaches will. \ud83d\udc47\ud83c\udffc\n\n1.) I\u2019d never tell you meal timing doesn\u2019t matter.\n\nMost coaches will say it\u2019s ALL about calories in versus calories out. But your body handles carbs far better earlier in the day, when your insulin sensitivity is higher, than it does at 9pm on the couch. Get your timing right and sometimes you can actually eat MORE.\n\n2.) I\u2019d never blame your hormones, your age, or your genetics.\n\nIt\u2019s the laziest answer in the industry, and it\u2019s the one that keeps women stuck for years, buying fix after fix for a problem nobody ever actually checked. I\u2019d look at how you train and how you eat first, every single time.\n\n3.) I\u2019d never sell you \u201ebalanced\u201c fat loss where nothing in your life has to change.\n\nKeep the wine, keep the dinners out, and the fat just leaves anyway. That\u2019s the promise that keeps women dieting for YEARS and never actually leaning out.\n\n4.) I\u2019d never leave you in a permanent mild deficit trying to lose fat and build muscle at the same time. \n\nUnless you\u2019re a total beginner or on gear, that just keeps you stuck in the middle, never lean and never built.\n\nMost of what you\u2019ve been told about fat loss is exactly what\u2019s keeping you stuck. \ud83e\udd37\ud83c\udffc\u200d\u2640\ufe0f\n\nWant to know what I WOULD tell you to do instead? \ud83d\udc47\ud83c\udffc\n\n\u2705 Comment LOOK and I\u2019ll send you my free resource.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-09", "rank": 30}, {"handle": "dragana.jasprica", "title": "You cut your calories, you train hard, the scale won\u2019t move, and you decide your metabolism must be slow, or it\u2019s your a", "views": 1339, "comments": 36, "likes": 18, "outlier": 0.03, "followers": 42593, "video_url": "https://www.instagram.com/p/DbxR0xYBsY4/", "audio_url": "", "hook": "", "transcript": "", "caption": "You cut your calories, you train hard, the scale won\u2019t move, and you decide your metabolism must be slow, or it\u2019s your age, or genetics. \ud83e\udee0\n\u00a0\nBut here\u2019s what\u2019s usually actually happening:\ud83d\udc47\ud83c\udffc\n\u00a0\nYou\u2019re not really in a proper deficit at all.\n\u00a0\nYou\u2019re strict Monday to Friday. Then the weekend rolls around, a few meals out, a bit more relaxed, some untracked bits here and there.\n\u00a0\nAnd across the whole week, it all averages back out to maintenance.\n\u00a0\nSo Monday to Friday you FEEL like you\u2019re dieting. But your body only responds to the whole week.\n\u00a0\nAnd the whole week?\nNothing actually happened.\n\u00a0\nIt\u2019s not your metabolism.\nIt\u2019s not your age.\nIt\u2019s not your genetics.\n\u00a0\nThe problem is that being in a calorie deficit is only ONE piece of the puzzle. \ud83e\udde9\n\u00a0\nBecause a deficit only actually works when all 4 levers of your nutrition is dialed in.\n\u00a0\nSet those up wrong, and either the deficit isn\u2019t really there, or you can\u2019t sustain it long enough to really lean out.\n\u00a0\nThat\u2019s why \u201djust eat less\u201c never worked. And it\u2019s why you can\u2019t just white-knuckle your weekends either.\n\u00a0\nWhen all 4 levers are set up together, you can actually stick to the deficit, and the scale finally moves.\n\u00a0\nWant to see how all 4 levers actually work together? \ud83d\udc47\ud83c\udffc\n\u00a0\n\u2705 Comment LOOK and I\u2019ll send you my free resource.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-08", "rank": 31}, {"handle": "justinschumanofficial", "title": "tell me what your business sells. i\u2019ll build a strategy for some of you.", "views": 1278, "comments": 4, "likes": 66, "outlier": 0.01, "followers": 186882, "video_url": "https://www.instagram.com/p/DbcTx5kKLoA/", "audio_url": "https://www.instagram.com/reels/audio/27745795388453091/", "hook": "", "transcript": "", "caption": "tell me what your business sells. i\u2019ll build a strategy for some of you.\n\n#founderledbrand #businesscontent #personalbranding #smallbusinessmarketing", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "Comment Response", "division": "reaction", "posted": "2026-07-31", "rank": 32}, {"handle": "corinne.naturopath", "title": "Her labs confirmed it months later, but her body told the story first. If you want the order these came back in, comment", "views": 1249, "comments": 0, "likes": 7, "outlier": 0.35, "followers": 3531, "video_url": "https://www.instagram.com/p/Dbtb-dcgs_Z/", "audio_url": "https://www.instagram.com/reels/audio/27713797241620279/", "hook": "", "transcript": "", "caption": "Her labs confirmed it months later, but her body told the story first. If you want the order these came back in, comment INFO and I'll DM you where to start.", "trigger": ["Results & Testimonials"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 33}, {"handle": "ameliesadvicee", "title": "if you want a reading built on what actually changes things, comment \u201cCHART\u201d and let\u2019s book your session.", "views": 1190, "comments": 1, "likes": 69, "outlier": 0.03, "followers": 43033, "video_url": "https://www.instagram.com/p/DbbT0wDxzMz/", "audio_url": "https://www.instagram.com/reels/audio/27659492447042780/", "hook": "", "transcript": "After over 300 professional readings, these are some non-negotiables I do so the person actually walks away with a positive impact instead of just learning more about their personality.\nNumber one, I'm always going to look at your rising sign and your chart ruler.\nThis is the most important part of your chart.\nIt is going to tell me what's your higher path in this life.\nHow do you come across?\nWhat's the disconnect with how people perceive you versus how you feel?\nWhat are you going through?\nNumber two, I always ask you specific questions.\nNot just generally like, okay, what do you want to know right off the bat?\nI'm like, what is not working in your life that you want to get to the bottom of?\nIs it career?\nDo we need to figure out the top five careers and businesses aligned with your chart that you'd be fulfilled and successful in?\nNumber three, my favorite, I always look at the nodes, the north and south node.\nNot just to understand like past life theory and karma and all that.\nNot all of you are going to have that belief system.\nBut because the south node shows you what pattern might you be stuck in that is preventing you from feeling good in your life versus what's your north node?\nWhat will get you unstuck from this current situation?\nFourth, I always check the major transits that's hitting your chart.\nWhat you need to know in this next year and how we can set you up for it and not scare you.\nFifth, I always end with a specific action step.\nI don't just summarize what we talked about.\nI'm like, okay, what actions are we going to take moving forward to see progress?\nI show you, okay, this is what your energy is saying.\nHere are some steps that could help you.\nWhat do you think?\nAnd then we kind of workshop to figure out what's going to fit in my life because there's a birth chart and then there's a person with real experience, real responsibilities.\nWe have to customize it to you.\nIf you want a book reading with me, link in my bio.\nI love you so much.", "caption": "if you want a reading built on what actually changes things, comment \u201cCHART\u201d and let\u2019s book your session.\n\n#astrologypost #zodiacsigns #birthchart", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-30", "rank": 34}, {"handle": "jolihappynails", "title": "Nail Techs, you know that thing you do where you write a booking in your paper planner, then again in your phone calenda", "views": 1162, "comments": 0, "likes": 18, "outlier": 0.4, "followers": 2872, "video_url": "https://www.instagram.com/p/Db9aNzBJbrs/", "audio_url": "https://www.instagram.com/reels/audio/184302697727078/", "hook": "", "transcript": "", "caption": "Nail Techs, you know that thing you do where you write a booking in your paper planner, then again in your phone calendar, then on a sticky note stuck to the desk?\n\nThat is not you being organized. That is what it looks like when losing one booking feels like it could end you. I know that feeling because I have lived close to it.\n\nWhen your income depends entirely on a full week, a single missed appointment stops being an error and starts feeling like proof the whole thing is fragile. So you triple write everything and you still check it four times a night.\n\nThe three-place system is a symptom. The real problem is that your calendar is not stable enough for your nervous system to trust it.\n\nWhen retention is low and half your bookings are one-time clients, of course every slot feels precious, because you do not know if it comes back.\n\nThe fix is not a better planner. The fix is client retention, so the same faces fill your week on repeat and you stop bracing for the empty slot.\n\nWhen your regulars book their next appointment in the chair before they leave, the sticky notes disappear on their own. You deserve a week you do not have to guard like it might run away. xx \ud83d\udc8e\n\nIf you write your bookings in three places because losing one feels terminal, comment \"RETENTION\" and I'll DM you the in-chair rebooking habit that steadied my calendar.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-13", "rank": 35}, {"handle": "dragana.jasprica", "title": "When Erin came to us, she\u2019d been working with a bodybuilding coach, stuck on a fat loss plan at 1800 calories for two YE", "views": 1145, "comments": 1, "likes": 14, "outlier": 0.03, "followers": 42593, "video_url": "https://www.instagram.com/p/DbqhPJihaW1/", "audio_url": "https://www.instagram.com/reels/audio/178714732818051/", "hook": "", "transcript": "", "caption": "When Erin came to us, she\u2019d been working with a bodybuilding coach, stuck on a fat loss plan at 1800 calories for two YEARS. \ud83e\udee0\n\u00a0\n5x lifting sessions and 5x cardio sessions a week. She was exhausted, and her body hadn\u2019t changed in months.\n\u00a0\nSo the first thing we did felt completely backwards to her.\n\u00a0\n\ud83d\udcc8 We increased her food intake strategically over months UP to 2700 calories.\n\u00a0\n\ud83d\udcc9 And we PULLED her training back to four lifts and one cardio session.\n\u00a0\nRead that again.\nShe ate more and trained less.\n\u00a0\nAnd yeah, the scale ticked up for a few weeks. She had to sit in that discomfort, eating more than she had in YEARS, watching the number go the \u201ewrong\u201c way, and trust us anyway.\n\u00a0\nThat\u2019s the hardest part, and she did it. \ud83d\udc4f\ud83c\udffc\n\u00a0\nThen things started to turn around.\n\u00a0\n\u2705 Her energy came back.\n\u00a0\n\u2705 Her digestion improved.\n\u00a0\n\u2705 The constant food noise in her head quieted down.\n\u00a0\n\u2705 And slowly, the guilt she felt about eating more started to fade, because she could see it was working.\n\u00a0\nWe\u2019d spent those months building her back up so she had something to work with.\n\u00a0\nAnd THEN, off that stronger, well-fueled base, we ran a real fat loss phase. The one that finally leaned out her legs, for the first time in her life.\n\u00a0\n18 months later, at 45, she stood in front of a camera for her first ever bikini shoot, with the most defined legs she\u2019s ever had.\n\u00a0\nHere\u2019s the lesson for you:\n\u00a0\nShe didn\u2019t fail for 2 years because she wasn\u2019t disciplined enough. She was doing MORE than almost anyone.\n\u00a0\nShe failed because more was never the answer. What she\u2019d never had was a clear strategy.\n\u00a0\nSomeone to look at her whole situation and map out the right things, in the right order, for HER body.\n\u00a0\nIf you\u2019re done doing MORE and getting nowhere, and you want someone to look at your whole situation and map out the right strategy for YOUR body\u2026\n\u00a0\n\ud83d\udcac DM me \u201cREADY\u201c and let\u2019s talk.", "trigger": ["Results & Testimonials"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-05", "rank": 36}, {"handle": "ameliesadvicee", "title": "If you\u2019re tired of this, comment \u201cWELLNESS\u201d and I\u2019ll send you my free video guide to learn more", "views": 1139, "comments": 33, "likes": 74, "outlier": 0.03, "followers": 43033, "video_url": "https://www.instagram.com/p/DbmCXAGvk__/", "audio_url": "https://www.instagram.com/reels/audio/27780516594917694/", "hook": "", "transcript": "If you keep having to rebuild your wellness, your skincare, your workout routine every couple months because you're just like bored or it's not working for you, you're probably doing it against your 6th house every time.\nWhen you build something according to your 6th house, this is something you can actually sustain.\nVersus when it works against it, you're gonna go for 3 weeks and then just completely collapse.\nEvery 6th house has a different sustainability threshold.\nFor example, if your 6th house is ruled by Pisces, you can't have strict, rigid health routines.\nYou guys are very emotional on a daily basis.\nYou absorb everything.\nEnergy protection is huge.\nDoing workouts like swimming.\nOthers need more intensity and variety.\nOthers need slow, consistent things with minimal change.\nThe thing that's usually missing isn't a stricter accountability system.\nIt's a structure that actually supports how your body and energy wants to run on a daily basis.\nYou can see in your 6th house the specific point where you start to break down and burn out.\nOnce you see it, you cannot unsee it.\nIt becomes so predictable.\nMost wellness is built around the average person or just generic advice.\nEasy fix is to just understand this and build a routine that matches your wiring.\nThe thing that you keep trying to force yourself to and you're fighting against is not the right thing for you.", "caption": "If you\u2019re tired of this, comment \u201cWELLNESS\u201d and I\u2019ll send you my free video guide to learn more \n\n#astrologypost #wellness #routines #burnout", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-03", "rank": 37}, {"handle": "susiebower_", "title": "Twenty five years of bodywork and eight surgeries of my own. I did not read about the body keeping the score. I lived it", "views": 997, "comments": 3, "likes": 10, "outlier": 3.43, "followers": 291, "video_url": "https://www.instagram.com/reel/Db-MCsLKP9b/?igsh=MXJheXhjY2pyaWVmcg==", "audio_url": "https://www.instagram.com/reels/audio/26606461265703434/", "hook": "", "transcript": "", "caption": "Twenty five years of bodywork and eight surgeries of my own. I did not read about the body keeping the score. I lived it. \n\nIf your pain keeps outsmarting every fix, you want someone who has been on both sides of it. Book a call in my bio. \n\n#chronicpain #backpain #somatichealing #nervoussystem", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-13", "rank": 38}, {"handle": "revivetherapyservices", "title": "So much of high functioning looks like pure competence from the outside and feels like low grade fear on the inside.", "views": 975, "comments": 0, "likes": 16, "outlier": 0.64, "followers": 1519, "video_url": "https://www.instagram.com/p/Db3wM89lCeo/", "audio_url": "https://www.instagram.com/reels/audio/38051952524395655/", "hook": "", "transcript": "", "caption": "So much of high functioning looks like pure competence from the outside and feels like low grade fear on the inside.\n\nPicture sending the email with your rate in it and not immediately over explaining or shaving the number down in the very next line, because you named it and let it sit there without flinching.\n\nPicture making a genuinely big decision, the job or the move or the ending, from a steady place in your body instead of from the old panic that says just pick whatever keeps everyone else comfortable.\n\nPicture a random Wednesday where you got almost nothing done and your sense of being worth something didn't move a single inch, because your worth stopped being contingent on your output.\n\nFor a lot of high functioning women, being useful was how you stayed safe and stayed loved, so your body learned to tie your value straight to your productivity, and that is a survival pattern that body based work can help recalibrate. You are a badass bitch whether or not you were productive today.\n\nYou can still care and still work hard, and your worth simply stops being the thing on the line every single time you rest.\n\nIf your value feels welded to your output, comment \"[WORTH]\" and I'll send you where to start, no pitch and no pressure!", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 39}, {"handle": "corinne.naturopath", "title": "If eating the \"right\" food for your body has turned into a test you feel like you keep failing, this is the year I'd lov", "views": 967, "comments": 0, "likes": 6, "outlier": 0.27, "followers": 3531, "video_url": "https://www.instagram.com/p/DbbFWr4FDBX/", "audio_url": "https://www.instagram.com/reels/audio/37610801291899252/", "hook": "", "transcript": "", "caption": "If eating the \"right\" food for your body has turned into a test you feel like you keep failing, this is the year I'd love for you to change what it means to you.\n\nFor so many of the women I work with, this has nothing to do with weight. The fear is about what the food might set off. The bloating, the histamine flare, the blood sugar crash, the symptom you can't quite predict.\n\nAnd the confusing part is it happens even with the clean food. You picked the good, healthy, whole thing, did everything right, and your body still reacted. So you start wondering if there's anything actually safe to eat.\n\nWhat turns it around is seeing those reactions for what they are. Your body is inflamed and depleted right now, so even good food can feel like too much for it to handle. Once you rebuild what it's missing, more vitamins and minerals, more protein, more of what it can actually use, it stops treating normal food like a threat.\n\nThe fear loosens on its own once your body starts feeling steady after you eat.\n\nIf you're ready to stop dreading your own plate, comment INFO and I'll show you where I'd start.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-30", "rank": 40}, {"handle": "jolihappynails", "title": "Nail Techs, someone once called me the Queen of Simple, and I understood what they meant, but here is how I actually see", "views": 948, "comments": 0, "likes": 30, "outlier": 0.33, "followers": 2872, "video_url": "https://www.instagram.com/p/Db7N2qohjKS/", "audio_url": "https://www.instagram.com/reels/audio/1263941094320818/", "hook": "", "transcript": "", "caption": "Nail Techs, someone once called me the Queen of Simple, and I understood what they meant, but here is how I actually see it. I am more of a sculptor than a painter.\n\nThe foundation being perfect is what makes the artsy parts on top look greater. The best techs are not the ones with the flashiest designs. They are the ones obsessed with structure, because they know decoration sits on top of a foundation and a bad foundation shows through everything.\n\nPainters fix problems on the surface. Sculptors prevent them underneath. This is an identity choice, not just a technique. When you decide you are a sculptor of the nail, you stop chasing trends for the feed and start building the underlying structure that makes a set last six weeks and a client stay six years. The art becomes the easy part once the sculpture is right.\n\nYou are allowed to be known for the structure nobody photographs. That is where the money and the loyalty actually live.\n\nLess is MORE was never about doing less, it was about the foundation being so right that nothing loud is needed. Decide which one you are. Then build like it. xx \ud83d\udc8e\n\n If you want to work like a sculptor of the nail instead of a painter, comment \"RETENTION\" and I'll DM you where structure-first actually starts.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 41}, {"handle": "dragana.jasprica", "title": "But first\u2026 here\u2018s what I would NOT do:", "views": 925, "comments": 0, "likes": 21, "outlier": 0.02, "followers": 42593, "video_url": "https://www.instagram.com/p/Dbz2kLjBPpM/", "audio_url": "https://www.instagram.com/reels/audio/1043158638087411/", "hook": "", "transcript": "", "caption": "But first\u2026 here\u2018s what I would NOT do:\nI would not cut.\n\nHere\u2019s what I\u2019d do first \u2935\ufe0f\n\nResist the urge to drop my calories.\nResist the urge to add more cardio.\nMatch my strategy to my body.\n\nYou\u2019ve been lifting for years. You\u2019ve been tracking. You\u2019ve been \u201ein a deficit\u201c on and off since 2019.\n\nBut the weekends are always a little loose. The work trip throws you off. The dinners out add up. And your body still doesn\u2019t reflect any of the work.\n\nYou think the answer is to cut harder. Be tighter on the weekends. Add another cardio session. Be more disciplined this time.\n\nYou\u2019re wrong.\n\nThe reason 5 years of cuts haven\u2019t gotten you lean isn\u2019t your discipline. \n\nIt\u2019s that you\u2019ve been running a strategy your body never fully committed to. Cuts that never quite worked. Weekends that pulled you back to maintenance. Years stuck in the gray zone between cutting and maintaining. What the industry sells you as \u201dbody recomp.\u201c\n\nThe problem isn\u2019t you. It\u2019s the strategy you\u2019ve been handed.\n\nSo the first thing I\u2019d do isn\u2019t another cut. It\u2019s a proper assessment of exactly where your body is, then designing the next 12 months from there.\n\nI\u2019d match your strength and cardio to the state your body is actually in, instead of stacking random sessions on top of each other. I\u2019d prime your metabolism first and map out a personalized roadmap for where you want to be in 12 months.\n\nThen, and only then, a real fat loss phase. The right deficit. The right fuel. The right length of time. Macros adjusted to where your body is actually responding, week by week. \ud83c\udfaf\n\nWhen you stop cutting for the trip in 4 weeks and start running real phases with a long-term strategy, THAT\u2019S when you build a physique that drops jaws a year from now, babe. \u2764\ufe0f\u200d\ud83d\udd25", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-09", "rank": 42}, {"handle": "themckensiem", "title": "I  wasn\u2019t dating only for myself.", "views": 891, "comments": 2, "likes": 9, "outlier": 5.94, "followers": 150, "video_url": "https://www.instagram.com/p/Db89JEkOEQS/", "audio_url": "https://www.instagram.com/reels/audio/176929003152333/", "hook": "", "transcript": "", "caption": "I  wasn\u2019t dating only for myself.\n\nI had children watching, a home to protect, and a family culture already being formed. That meant chemistry, attention, and how loved a man made me feel could never be the evaluation on their own.\n\nI paid attention to his character. His faith, and what it had cost him. His stability. The way he handled responsibility. The kind of influence he would bring into my daughters\u2019 lives.\n\nAnd I moved with more rigor because of them, because every standard I dropped would have become a lesson they learned by watching.\n\nMarriage is already a serious decision. When children are involved, it deserves more discernment, and you\u2019re allowed to take that seriously without anyone calling you picky.\n\nMy daughters watched me require evidence. They watched me walk away from men who didn\u2019t provide it. And then they watched the right man drive 3 hours every weekend, and treat their mother with a care I\u2019d stopped believing existed.\n\nThat\u2019s the curriculum. Not a lecture about standards. A mother they watched live them.\n\n#ChristianDating #ChristianSingleWomen #BiblicalDating #DatingDiscernment #ChristianMarriage", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 43}, {"handle": "revivetherapyservices", "title": "There's a specific kind of tired that comes from waking up already braced for something you can't even name.", "views": 879, "comments": 0, "likes": 31, "outlier": 0.58, "followers": 1519, "video_url": "https://www.instagram.com/p/Db9Bj5-lW9a/", "audio_url": "https://www.instagram.com/reels/audio/27911730448466252/", "hook": "", "transcript": "", "caption": "There's a specific kind of tired that comes from waking up already braced for something you can't even name.\n\nPicture a Tuesday where you open your eyes and the first thing you feel is just the morning, so you make your coffee with your shoulders down where they actually belong and you take a breath that goes all the way in.\n\nPicture standing in your own kitchen late at night and feeling like the house is yours and you are safe inside it, not scanning the hallway, not listening for something that isn't there.\n\nThat dread was never a character flaw or a sign that something is wrong with you, because it's your nervous system still running an old alarm from a time when staying alert is what kept you safe, and this is body based work that helps those alarms get recalibrated so your body can finally register that you're safe now and it's over.\n\nYou don't have to earn this by white knuckling harder, and it won't happen overnight, but a body that has been dysregulated for years really can learn to settle.\n\nIf you want the name for what's actually happening in your body when that dread hits, comment \"[SAFE]\" and I'll send you where to start, no pressure and no pitch!", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-12", "rank": 44}, {"handle": "revivetherapyservices", "title": "You are not too much and you are not broken, your nervous system just learned a long time ago that closeness was risky!", "views": 879, "comments": 4, "likes": 31, "outlier": 0.58, "followers": 1519, "video_url": "https://www.instagram.com/p/Db1P_2VG9_T/", "audio_url": "https://www.instagram.com/reels/audio/27788340897525680/", "hook": "", "transcript": "If you push people away and then the minute they go, you start panicking, hang out with me for just a second.\nThis is actually a really common thing with people.\nYou crave closeness more than anything and then the minute someone gets too close, your body kind of just goes, Mayday, I don't wanna be close to anyone and it pushes them away.\nThen here's the good old switcheroo.\nThey start pulling away a little bit.\nMaybe it's they don't respond to your texts as quickly as they did before and then hits the anxiety.\nYou send them five texts, boom, boom, boom, boom, boom, seeking and yearning for that connection and attention from them.\nAnd after you send those five texts, you definitely are hating yourself.\nFor some reason, you keep choosing these emotionally unavailable people while the steady, kind person who actually likes you makes your skin crawl.\nBy the way, none of this means you're needy or broken or bad at love.\nWhat most likely is happening is your nervous system learned really early on that connection was unpredictable.\nSo it treats closeness with someone as a thing it so desperately wants and so desperately hates at the same time.\nThe thing is your body is running this script where getting hurt and getting close to someone live in the same area.\nSo it's like reaching out and flinching at the same time.\nSo that pattern that you're judging yourself for, it's there for a reason.\nAnd the nice thing is it can be recalibrated.\nIt doesn't have to be like that for forever.", "caption": "You are not too much and you are not broken, your nervous system just learned a long time ago that closeness was risky! If you spiral into the anxious texts the second someone pulls back, comment \"[CLOSE]\" and I'll send you the free worksheet I wish I'd had. No pressure!", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-09", "rank": 45}, {"handle": "jolihappynails", "title": "If you have caught yourself sealing a lift under top coat to save time, comment \"BUILDER\" and I'll DM you the free call", "views": 871, "comments": 0, "likes": 38, "outlier": 0.3, "followers": 2872, "video_url": "https://www.instagram.com/p/Db4qQ3eBdeS/", "audio_url": "https://www.instagram.com/reels/audio/27972887355696276/", "hook": "", "transcript": "So, this is for the nail text, specifically for those that can relate to this scenario.\nSo, there is a thumb in one of your last three sets with a lifted edge that you painted top coat right over, and that thumb is the reason she's not texting you back.\nSo, I want to talk about the little moment nobody films.\nYou finish a set, you spot a tiny lift on the thumb, and instead of starting that finger over, you glide top coat across it and tell her it's done.\nI've done it too early on when I was tired and the next client was already sitting in the chair.\nHere is actually what happens after she leaves.\nThat seal lift becomes a pocket, moisture gets under it, and somewhere around day five, it catches on a sweater, and she feels it.\nShe does not call you to complain.\nShe just quietly books with someone else and tells herself your work is a little too delicate for her life.\nThe mistake is not the lift.\nThe mistake is deciding that a hidden problem is the same thing as a solved problem.\nOn a natural nail, a lift you cannot see is still a lift the client will find because she lives inside those hands all day and you only see them for two hours.\nSo, when I train the removal and prep sequence, the whole point is that you start every set so clean there is nothing to hide.\nIf you remove 95 to 99% of the old product and you prep the edge properly, that lift does not appear on day five because you did not seal a weak spot in on day one.\nSo, the next time you are tempted to top coat over a thumb, stop and redo the finger.\nIt costs you four minutes now.\nSealing it costs you the client, and she was the one who was going to send you her friend.", "caption": "If you have caught yourself sealing a lift under top coat to save time, comment \"BUILDER\" and I'll DM you the free call so you can do the removal and prep sequence I start every set with.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-11", "rank": 46}, {"handle": "revivetherapyservices", "title": "Research shows most people no longer meet PTSD criteria after a standard course of EMDR, so comment \"SESSION\" and I'll s", "views": 841, "comments": 6, "likes": 22, "outlier": 0.55, "followers": 1522, "video_url": "https://www.instagram.com/p/DbtolosDOFF/", "audio_url": "https://www.instagram.com/reels/audio/27566919012988455/", "hook": "", "transcript": "", "caption": "Research shows most people no longer meet PTSD criteria after a standard course of EMDR, so comment \"SESSION\" and I'll show you what that course involves.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 47}, {"handle": "dragana.jasprica", "title": "Low carb is one of the sneakiest traps for women who lift, because at first it looks like it\u2019s working. \ud83d\ude2c", "views": 834, "comments": 8, "likes": 11, "outlier": 0.02, "followers": 42593, "video_url": "https://www.instagram.com/p/Db5AMcahXFW/", "audio_url": "https://www.instagram.com/reels/audio/846563127666323/", "hook": "", "transcript": "", "caption": "Low carb is one of the sneakiest traps for women who lift, because at first it looks like it\u2019s working. \ud83d\ude2c\n\n(btw if you want my exact macro + meal timing structure that I use with all my clients so they finally look like they lift, comment \u201cMACROS\u201c \ud83c\udf5d) \n\nYou cut the carbs, the scale drops a little, and you think you\u2019ve found the thing that finally works.\n\nSo you keep going. Less bread, less rice, less fruit. \u201eEarning\u201c the few carbs you let yourself have.\n\nAnd it makes sense, because it\u2019s the message everywhere. \n\n\u261d\ud83c\udffc\u00a0Carbs spike your insulin. \n\u261d\ud83c\udffc\u00a0Carbs are keeping you soft. \n\u261d\ud83c\udffc\u00a0Cut them and you\u2019ll finally lean out.\n\nBut going lower and lower doesn\u2019t lean you out. It does the opposite.\n\nBecause you\u2019re not a couch potato. You lift, you do your cardio, and your body needs to be fueled for that. Strip the carbs while you\u2019re training hard and your body gets stressed, and a stressed body gets inflamed and looks softer\u2026 not leaner. \ud83e\udee0\n\nSo now you\u2019re hunting for a snack all afternoon, never quite satisfied. Foggy and slow, reaching for another coffee. Soft no matter how clean you eat. Your sessions leaving you drained instead of stronger. And feral for something sweet by 9pm. \ud83c\udf6b\n\nYet here you are convinced you just have a sweet tooth.\n\nWhat no one tells you: it\u2019s not your age, your hormones, your metabolism or the self-declared sugar addiction. \n\nThat\u2019s three so-called stress hormones, cortisol, adrenaline and glucagon, climbing because you took away the fuel your body actually runs on.\n\nI lived this one myself. \n\nWhen I went low carb, I didn\u2019t get leaner, I got softer and the scale climbed. I have almost no photos from that time. The day I strategically brought carbs back up again, my body finally started changing.\n\n\u2705\u00a0A short, strategic lower carb phase for a real reason is one thing. \n\n\u274c\u00a0Living low carb as your everyday way of eating, while you lift and do cardio, will backfire every time.\n\nCarbs aren\u2019t what\u2019s keeping you soft. Not knowing how to fuel your body with", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-11", "rank": 48}, {"handle": "corinne.naturopath", "title": "When I was climbing out of my worst years, I stopped chasing the fancy stuff and got clear on the few things my body act", "views": 826, "comments": 2, "likes": 7, "outlier": 0.23, "followers": 3531, "video_url": "https://www.instagram.com/p/DbdqrE6lbEV/", "audio_url": "https://www.instagram.com/reels/audio/28039286415666621/", "hook": "", "transcript": "", "caption": "When I was climbing out of my worst years, I stopped chasing the fancy stuff and got clear on the few things my body actually needs to do its job.\n\nWhat I figured out is that my body doesn't care much about calories. It cares about absorbing enough nutrients. So everything I do now comes back to that.\n\nThe first piece is food. I eat the things my body recognizes as nourishing, and I pull back on the ones it treats as a threat and mounts an inflammatory response to. That alone changed how much I actually got out of every meal.\n\nThe second is a multivitamin and a multimineral. I used to think that was overkill, until I looked at the numbers. An orange today has about eight times less vitamin C than one did sixty years ago. There's no eating your way out of that. Nobody can eat eight times the food just to hit the basic vitamins and minerals a body needs. That gap is really malnutrition, and over time it's what turns into chronic illness.\n\nThe third is moving through cycles of feasting and fasting to stay fat adapted. That's what keeps my body metabolically flexible, so it can cleanse, detox, and manage its own blood sugar without me forcing it.\n\nThese are my non negotiables. They're the foundation my own body runs on, and I only landed on them after trying a hundred other things first.\n\nIf you feel like you've already done the real breakfast, the protein before coffee, the salt in your water, and you're still not seeing traction, comment INFO and I'll send you the short list I actually live by.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-31", "rank": 49}, {"handle": "jolihappynails", "title": "If the e-file still makes you tense up, comment \"BUILDER\" and I'll DM you the pressure drill that took the fear out of i", "views": 826, "comments": 2, "likes": 59, "outlier": 0.29, "followers": 2872, "video_url": "https://www.instagram.com/p/Db9SxqPJ9cg/", "audio_url": "https://www.instagram.com/reels/audio/28218522064451478/", "hook": "", "transcript": "This is for the nail tech.\nSpecifically, if you get a little tense every time you pick up the e-file, that fear is really about pressure.\nNobody ever taught you to control and the tool is just taking the blame.\nSo many of you are quietly scared of the e-file and you should hear that the fear makes sense.\nYou were probably told at some point that the drill thins the nails, that it is a dangerous tool.\nSo now every time you bring it to the nail, your hand tightens up and you rush.\nHere is the part that reframes everything.\nThe e-file does not ruin the nails.\nPressure thins the nails.\nThe tool is neutral.\nIt is like saying a knife only does damage when the difference sits entirely with how you use it.\nSo the reason you're scared is that you were a powerful tool and never taught one variable that keeps it safe.\nWatch what your fear actually makes you do.\nYou either avoid the drill and spend an extra 20 minutes hand filing or use it stiff and heavy because the tense hand presses harder without realizing it.\nSo both come from the same gap.\nNobody sat next to you and showed you what correct light pressure feels like.\nWhen I teach the e-file, we do not start with speed or bits.\nWe start with pressure.\nBecause once your hand knows the right amount, the tool becomes the gentlest, fastest thing in your kit instead of the scariest.\nThe drill stops being a risk and becomes the reason your removals are clean and quick.\nSo the next time your shoulder creeps up as you reach for the drill, notice it and remember the fear is pointing at a missing skill, not a dangerous machine.\nLearn the pressure and the fear just leaves because there's nothing left to be afraid of.", "caption": "If the e-file still makes you tense up, comment \"BUILDER\" and I'll DM you the pressure drill that took the fear out of it for me.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-12", "rank": 50}, {"handle": "guy_finocchiaro", "title": "Picture the IRS leaving you alone. No more letters, no threat of a levy, the case marked resolved.", "views": 822, "comments": 0, "likes": 13, "outlier": 0.75, "followers": 1103, "video_url": "https://www.instagram.com/p/DbrOtcmSJTS/", "audio_url": "https://www.instagram.com/reels/audio/26261188156890234/", "hook": "", "transcript": "", "caption": "Picture the IRS leaving you alone. No more letters, no threat of a levy, the case marked resolved.\n\nThis is the path I\u2019d take.\n\nFirst, pull my transcripts so I know the real balance and every deadline attached to it.\n\nSecond, get every unfiled return in, because the IRS won\u2019t close anything while years are missing.\n\nThird, put power of attorney in place so the agency deals with my representative and I stop being the one on hold explaining my life.\n\nFourth, lock in the right resolution for my numbers and stay compliant so nothing reopens.\n\nThat last step is the one people skip. Getting resolved and staying resolved take different work, and the clients who never come back keep filing and paying on time afterward.\n\nDone together, these are what put a case to bed.\n\nIf that\u2019s the outcome you want, comment PLAN and I\u2019ll send it over.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-05", "rank": 51}, {"handle": "allandib", "title": "You used to be in by six because the day didn't start until you arrived. Now you stroll in at nine, and the three things", "views": 811, "comments": 1, "likes": 13, "outlier": 0.13, "followers": 6053, "video_url": "https://www.instagram.com/p/Dbt863VDSi-/", "audio_url": "https://www.instagram.com/reels/audio/28225068270420907/", "hook": "", "transcript": "", "caption": "You used to be in by six because the day didn't start until you arrived. Now you stroll in at nine, and the three things that would have been sitting on your desk are already handled.\n\nSomebody made the call you would have made. The proposal went out without your eyes on it. The client who only ever asked for you got a great answer from someone who wasn't you and didn't even think to consult you.\n\nThis is what owning the system really looks like. It buys you the same hours you always had, except now your hands are off the controls and the business still moves. The strategy that used to live in your head now lives on a page your team follows.\n\nThe first morning it happens, you feel a strange mix of pride and uselessness. The uselessness is the point. When the business needs you less, you've stopped having a job and started owning one.\n\nIf you want to build toward mornings that look like this, comment LEAN and I'll show you the one page it starts with.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 52}, {"handle": "revivetherapyservices", "title": "You wake up at 3am with a wave of dread and no reason for it, and you lie there in the dark scanning for a threat your b", "views": 798, "comments": 3, "likes": 23, "outlier": 0.53, "followers": 1519, "video_url": "https://www.instagram.com/p/Db3g9SNPfgM/", "audio_url": "https://www.instagram.com/reels/audio/655076383764260/", "hook": "", "transcript": "", "caption": "You wake up at 3am with a wave of dread and no reason for it, and you lie there in the dark scanning for a threat your body swears is standing in the room.\n\nThen it shows up in the middle of a normal Tuesday meeting, where your chest goes tight and your stomach clenches while somebody talks about a spreadsheet, and nothing is actually wrong.\n\nYour heart races at random moments and you have quietly stopped trying to explain it to anyone, because there is no story that makes it make sense.\n\nYour nervous system is doing its job a little too well, because somewhere along the way it learned that staying on guard kept you safe, and it never got the memo that the danger is over.\n\nThe dread at 3am is an old alarm that got stored in your body and never recalibrated, so it keeps going off long after the thing that set it off is gone.\n\nYour body has been working overtime to protect you like a smoke alarm that will not reset on its own, and that alarm can absolutely be turned down.\n\nIf you wake up at 3am scanning for a threat that isn\u2019t there, comment \u201c[CALM]\u201d and I\u2019ll send you the free nervous system worksheet I wish I

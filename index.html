ill cuts hard for one short, focused window when the data says go, but then LEAVES it and goes back to building.\n\u00a0\nBecause you were BUILT FOR MORE than making yourself smaller.\n\u00a0\nIt means your training and your nutrition finally come from ONE place, pointed at ONE goal. Instead of a trainer pulling you one way and some app pulling you the other, with the two never adding up to anything.\n\u00a0\n\ud83d\ude45\ud83c\udffc\u200d\u2640\ufe0f The women I coach stop introducing themselves as someone \u201etrying to lose a few kilos.\u201c \n\u00a0\n\ud83d\udc81\ud83c\udffc\u200d\u2640\ufe0f They start training like the athlete they\u2019ve been all along, and their body finally starts to show it.\n\u00a0\n2026 is the year you stop shrinking and start taking up space. \ud83d\udcaa\ud83c\udffc\n\u00a0\nIf you\u2019re ready to stop shrinking and finally build...\n\u00a0\n\u2705 Comment LOOK\nand I\u2019ll send you my free masterclass on how we do it.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-05", "rank": 61}, {"handle": "revivetherapyservices", "title": "You're allowed to close the self help tab and go live your actual life. If healing has quietly become your entire person", "views": 622, "comments": 2, "likes": 30, "outlier": 0.41, "followers": 1519, "video_url": "https://www.instagram.com/p/Db1CYMZAgmJ/", "audio_url": "https://www.instagram.com/reels/audio/27921118967498357/", "hook": "", "transcript": "If healing has become another full-time job for you, you're doing healing wrong.\nThis happens to a lot of us, myself included, where healing becomes a full-time job, where you're constantly reading the new self-help books, your entire algorithm is self-help healing videos, and you're constantly monitoring yourself to make sure that you're healing.\nAnd so the focus of healing actually just takes up the same amount of space as your trauma does or did.\nI want you to picture this idea of healing as actually just living, when yes, you show up and do the work, but then you put it to the side and then you go out to dinner and have a great time with your friends.\nImagine just being present on a Sunday afternoon, you're sitting outside, the sun's on your skin, you have your favorite cup of coffee, and you're actually present.\nThere's no background noise about what you should be doing differently or how at the end of the day you're not doing enough or you aren't enough.\nThat kind of presence is the whole freaking point, guys.\nJust take a second and think about how much your past has been running your future and very much so your present.\nIt dictates how you read into someone's tone of voice or to brace when someone says they need to have a conversation with you.\nJust imagine all of that taking a back seat.\nIt might still be there, but it's no longer in the driver's seat.\nAnd that is the point of this work is body-based work.\nThe goal was never to get rid of every traumatic memory and arrive at some final version of yourself where you're perfect and you never struggle ever again because that's not realistic.\nImagine your body finally feeling safe right now, not 10 years from now, not one year from now.\nMy point is healing is a part of life.\nIt should not be your whole life.\nWhat if there was no finish line that you needed to figure out how to cross?\nWhat if you're kind of already there?\nWhat if you can be present now?\nThere's nothing you have to wait to do or wait fo", "caption": "You're allowed to close the self help tab and go live your actual life. If healing has quietly become your entire personality, comment \"[LIVING]\" and I'll send you where to start!", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-09", "rank": 62}, {"handle": "altaredstatesofconsciousness", "title": "you know that feeling when you type why do i feel so numb and disconnected into the search bar at midnight and then dele", "views": 612, "comments": 0, "likes": 8, "outlier": 0.01, "followers": 44885, "video_url": "https://www.instagram.com/p/Db9WpFIvcq-/", "audio_url": "https://www.instagram.com/reels/audio/722782234774353/", "hook": "", "transcript": "", "caption": "you know that feeling when you type why do i feel so numb and disconnected into the search bar at midnight and then delete it before anyone could ever see? babe. that search was you reaching for yourself. clearing it was the old survival talking. you don't have to keep pretending you're fine \ud83d\udda4 comment shadow and i'll send you my free Villain Archetype quiz", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-12", "rank": 63}, {"handle": "kdmueller", "title": "Choose.", "views": 612, "comments": 0, "likes": 14, "outlier": 0.51, "followers": 1193, "video_url": "https://www.instagram.com/reel/Db9dEawBX3-/", "audio_url": "https://www.instagram.com/reels/audio/816335062086505/", "hook": "", "transcript": "", "caption": "Choose.\nFive avatars, four offers, seven half-built versions, all open, all safe. You call it staying flexible. It\u2019s not.\nIt\u2019s a very smart woman avoiding the moment she commits and finds out if she can win with one thing.\nOptions feel like progress. They\u2019re a hiding spot with a spreadsheet.\nPick one avatar, one offer, and go all in for ninety days.\nNot forever. Ninety days.\n\nComment ALIGNED if you\u2019re ready to stop circling the decision and actually choose.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-13", "rank": 64}, {"handle": "corinne.naturopath", "title": "If eating more feels impossible because your gut reacts to everything, comment INFO and I'll DM you how to start without", "views": 572, "comments": 2, "likes": 12, "outlier": 0.16, "followers": 3531, "video_url": "https://www.instagram.com/p/DbylArtk83U/", "audio_url": "https://www.instagram.com/reels/audio/27970938022546204/", "hook": "", "transcript": "if the idea of eating more makes you nervous.\nBecause your gut already can't handle what you're eating now.\nYou gotta hear this.\nWhen I tell women their body needs more food, more vitamins and minerals in order to heal, a lot of them go quiet.\nBecause the honest truth is that they can't imagine it.\nYou have spent years eliminating foods.\nTo stop the bloating.\nTo end the reactions.\nAnd eating more sounds like signing up for a worse version of the same misery.\nYour gut lining is not permanent.\nIt is a surface that rebuilds itself every 3-5 days.\nWhen it has what it needs.\nThe reason more food feels impossible right now is that the lining is worn thin and undersupplied.\nSo it reacts to almost everything you send it.\nThat is a repair problem with a timeline, not a life sentence.\nThis is why the answer is never to force a huge plate on day one.\nYou start with the inputs your gut can absorb, without flaring first.\nYou support the lining directly, and you widen the plate as the surface heals underneath you.\nThe order protects you instead of pushing you.\nMost women who thought they would react to food forever are eating real meals, within about 3 weeks of starting, with a wide variety.\nNot because they toughed it out, but because the surface doing the reacting finally got the materials to calm down.\nYou are allowed to eat the foods that you want, and you are allowed to get there on a ramp instead of a cliff.\nYour gut can handle more than it can today, once you rebuild the thing that's been doing all the reacting in your body.", "caption": "If eating more feels impossible because your gut reacts to everything, comment INFO and I'll DM you how to start without the flare.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-08", "rank": 65}, {"handle": "erseaberg", "title": "Good operations means the business survives you leaving the room. Comment SOUNDBOARD and let\u2019s build yours to run withou", "views": 566, "comments": 0, "likes": 43, "outlier": 0.75, "followers": 756, "video_url": "https://www.instagram.com/p/Db6m1GoAXPF/", "audio_url": "https://www.instagram.com/reels/audio/28108626908822529/", "hook": "", "transcript": "The most important thing I ever did as COO was document my own job so well that my replacement could run it without me.\nWhen I was promoted to COO of a wedding company, I did something that sounds literally so backwards.\nInstead of making myself indispensable, I spent my time making myself unnecessary because I knew that that was the actual job.\nSo I wrote down how everything ran, built the training protocols, and then hired and trained my own replacement for lead planner, handing them a business that made sense on paper instead of only in my head.\nMost people cling to being the only one who knows how things work because it feels like job security, but it's actually the opposite.\nIf the business can't run without you, you don't own a business, you own a very demanding position that you can't quit.\nI've done the same thing across four different organizations at this point, and every time the measure of good operations was exactly the same.\nCould someone else step in and keep it running without a panic?\nAnd if yes, then the foundation was real.\nThe goal for your business is exactly the same.\nBuild it so it doesn't need you in the room because that is the only version of ownership that actually gives you your life back.", "caption": "Good operations means the business survives you leaving the room. Comment SOUNDBOARD and let\u2019s build yours to run without you.", "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-11", "rank": 66}, {"handle": "amelie ough you and into the toilet.\nYou can eat the homegrown salad and the wild-caught salmon and still be short in the minerals your body is crying out for.\nWhen I help someone absorb again, the food they were already eating starts to be usable and actually count towards something.\nClean food is a fine start, and being able to absorb it is what changes how you feel.", "caption": "If your fatigue makes no sense next to how well you eat, comment INFO and I'll show you where to look first.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-30", "rank": 70}, {"handle": "dragana.jasprica", "title": "You\u2019re up training before anyone else is even awake, getting it done before the meetings start.", "views": 479, "comments": 0, "likes": 15, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/Db2bVJHhjGp/", "audio_url": "https://www.instagram.com/reels/audio/245104583078094/", "hook": "", "transcript": "", "caption": "You\u2019re up training before anyone else is even awake, getting it done before the meetings start.\n\nYou treat your body like one more project you should be able to optimise. And it\u2019s the ONE project that won\u2019t respond, no matter how hard you push. \ud83e\udee0\n\nI coach women exactly like you.\n\nExecs, business owners, and coaches who give brilliant advice to everyone else all day, while their own body sits exactly where it\u2019s been for years.\n\nAnd here\u2019s what you actually want.\n\nYou make a hundred decisions a day already. The last thing you want is to also be figuring out your macros, your phases, whether you should be cutting or building.\n\nSo we take all of that off your plate.\n\nWe map the whole strategy, we tell you exactly what to do, and you just execute. No more of it living in your head.\n\nThis isn\u2019t wellness fluff. It\u2019s a real strategy that gets you results in your physique, your performance rs, not weeks. not because she's slow, not because she's not brilliant, but all she ever had was my free content and a few conversations. and yes, i give a lot of shit away for free. well, i throw some money at me and i will change your life. ultimately, she had to come to and figure out the showing up thing on her own timeline. i wasn't gonna force her, but what took her years, i do my best to compress into like 90 days, would never promise these results. but if you never fucking start, this can never happen. you're not even in the game. so if now's the fucking time and you are done waiting years to feel ready, and want someone to challenge and push you, apply to work with me. the application's in my bio.", "caption": "someone worse than you is getting picked right now\n\n#visibility #content #posting #personalbranding", "trigger": ["Results & Testimonials"], "format": "Short Form Video", "style": "Green Screen", "division": "green_screen", "posted": "2026-07-20", "rank": 72}, {"handle": "dragana.jasprica", "title": "Most of the women who apply to work with us have been training longer and harder than anyone they know.", "views": 452, "comments": 0, "likes": 12, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/Db5AKOkhA8n/", "audio_url": "https://www.instagram.com/reels/audio/2603183200076984/", "hook": "", "transcript": "", "caption": "Most of the women who apply to work with us have been training longer and harder than anyone they know.\n\nYet every summer they\u2019re still reaching for the cover-up, because another year of work went by and they look... the same. \ud83e\udee0\n\nWhen we dig into what they\u2019ve been doing, the same thing shows up almost EVERY. SINGLE. TIME.\n\nA mild deficit, high protein, and the hope that fat loss and muscle growth will both magically happen if she just waits long enough.\n\nBut all that waiting costs you, because fat loss moves at least 4x faster than muscle gain.\n\nSo you stay in what I call the level of suck. You never really lean out, and you never really build anything either. And you can stay there for DECADES, still soft, still no definition.\n\nBecause your training came from one place and your macros from another. A trainer, an app, a calculator. They were never set up together.\n\nWe coach it differently. Your training and nutrition match and pull in the same direction the whole time. One phase at a time. That\u2019s 4 nutrition levers and 4 training levers dialled in together for what YOUR body needs. \ud83c\udfaf\n\nThen we run you through the phases in the right order.\n\n1\ufe0f\u20e3 Discovery, so we know your real starting point instead of guessing.\n\n2\ufe0f\u20e3 Fat loss, with an end date.\n\n3\ufe0f\u20e3 Stabilization, so it sticks.\n\n4\ufe0f\u20e3 Then real months of building the muscle and capacity that give you an athlete\u2019s shape (and no, 4-5 months is not enough, babe).\n\n5\ufe0f\u20e3 Integration, where you keep it without living in a tracking app.\n\nHow long each phase runs is based on your body composition, your performance in the gym, and how you\u2019re actually recovering. \n\nNot a vibe check at the end of the month. \ud83d\ude0f\n\n500+ women over 6 years, and the pattern repeats every time. \n\nUntil we fix it.\n\nIf you\u2019re tired of living in the level of suck \ud83d\udc47\ud83c\udffc\n\nDM me the word \u201dAUDIT\u201c and I\u2019ll get back to you to see if you qualify for our free audit that reveals the missing piece to get your dream body.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-10", "rank": 73}, {"handle": "corinne.naturopath", "title": "If your whole identity has quietly organized around being sick, comment INFO and I'll DM you where the shift starts.", "views": 443, "comments": 0, "likes": 10, "outlier": 0.13, "followers": 3531, "video_url": "https://www.instagram.com/p/DbwAEkcE9UZ/", "audio_url": "https://www.instagram.com/reels/audio/28420675384205228/", "hook": "", "transcript": "The women who actually heal make one quiet identity shift that the women who manage forever never end up making.\nThere is a version of yourself that you may have been living for so long that you forgot it was a role, one whose whole identity organizes around being sick.\nEvery plan gets built around the illness, every decision runs through it, and slowly the person underneath it gets quieter.\nI understand how you got there, because managing a chronic illness for years demands that it take up that much room.\nThe trouble is that when your identity becomes the patient that copes, healing can start to feel like a threat to who you are and some part of you, protects the sick role without ever meaning to.\nThe women who get their lives back tend to make a quiet shift at some point, from someone managing an illness to someone actively healing from one.\nIt is a change in what they expect their own body to be capable of, not a loud declaration or a mindset slogan.\nThat shift is letting yourself believe that the version of you on the other side of this, the one who talks about all of this in the past tense, the real place you're allowed to be headed, not pretending you're fine and not warrior language about fighting your body.\nYou're allowed to stop being the woman who copes beautifully and start being the woman who is healed.\nThat identity is a direction, not an arrogance, and giving yourself permission to face it is often where the real change starts.", "caption": "If your whole identity has quietly organized around being sick, comment INFO and I'll DM you where the shift starts.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-07", "rank": 74}, {"handle": "stephmoonco", "title": "People kept saying that author got lucky with her TV spot, like it fell out of the sky.", "views": 403, "comments": 1, "likes": 5, "outlier": 0.24, "followers": 1648, "video_url": "https://www.instagram.com/p/DbnAP5rPfIg/", "audio_url": "https://www.instagram.com/reels/audio/26261188156890234/", "hook": "", "transcript": "", "caption": "People kept saying that author got lucky with her TV spot, like it fell out of the sky.\n\nMeanwhile she\u2019d been posting for a years to a few hundred readers who barely responded at first. She kept creating content and slowly got noticed. At first it was from readers and then slowly the media and brands started to notice. \n\nBehind the scenes, this author is creating, iterating and pitching herself. Sometimes the pitches get ignored and sometimes she gets the placement. The process of getting used to pitching yourself takes practice. It does take time for every email that gets ignored to not sting so much. It takes time to know what to pitch and how to do it in a way so that people respond. All of this happens and people can\u2019t see it or how much time you\u2019ve spent doing this. \n\nPeople call it luck because they didn\u2019t see the work behind it. From the outside it looked sudden, up close it was 12+ months of showing up before anyone paid attention.\n\nIf you\u2019re waiting around to get discovered, build the thing that makes you worth finding.\n\nComment \u201cAUDIT\u201d if you want an author platform audit", "trigger": ["Results & Testimonials"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-04", "rank": 75}, {"handle": "dragana.jasprica", "title": "Let me be honest about who I actually work with.", "views": 390, "comments": 0, "likes": 16, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/Dbvqv3EhSA-/", "audio_url": "https://www.instagram.com/reels/audio/1550123486358424/", "hook": "", "transcript": "", "caption": "Let me be honest about who I actually work with.\n\nIf your only goal is to be smaller, to shrink yourself down as much as possible and stay there, I\u2019m probably not your coach. \ud83e\udd37\ud83c\udffc\u200d\u2640\ufe0f\n\nBut if you\u2019re ready to actually BUILD?\n\nTo eat enough, get genuinely strong, take up space, and finally create the physique you\u2019ve been training years for?  Keep reading, because this is for you.\n\nHere\u2019s what almost no woman ever does... committing to seriously building muscle. \n\nNearly everyone only ever focuses on ONE thing. Fat loss. Losing, shrinking, getting smaller, year after year.\n\nAnd then wonders why she still doesn\u2019t look like she lifts. \ud83e\udd2d\n\nThe women who DO look like they lift got there a different way. They committed to building. And that\u2019s where everything levels up at once.\n\nYour strength goes UP, with real numbers to prove it.\n\nYou build the muscle that actually creates the shape you\u2019ve been chasing this whole time.\n\nAnd it\u2019s not just your physique. Your metabolic health improves, your energy, your recovery, your digestion, your hormones, your performance. ALL OF IT.\n\nI did it myself. Two proper building phases each 15x months long and multiple maintenance phases over the last 6 years got me the body I\u2019d trained years for.\n\nAnd honestly, I\u2019ve never been stronger or healthier.\n\nYou were never meant to shrink forever, babe.\nYou were BUILT FOR MORE. \ud83d\udcaa\ud83c\udffc", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 76}, {"handle": "dragana.jasprica", "title": "From 15 to 30 I bought the same black stretchy jeans on repeat, because I knew black swallowed my legs.", "views": 385, "comments": 2, "likes": 15, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/DbSYbQ3jo49/", "audio_url": "https://www.instagram.com/reels/audio/27897759059914050/", "hook": "", "transcript": "", "caption": "From 15 to 30 I bought the same black stretchy jeans on repeat, because I knew black swallowed my legs.\n\nNo shorts. No skirts. And I ducked out of every lake day so nobody would see me in a bikini. \ud83e\udee0\n\nAnd the nights were their own thing. \ud83e\udee3\n\nA bar of 90% chocolate, then a jar of almond butter with an apple, then walking to the shop for milk chocolate and inhaling it on the way home.\n\nFour things changed it.\n\n\ud83d\udcaa\ud83c\udffc My carbs went UP. I'd gone low carb and gotten SOFTER, not leaner, and the scale climbed. Bringing them back is when my body finally started responding. I ended up eating over 2700 calories with 450g of carbs in a build, as a petite woman.\n\n\ud83d\udcaa\ud83c\udffc My training actually got structured. I THOUGHT I'd been progressive overloading for years. I hadn't. The numbers moved for the first time once it was built properly.\n\n\ud83d\udcaa\ud83c\udffc My training and my nutrition finally matched. Instead of a program from here and macros from there pulling against each other, I had ONE coach who dialing in my nutrition and training to match my bodies needs.\n\n\ud83d\udcaa\ud83c\udffc And I stopped dieting all year round. One goal at a time. Go all in on a fat loss phase, then LEAVE it and go build.\n\nThese days I deadlift over 110kg, I do 10+ strict pull-ups, and I'm training through a healthy pregnancy. My period came back. My IBS is gone. And the night binges? Gone too, because my body is actually fed. \u2764\ufe0f\u200d\ud83d\udd25\n\nNone of it was glamorous. It was just the right things, in the right order, for long enough.\n\nIf you want the full breakdown of what that order actually looks like, I've put it all in a free masterclass.\n\n\u2705 Comment LOOK\nand I'll send it over.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-27", "rank": 77}, {"handle": "lori_nails", "title": "You could double what you take home from the clients already sitting in your chair, without cramming in any new clients.", "views": 372, "comments": 0, "likes": 90, "outlier": 0.01, "followers": 69231, "video_url": "https://www.instagram.com/p/DbL7Q8RutzV/", "audio_url": "https://www.instagram.com/reels/audio/27692083430425371/", "hook": "", "transcript": "", "caption": "You could double what you take home from the clients already sitting in your chair, without cramming in any new clients.\n\nFirst thing I'd do is raise my prices to match the work I'm doing now, because they're probably years behind where your skill already is. \n\nThen I'd add a paid upgrade to every service, the kind of thing your regulars would happily say yes to.\n\nAnd I'd stop handing out free fixes and add ons I never charged for, because those add up to real money over a month.\n\nSame clients and the same appointments, but a lot more to show for it by the end of the month.\n\nWant to know more? Comment BOOKED", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-24", "rank": 78}, {"handle": "corinne.naturopath", "title": "If you have been at this for ten years, you have probably started to wonder if you are the exception, the one whose body", "views": 372, "comments": 0, "likes": 2, "outlier": 0.11, "followers": 3531, "video_url": "https://www.instagram.com/p/DbtG5QogdhO/", "audio_url": "https://www.instagram.com/reels/audio/37945945995048848/", "hook": "", "transcript": "", "caption": "If you have been at this for ten years, you have probably started to wonder if you are the exception, the one whose body just will not respond.\n\nI want to offer you a different read on those ten years.\n\nEverything you have tried, every protocol and podcast and elimination, taught you your own body in a way almost no one gets to know theirs. You can feel the difference between a healing shift and a wrong turn. You know your patterns. You have language for what is happening inside you.\n\nThat is the record of someone who has been doing the right things in the wrong order, without the one thing underneath them that makes the rest work, not the record of someone too far gone.\n\nThe women who stall for a decade are almost never the ones who tried too little. They are the ones who kept starting in the middle, on a body that never had its foundations filled first.\n\nYour decade is exactly what will let you recognize the order the moment someone finally puts it in front of you.\n\nIf you have been at this for years and quietly wondered if you are the exception, comment INFO and I'll DM you where to actually start.", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 79}, {"handle": "dragana.jasprica", "title": "Let\u2019s say bye-bye \ud83d\udc4b\ud83c\udffc to another 5 years of staying stuck!", "views": 362, "comments": 0, "likes": 9, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/Db224ItBRYO/", "audio_url": "https://www.instagram.com/reels/audio/28038972865791988/", "hook": "", "transcript": "My spiciest take is that body recomposition is a scam, at least for you, and before you come for me, let me explain.\nOkay, I need to be really honest with you.\nLosing body fat and building muscle mass at the same time does work, but it only works for a few people.\nTotal beginners who just picked up a weight.\nSomeone coming back to training after a long break.\nAnd people on gear.\nIf you are none of those, you have been lifting consistently for years.\nFocusing on body recomp is the exact reason why you still look soft instead of lean and defined.\nAnd I know what you have been telling yourself.\nI'll just lose that last bit of fat and then I will finally see the muscle definition.\nBut if you have been sitting in a teeny tiny, a little deficit forever, trying to lose fat and build muscle at the same time, there is barely any muscle mass under there to reveal in the first place.\nSo you never really lean out, but you also never really build muscle either.\nYou're just stuck in the middle, what I like to call the level of suck.\nAnd I have watched hundreds of women stay there for years on end.\nDamn, I was stuck there for almost 5 years myself.\nThe way out of the level of suck was never doing everything at once.\nIt's picking one goal at a time and fully commit.\nYou go all in on a proper fat loss phase, then you go all in on building muscle without giving up 4 weeks in because you feel a little puffy and bulky.\nAnd that right there is the difference between staying stuck, looking soft for another 5 years or finally looking like you lift.", "caption": "Let\u2019s say bye-bye \ud83d\udc4b\ud83c\udffc to another 5 years of staying stuck!\nAnd hello \ud83d\ude4b\ud83c\udffc\u200d\u2640\ufe0f to finally looking like you lift.\n\nWe broke the whole \u201drecomp lie\u201c down in a podcast episode, exactly why it costs women years, and what to do instead. \n\n\ud83c\udfa7 Comment RECOMP and I\u2019ll send it straight to you.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-10", "rank": 80}, {"handle": "justinschumanofficial", "title": "feeling safe\u2026 what a concept", "views": 356, "comments": 41, "likes": 423, "outlier": 0.0, "followers": 186885, "video_url": "https://www.instagram.com/p/DbGM2ydqUz_/", "audio_url": "https://www.instagram.com/reels/audio/27447533624897728/", "hook": "", "transcript": "One of the things about Japan that I feel is profoundly different from New York City, which is where I live I'm an anxious person and I understand that Danger can happen anywhere.\nYour safety is not guaranteed Anywhere something could go wrong an air-conditioning could fall out of the sky and kill me in the course of making this video But there is something about Japan and the people here and the culture How it all feels that I just trust that I'm okay There's not something I feel in New York or many places to be honest And I was just waiting to cross the street and out of my you know, peripheral vision I saw a couple walking toward me and in New York, I would have Immediately scanned like did a quick look.\nI would have been Cool about it, but I would have scanned just to check for my safety my surroundings I didn't even have the impulse here.\nI just Stood waiting for the crosswalk to change and kept trying to Breathe something.\nI don't do phenomenally well, and I realized I was like I Didn't feel incumbent danger in that moment.\nIt's because I feel such a sense of safety here And for someone like me and I don't know if you've ever experienced something like this But to walk around feeling like you have to be hyper vigilant and I clock this white male like world is built for me I don't Attract undue attention.\nIt is an incredible thing to be able to put down every once and again the fear the hyper vigilance The feeling like I'm just not gonna be okay", "caption": "feeling safe\u2026 what a concept \n\n#nervoussystem #anxiety #tokyo #japan #hypervigilance", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-22", "rank": 81}, {"handle": "revivetherapyservices", "title": "If your stomach drops every time your boss says got a minute, comment \"HEAL\" and I'll send you the work that goes where", "views": 355, "comments": 0, "likes": 19, "outlier": 0.23, "followers": 1522, "video_url": "https://www.instagram.com/p/DbwLuxrjV7I/", "audio_url": "https://www.instagram.com/reels/audio/28893321110256200/", "hook": "", "transcript": "", "caption": "If your stomach drops every time your boss says got a minute, comment \"HEAL\" and I'll send you the work that goes where that reaction lives.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 82}, {"handle": "dragana.jasprica", "title": "Okay. Real talk. \ud83d\ude05 This might sting a little, but you need to hear it.", "views": 325, "comments": 0, "likes": 4, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/Dbus80ChA4A/", "audio_url": "https://www.instagram.com/reels/audio/1550123486358424/", "hook": "", "transcript": "", "caption": "Okay. Real talk. \ud83d\ude05 This might sting a little, but you need to hear it.\nBut first \u2935\ufe0f\n\nIf you recognise yourself in ANY of these, that\u2019s exactly what a body composition audit is for.\n\n\u2705 Comment AUDIT and I\u2019ll personally reach out to see if you qualify. We\u2019ll look at your setup and find which of these is keeping you stuck.\n\nNow, the 4 things I\u2019d tell you if I wasn\u2019t scared to hurt your feelings \ud83d\udc47\ud83c\udffc\n\n1\ufe0f\u20e3 Your training isn\u2019t the flex you think it is. Showing up 5 days a week means nothing if the weight on the bar hasn\u2019t moved in a year. You think you\u2019re applying progressive overload. But the strength numbers in your key lifts say otherwise.\n\n2\ufe0f\u20e3 You don\u2019t have enough muscle yet to SEE muscle definition when leaning out. That\u2019s the real reason you keep cutting and keep ending up looking soft. There\u2019s just not much under there to reveal.\n\n3\ufe0f\u20e3 Your deficit is too small and it\u2019s been going on too long. A permanent little cut is exactly how you spend a YEARS looking the same. You were never really going all in to truly lean out, or long enough out of it to build real muscle mass.\n\n4\ufe0f\u20e3 And that plan you cobbled together from a trainer, an app and a macro calculator? It was never built to work together. So even though you are using all the right tools to transform your body, all pieces of the puzzle are pulling in different directions.\n\nI\u2019m this hard on you because I lived every single one of these myself.\n\n5 years of training my ass off and standing in front of the same mirror, wondering what I was doing wrong.\n\nIt was never the effort. It was the strategy. \ud83e\udd37\ud83c\udffc\u200d\u2640\ufe0f", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 83}, {"handle": "dragana.jasprica", "title": "Want to know the exact strength numbers you should be hitting by now?", "views": 318, "comments": 6, "likes": 16, "outlier": 0.01, "followers": 42594, "video_url": "https://www.instagram.com/p/DbnaEY-BUt0/", "audio_url": "https://www.instagram.com/reels/audio/27720558870934515/", "hook": "", "transcript": "Another eight week cut is the exact reason why you still don't look like you lift.\nThe whole fitness industry taught you that the answer is always another cut.\nFeeling a little bit soft and fluffy?\nCut.\nHolidays coming up?\nCut again.\nNew year around the corner?\nCut.\nAnd this never works long term for you because you still don't look like you lift.\nBecause one thing that you need to realize is that cutting will only make you look like you lift if there is enough muscle mass to reveal underneath.\nAnd here's exactly how to know whether there is.\nLook at your strength numbers.\nIf you have been lifting for one or two years by now, you should be able to hit intermediate level lifts.\nThat means squatting your body weight for eight reps and doing RDLs at 1.5 times your body weight for six reps.\nIf you are nowhere near that, then I can tell you right now, and I know it might sting a little, you do not have enough muscle mass to truly look defined and like you lift when you lean out.\nSo you can cut all you want, babe.\nYou can lose that annoying body fat, get lighter on the scale, but if the muscle isn't there, cutting just turns you into a softer, smaller version of the exact same body because there is nothing underneath to show.\nNow I want you to write this down somewhere.\nThat lean, athletic, defined body that you're dreaming of comes from building muscle mass, period.\nAnd building it takes months and years of proper fueling with a program where you can get objectively stronger in your key lifts over time.\nMy clients who get the best results in their body transformation journey are building for months on end.\nAnd I'm not talking about two or three, it's more like 12 plus.\nLike my client Stephanie, who is focusing now for a full year on building muscle and getting stronger.\nAnd she doesn't only look more lean and defined, but she also added 20 kilo on her dead lifts in six months.\nAnd then once there is actually some muscle there, your cutting phase reveals the bod", "caption": "Want to know the exact strength numbers you should be hitting by now? \n\n\u2705 Comment \u201dSTRONG\u201c and I\u2019ll send you our female strength benchmarks that show if your training is effective for the time & effort you put in.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-04", "rank": 84}, {"handle": "justinschumanofficial", "title": "want social media to change your life? this is required viewing", "views": 314, "comments": 9, "likes": 197, "outlier": 0.0, "followers": 186884, "video_url": "https://www.instagram.com/p/DbK4A3TKKEf/", "audio_url": "https://www.instagram.com/reels/audio/27982146428078240/", "hook": "", "transcript": "Every single successful creator you follow or enjoy has at some times hated their own fucking content and probably not loved themselves all that much.\nI think that to be a successful content creator is not to show up every single day and love every piece of content you create or to always know exactly the direction you're moving in because let's be very clear, eventually if you're a successful content creator, you've monetized this in some capacity, whether it is through brand deals and sponsorships or it is through starting a business as a service provider or what have you or building a product.\nAt a certain point, your content becomes more than just about your self-expression, which if you follow me, you already know this, and if you don't follow me, well, you should, and also you'll know this soon enough.\nPublic self-expression is the foundational tenet to my belief system where social media is concerned.\nI think of social media as like a personality gym.\nPractice expressing yourself in a space where you know other people are allowed to see you, hear you, and experience you.\nAt some point, the content becomes more than just about self-expression because you want to use it strategically to either make you money, grow you an audience, whatever, and when you ask content, which is a free thing, to yield you opportunities or results, it's like putting your content into a vice grip and it puts a lot of pressure on the work, always feeling like there's certain pieces you're not creating, ways to be repurposing your content or why aren't you more present on that platform?\nFuck, I haven't sent an email to my list of over 10,000 people in a month.\nIt's not like you are experiencing this sort of drought and desert and desperation and stuckness and then after posting successfully for a certain amount of time, that flips and changes and you never feel that way again, no.\nI have an experience called Show Up 90.\nReally, it's like a 90-day experience of learning to exp", "caption": "want social media to change your life? this is required viewing", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-24", "rank": 85}, {"handle": "altaredstatesofconsciousness", "title": "if you're scared you're the exception this won't work for, comment SHADOW and let's prove that wrong.", "views": 305, "comments": 0, "likes": -1, "outlier": 0.01, "followers": 44884, "video_url": "https://www.instagram.com/p/Dbj91BSO13v/", "audio_url": "https://www.instagram.com/reels/audio/28140400025565068/", "hook": "", "transcript": "You can explain your patterns and still not stop them.\nAsk me how I know.\nYou can diagnose yourself mid-sentence, abandonment wound activated, probably by my dad.\nAnyway, you've got the podcast and the therapist who's proud of you.\nThe 2 a.m. spiral, you survived all of it.\nBut somewhere private, you've decided you must be too broken for this to work on you.\nAnd that's just not it.\nYou see, all that insight was never the thing that moves it.\nYour understanding has turned into a place you go so you don't have to feel.\nAnd you can't think your way through a door that opens from the felt side.\nThe woman I work with are you, smart, accomplished, and stuck in the same loop.\nAnd what helps is a room where the feeling finally happens with someone holding it.", "caption": "if you're scared you're the exception this won't work for, comment SHADOW and let's prove that wrong.", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-03", "rank": 86}, {"handle": "allandib", "title": "For years, my stomach dropped every time someone made a decision without me. I called it caring. It was really fear. Fea", "views": 296, "comments": 0, "likes": 3, "outlier": 0.05, "followers": 6053, "video_url": "https://www.instagram.com/p/DbzGjQNDTB0/", "audio_url": "https://www.instagram.com/reels/audio/832055344684922/", "hook": "", "transcript": "", "caption": "For years, my stomach dropped every time someone made a decision without me. I called it caring. It was really fear. Fear that the business couldn't be trusted to run without my fingerprints on everything.\n\nThen one day someone on the team solved a real problem, made the call I would have made, and handled it cleanly. My first reaction was pride, not panic. \n\nThat switch is everything. It only happens when you take the thinking outside your head and write it into real processes your team can follow. \n\nYou didn't build this business to be needed every hour of every day. You can let it run without you and feel good doing it. \n\nComment \"TRUST\" if you're ready for a team that can act without you.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-09", "rank": 87}, {"handle": "justinschumanofficial", "title": "*cries in overachiever*", "views": 285, "comments": 12, "likes": 183, "outlier": 0.0, "followers": 186888, "video_url": "https://www.instagram.com/p/DbIviqIq-zl/", "audio_url": "https://www.instagram.com/reels/audio/28224162460503276/", "hook": "", "transcript": "I've watched CEOs who negotiate million-dollar deals freeze over a 30-second Instagram video.\nThey will say it's because they're busy, or like talking videos are just not their thing.\nLife has just been so crazy lately.\nThose were never the fucking reasons.\nIt's because every boardroom, every promotion, every meeting you've ever run, every co-worker's work you ever took over because they just weren't fucking good enough to do it, rewarded competence.\nPublicly demonstrating your excellence.\nBeing so fucking good that you were undeniable.\nSomething you only feel driven to do because you spent your entire youth feeling never good enough.\nI'll let you deal with that with your therapist.\nThe gag is that posting online and then ultimately being successful at it asks for something different.\nIt requires you to share and expose yourself before you're certain.\nBefore that level of polish or finality has been put on top of the final product.\nAll of other social media, pretty much everybody who's not me, is gonna ask you to do the beautiful, finessed, aesthetic final product version of this.\nThat, we'll just call that like content.\nI'm gonna talk about this as like captured little life boops.\nThat's what I want your videos to feel like.\nBecause if you have spent your entire life being rewarded for having the answer, then being watched while you're figuring it out in real time is going to feel terrifying.\nIt is also the most exhilarating externalization of self-healing you could possibly do, and will change your fucking life.\nAnd if you want me to prove it to you, fill out the application in my bio.\nWe can work together on it.\nI will accept that challenge.\nBecause I did this for myself.\nI like myself so much more than I did five years ago before I started posting on social.\nBecause let me tell you, the more successful that you've become in this world, the harder it is to let people see you do the unfinished thing.\nUh-oh.\nThey're gonna find out you're not perfect.\nYou'", "caption": "*cries in overachiever*", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-23", "rank": 88}, {"handle": "kdmueller", "title": "picture this instead. you hand something off, a real thing, and you never touch it again.", "views": 278, "comments": 0, "likes": 15, "outlier": 0.23, "followers": 1193, "video_url": "https://www.instagram.com/reel/Db95vFkhVSI/?igsh=OWZiNmZnbXd6Mmds&igsi=OWZiNmZnbXd6Mmds", "audio_url": "https://www.instagram.com/reels/audio/2182945188490581/", "hook": "", "transcript": "Can't breathe, uh Can't dance, can't", "caption": "picture this instead. you hand something off, a real thing, and you never touch it again.\nno checking. no fixing it at 10pm. no redoing it quietly so it\u2019s right.\nit just gets handled, by someone else, and the world does not end.\nthat\u2019s not laziness, that\u2019s leadership. the version of you that can let it be done imperfectly is the one who finally rests.\ncomment BACKBONE and i\u2019ll show you the first handoff.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-13", "rank": 89}, {"handle": "dragana.jasprica", "title": "If you want the full breakdown of how we run every phase, not just fat loss, I\u2019ve put it all together in a free resource", "views": 277, "comments": 15, "likes": 22, "outlier": 0.01, "followers": 42593, "video_url": "https://www.instagram.com/p/Db0SC41BV4s/", "audio_url": "https://www.instagram.com/reels/audio/28480418821544523/", "hook": "", "transcript": "Here's exactly how to run a fat loss phase so you lose the fat and keep it off.\nSave this because I'm going to show you the whole plan.\nAnd I'll use a real example so you can follow along.\nStep number one, decide how much you actually want to lose.\nLet's say you're 65 kilo and you want to drop 10 kilo.\nThat's your target and we will build the rest from this number.\nStep number two, set your weekly rate of loss.\nA proper rate of loss is around 0.8% of your starting body weight per week.\nAt 65 kilo, that's a bit over half a kilo a week.\nFast enough to see the changes happening and keep your motivation high.\nAnd slow enough to keep the muscle mass underneath.\nStep number three, and now we set your start and end date.\nAnd this part does itself.\nBecause your target weight loss and your weekly rate of loss will tell you exactly how long it's going to take.\nLosing 10 kilo with a bit over half a kilo a week is around 20 weeks of fat loss.\nPlus we will throw in a couple of buffer weeks.\nSo roughly five to six months from start to finish.\nAnd just like that you know your finish line before you have even begun.\nStep four, every day you weigh yourself and you track all of your training sessions.\nAll the sets, the reps and the weight that you moved.\nAnd then once a week you check your biofeedback, take progress pictures.\nAnd take body circumferences at your waist, your hips and your mid-thigh.\nThese data points will help you to make a call and decide if you need to keep things steady.\nOr adjust anything with your training and nutrition.\nAnd here's the thing, done right, your strength levels should actually go up during a fat loss phase.\nLike for one of my clients who hit a new squat PB at 72.5 kilo in the last week of her fat loss phase.\nUp from 45 kilo just six months ago.\nAnd you can see it in her photos.\nShe got stronger while she also lost 7 kilo and dropped 9 centimeters of her hips and 4 centimeters of her waist.\nAnd last but not least, step number five, you set", "caption": "If you want the full breakdown of how we run every phase, not just fat loss, I\u2019ve put it all together in a free resource. \n\n\u2705 Comment \u201cLOOK\u201d and I\u2019ll send it over.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-09", "rank": 90}, {"handle": "revivetherapyservices", "title": "If you think the harsh inner voice is what keeps you sharp, read that fourth point again. Comment \"[CRITIC]\" and I'll se", "views": 272, "comments": 0, "likes": 10, "outlier": 0.18, "followers": 1519, "video_url": "https://www.instagram.com/p/Dbyt9IRDNKI/", "audio_url": "https://www.instagram.com/reels/audio/37524515763858511/", "hook": "", "transcript": "Being cruel to yourself has never once gotten you an inch further in your healing These are for my people who constantly have that inner critic running in the background Calling you stupid when you don't know something Saying that you're lazy because you're trying to take some rest saying that you're never enough because your friendships aren't where you think they should be and Here's the thing that criticism We've kind of contorted that into thinking that's what makes us disciplined Right, like it's keeping us on track and that inner critic part is Oftentimes are hitting us so hard with all of those criticisms because it believes that if it didn't do that You would fall off the edge.\nYou would become a blob.\nYou would stop investing in friendships You would stop trying so it has become this military sergeant To get you in line What actually is happening though is that part was developed because of trauma most likely for a lot of people It's a strategy that your body learned at a young age that When someone else pointed out a flaw You now adapted to that and said I'm now going to point out this flaw in me to shoot myself in the foot Before someone else gets the chance to and here's the thing I know you know that talking to yourself in that horrible way doesn't actually move the needle for you But you just can't get it to stop it's like on autopilot So here is my advice as a trauma therapist To decrease that negative Critic that's always yelling at you.\nYou need to befriend it What I mean is the more you resist that self critic the more it's gonna come back screaming in your face And you know that I'm right because you've experienced it When we befriend these parts like this inner critic we're not saying hey beat the shit out of me we're getting to know it almost as if It's a friend of ours That's just trying to protect us But it never was taught how to protect us in a healthy adaptive way And so is it really its fault that the only way it learned how to p", "caption": "If you think the harsh inner voice is what keeps you sharp, read that fourth point again. Comment \"[CRITIC]\" and I'll send you the first step to turning down the volume.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-08", "rank": 91}, {"handle": "revivetherapyservices", "title": "A physical therapist came to me a while back, overwhelmed and completely out of ideas. She'd done therapy before, she kn", "views": 266, "comments": 0, "likes": 7, "outlier": 0.17, "followers": 1522, "video_url": "https://www.instagram.com/p/Dbgb9zMFWNQ/", "audio_url": "https://www.instagram.com/reels/audio/27715786104743808/", "hook": "", "transcript": "", "caption": "A physical therapist came to me a while back, overwhelmed and completely out of ideas. She'd function renderCreators(pool){
  const box=$("#creators");
  if(!pool.length){ box.innerHTML=`<div class="empty-state"><div class="big">🏁</div><h3>No creators yet</h3><p>No entries in this division for the ${windowLabel()}.</p></div>`; return; }
  const map={};
  pool.forEach(d=>{
    const m=map[d.handle]||(map[d.handle]={handle:d.handle,videos:0,views:0,best:0,bestOut:0,followers:d.followers});
    m.videos++; m.views+=d.views; m.best=Math.max(m.best,d.views); m.bestOut=Math.max(m.bestOut,d.outlier); m.followers=Math.max(m.followers,d.followers);
  });
  const list=Object.values(map).sort((a,b)=>b.views-a.views);
  box.innerHTML = `<div class="colhead" style="grid-template-columns:52px 1fr 120px 82px 92px"><span>Rank</span><span>Creator</span><span class="r">Total views</span><span class="r">Videos</span><span class="r">Best outlier</span></div>`+
  list.map((c,i)=>`<div class="crow${i===0?' lead':''}">
      <div class="rank${i<3?' top3':''} tnum">${i+1}</div>
      <div><div class="handle" style="font-weight:800;font-size:15px">@${esc(c.handle)}</div>
        <div class="t" style="font-size:12px;color:var(--text-dim);margin-top:2px">${nf(c.followers)} followers · best video ${nf(c.best)} views</div></div>
      <div class="cviews views-cell"><b class="tnum">${nf(c.views)}</b></div>
      <div class="metric sm c-hide tnum" style="text-align:right">${c.videos}</div>
      <div class="metric big c-hide" style="text-align:right"><span class="otag${c.bestOut>=3?' hot':''} tnum">${fmtOutlier(c.bestOut)}×</span></div>
    </div>`).join("");
}

/* ---------- orchestration ---------- */
function renderAll(){
  const pool=currentPool(); rankPool(pool);
  document.querySelectorAll(".divpill").forEach(p=>p.setAttribute("aria-selected",String(p.dataset.div===state.division)));
  document.querySelectorAll("#winToggle button").forEach(b=>b.setAttribute("aria-selected",String(+b.dataset.days===state.days)));
  renderStats(pool); renderDivbar(); renderPodium(pool); renderBoard(pool); renderCreators(pool);
}
function switchView(v){
  state.view=v;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===v)));
  $("#videosView").hidden = v!=="videos"; $("#creatorsView").hidden = v!=="creators";
  $(".rightctl").style.visibility = v==="videos"?"visible":"hidden";
}

/* ---------- theme ---------- */
function initTheme(){
  const btn=$("#themeBtn");
  const apply=t=>{ if(t==="system")document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t);
    const dark = t==="dark" || (t==="system" && matchMedia("(prefers-color-scheme:dark)").matches);
    $("#themeIcon").textContent = dark?"☾":"☀"; $("#themeLabel").textContent = t.charAt(0).toUpperCase()+t.slice(1); };
  let cur="system"; apply(cur);
  btn.addEventListener("click",()=>{ cur = cur==="system"?"light":cur==="light"?"dark":"system"; apply(cur); });
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(cur==="system") apply("system"); });
}

/* ---------- wire ---------- */
initTheme();
renderHeaderStatic();
renderAll();
$("#winToggle").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.days=+b.dataset.days; renderAll(); });
$("#search").addEventListener("input",e=>{ state.q=e.target.value; renderBoard(currentPool()); });
$("#sort").addEventListener("change",e=>{ state.sort=e.target.value; const p=currentPool(); rankPool(p); renderBoard(p); });
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchView(t.dataset.view)));
</script>

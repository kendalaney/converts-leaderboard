<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creator Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F5F6F9; --surface-3:#EAEDF2;
    --border:#DCE0E8; --border-2:#CDD3DD;
    --text:#161A21; --text-dim:#5A6474; --text-faint:#8A93A2;
    --gold:#B4831F; --gold-bg:#FBF2DA; --gold-line:#E7CE93;
    --silver:#6E7987; --silver-bg:#EDEFF3;
    --bronze:#9C5F2E; --bronze-bg:#F6E9DD;
    --pos:#178A57; --accent:#2E6FB6; --accent-bg:#E7F0FA;
    --bar:#C6CDD8; --bar-lead:#D8B45A;
    --shadow:0 1px 2px rgba(20,26,36,.06),0 6px 20px rgba(20,26,36,.06);
    --shadow-lg:0 2px 6px rgba(20,26,36,.08),0 18px 44px rgba(20,26,36,.12);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Helvetica Neue","Arial Nova",Arial,system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#151A22; --surface-2:#1A2029; --surface-3:#20283340;
    --border:#262E3A; --border-2:#333D4C;
    --text:#EAEEF4; --text-dim:#98A2B2; --text-faint:#6C7686;
    --gold:#F2C14E; --gold-bg:#241E10; --gold-line:#5A481F;
    --silver:#C2CAD4; --silver-bg:#1B2029;
    --bronze:#D08A4E; --bronze-bg:#241A11;
    --pos:#38D08A; --accent:#5AA2EC; --accent-bg:#13202E;
    --bar:#2A3340; --bar-lead:#7A5E23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1015; --surface:#151A22; --surface-2:#1A2029; --surface-3:#20283340;
    --border:#262E3A; --border-2:#333D4C;
    --text:#EAEEF4; --text-dim:#98A2B2; --text-faint:#6C7686;
    --gold:#F2C14E; --gold-bg:#241E10; --gold-line:#5A481F;
    --silver:#C2CAD4; --silver-bg:#1B2029;
    --bronze:#D08A4E; --bronze-bg:#241A11;
    --pos:#38D08A; --accent:#5AA2EC; --accent-bg:#13202E;
    --bar:#2A3340; --bar-lead:#7A5E23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:1140px;margin:0 auto;padding:26px 18px 80px}
  .tnum{font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .masthead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;justify-content:space-between;margin-bottom:6px}
  .brand{display:flex;flex-direction:column;gap:8px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:8px}
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--gold);display:inline-block}
  h1{margin:0;font-size:clamp(30px,5.2vw,50px);font-weight:800;letter-spacing:-.026em;line-height:.98;text-wrap:balance}
  .sub{color:var(--text-dim);font-size:14.5px;max-width:64ch}
  .theme-toggle{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:8px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;font-weight:600}
  .theme-toggle:hover{border-color:var(--border-2);color:var(--text)}

  /* window toggle */
  .winbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 2px}
  .winlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
  .segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:2px}
  .segmented button{border:0;background:transparent;color:var(--text-dim);padding:9px 17px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
  .segmented button:hover{color:var(--text)}
  .segmented button[aria-selected="true"]{background:var(--surface);color:var(--gold);box-shadow:var(--shadow)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow)}
  .stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
  .stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
  .stat .v small{font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:0}

  /* division bar */
  .divbar{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;margin-top:8px;scrollbar-width:thin}
  .divbar::-webkit-scrollbar{height:6px}
  .divbar::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
  .divpill{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:border-color .15s,color .15s}
  .divpill:hover{border-color:var(--border-2);color:var(--text)}
  .divpill[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
  .divpill .emo{font-size:14px;line-height:1}
  .divpill .cnt{font-family:var(--mono);font-size:11px;background:var(--surface-2);color:var(--text-dim);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
  .divpill[aria-selected="true"] .cnt{background:var(--surface);color:var(--text)}

  .section-label{display:flex;align-items:center;gap:12px;margin:12px 0 14px}
  .section-label h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .section-label h2 .scope{color:var(--gold)}
  .section-label .line{flex:1;height:1px;background:var(--border)}
  .section-label .hint{font-family:var(--mono);font-size:11px;color:var(--text-faint);white-space:nowrap}

  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
  .pod{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 18px 18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;gap:12px}
  .pod.g1{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-bg),var(--surface) 62%)}
  .pod.g3{border-color:var(--bronze-bg)}
  .pod .crown{position:absolute;top:14px;right:16px;font-size:22px}
  .medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;flex:none}
  .m1{background:var(--gold);color:#231a05}.m2{background:var(--silver);color:#1c222b}.m3{background:var(--bronze);color:#231204}
  .pod .who{display:flex;align-items:center;gap:11px}
  .pod .handle{font-weight:800;font-size:16px;letter-spacing:-.01em;word-break:break-word}
  .pod .rankword{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
  .pod .bigviews{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .pod .bigviews span{font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:0;margin-left:5px}
  .pod .podmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--border)}
  .pod .pm{display:flex;flex-direction:column;gap:1px}
  .pod .pm b{font-size:14px;font-weight:700;font-family:var(--mono)}
  .pod .pm i{font-size:10px;font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
  .pod .podtitle{font-size:12.5px;color:var(--text-dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pod .divtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:999px;align-self:flex-start}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 12px}
  .tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px}
  .tab{border:0;background:transparent;color:var(--text-dim);padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .rightctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 13px 9px 32px;font-size:13.5px;color:var(--text);min-width:230px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='%238A93A2' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.5' y2='16.5'/></svg>");background-repeat:no-repeat;background-position:11px center}
  .search:focus{outline:none;border-color:var(--accent)}
  .sortsel{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim)}
  .sortsel label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
  select.srt{appearance:none;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 30px 9px 12px;font-size:13px;font-weight:600;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238A93A2' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 9px center}

  .board{display:flex;flex-direction:column;gap:7px}
  .boardnote{font-family:var(--mono);font-size:11px;color:var(--text-faint);letter-spacing:.03em;padding:2px 4px 2px}
  .colhead{display:grid;grid-template-columns:52px 1fr 118px 92px 78px;gap:12px;padding:4px 16px;align-items:center}
  .colhead span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
  .colhead .r{text-align:right}
  .row{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s}
  .row:hover{border-color:var(--border-2)}
  .row.lead{border-color:var(--gold-line)}
  .rowmain{display:grid;grid-template-columns:52px 1fr 118px 92px 78px;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;position:relative}
  .rank{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--text-dim);text-align:center}
  .row.lead .rank{color:var(--gold)}
  .rank.top3{color:var(--text)}
  .vid{min-width:0}
  .vid .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .vid .handle{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
  .fmt{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:2px 7px;border-radius:999px}
  .vid .t{font-size:12.5px;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .views-cell{text-align:right}
  .views-cell b{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .barwrap{height:4px;background:var(--bar);border-radius:3px;margin-top:5px;overflow:hidden}
  .barfill{height:100%;background:var(--accent);border-radius:3px}
  .row.lead .barfill{background:var(--bar-lead)}
  .metric{text-align:right;font-family:var(--mono);font-weight:600}
  .metric.big{font-size:15px}
  .metric.sm{font-size:13px;color:var(--text-dim)}
  .metric .lab{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-top:2px;font-family:var(--sans);font-weight:600}
  .otag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:13px}
  .otag.hot{background:var(--gold-bg);color:var(--gold)}
  .chev{position:absolute;right:12px;bottom:9px;color:var(--text-faint);transition:transform .2s;display:none}

  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease}
  .row.open .detail{grid-template-rows:1fr}
  .detail-inner{overflow:hidden;min-height:0}
  .row.open{box-shadow:var(--shadow-lg)}
  .dpad{padding:4px 16px 18px;border-top:1px solid var(--border);margin-top:2px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin-top:14px}
  @media(max-width:640px){.dgrid{grid-template-columns:1fr}}
  .block .blab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .block p{margin:0;font-size:13.5px;color:var(--text);line-height:1.62}
  .block p.empty{color:var(--text-faint);font-style:italic}
  .hookbox{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:8px;padding:11px 13px}
  .hookbox p{font-size:14px;font-weight:600}
  .transcript{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;max-height:230px;overflow:auto}
  .transcript p{font-size:13px;line-height:1.7;white-space:pre-wrap}
  .dmetrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin-top:2px}
  .dm{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .dm b{font-size:16px;font-weight:800;font-family:var(--mono);letter-spacing:-.01em}
  .dm i{display:block;font-size:9.5px;font-style:normal;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin-top:2px;font-weight:600}
  .dlinks{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
  .lk{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--border)}
  .lk.watch{background:var(--accent);color:#fff;border-color:transparent}
  .lk.watch:hover{text-decoration:none;filter:brightness(1.06)}
  .lk.audio{background:var(--surface-2);color:var(--text)}
  .lk.audio:hover{text-decoration:none;border-color:var(--border-2)}
  .triggers{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .trg{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);border:1px solid transparent;padding:2px 9px;border-radius:999px}

  .empty-state{text-align:center;padding:46px 20px;background:var(--surface);border:1px dashed var(--border-2);border-radius:16px;color:var(--text-dim)}
  .empty-state .big{font-size:30px;margin-bottom:8px}
  .empty-state h3{margin:0 0 4px;font-size:16px;color:var(--text)}
  .empty-state p{margin:0;font-size:13.5px}

  .creators{display:flex;flex-direction:column;gap:7px}
  .crow{display:grid;grid-template-columns:52px 1fr 120px 82px 92px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow)}
  .crow.lead{border-color:var(--gold-line)}
  .crow .cviews b{font-size:17px;font-weight:800;letter-spacing:-.02em}
  @media(max-width:680px){.crow{grid-template-columns:42px 1fr 92px;row-gap:8px}.crow .c-hide{display:none}}

  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);color:var(--text-faint);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
  footer .mono{font-family:var(--mono)}

  @media(max-width:720px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .podium{grid-template-columns:1fr}
    .colhead{display:none}
    .rowmain{grid-template-columns:40px 1fr auto;gap:10px;row-gap:6px;padding-bottom:20px}
    .rowmain .metric.big,.rowmain .metric.sm{display:none}
    .views-cell{grid-column:3}
    .chev{display:block}
    .vid .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <div class="eyebrow">CONVERTS&trade; System &middot; Client Standings</div>
      <h1>The Creator Leaderboard</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="theme-toggle" id="themeBtn" type="button" aria-label="Toggle color theme">
      <span id="themeIcon">◐</span><span id="themeLabel">Theme</span>
    </button>
  </header>

  <div class="winbar">
    <span class="winlabel">Time window</span>
    <div class="segmented" id="winToggle" role="tablist" aria-label="Time window">
      <button role="tab" data-days="7">7 days</button>
      <button role="tab" data-days="30">30 days</button>
      <button role="tab" data-days="90">90 days</button>
      <button role="tab" data-days="365">365 days</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="divbar" id="divbar" role="tablist" aria-label="Divisions"></div>

  <div class="section-label">
    <h2>🏆 On the Podium <span class="scope" id="podScope"></span></h2><div class="line"></div>
    <span class="hint">Ranked by views</span>
  </div>
  <div id="podium"></div>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Leaderboard view">
      <button class="tab" role="tab" id="tab-videos" aria-selected="true" data-view="videos">Top Videos</button>
      <button class="tab" role="tab" id="tab-creators" aria-selected="false" data-view="creators">Creator Standings</button>
    </div>
    <div class="rightctl">
      <input class="search" id="search" type="search" placeholder="Search handle or hook" aria-label="Search videos">
      <div class="sortsel">
        <label for="sort">Sort</label>
        <select class="srt" id="sort" aria-label="Sort by">
          <option value="views">Views</option>
          <option value="outlier">Outlier Score</option>
          <option value="comments">Comments</option>
          <option value="likes">Likes</option>
        </select>
      </div>
    </div>
  </div>

  <div id="videosView"><div id="board" class="board"></div></div>
  <div id="creatorsView" hidden><div class="creators" id="creators"></div></div>

  <footer>
    <span>Data: CONVERTS&trade; Client Data &middot; <span class="mono" id="period"></span></span>
    <span class="mono" id="snapshot"></span>
  </footer>
</div>

<script>

, {"handle": "dragana.jasprica", "title": "Calories and protein matter. Obviously.", "views": 5068, "comments": 2, "likes": 35, "outlier": 0.12, "followers": 42593, "video_url": "https://www.instagram.com/p/DbYYv4gBfyB/", "audio_url": "https://www.instagram.com/reels/audio/238777140909556/", "hook": "", "transcript": "", "caption": "Calories and protein matter. Obviously.\n\nBut I\u2019ve read thousands of check-ins at this point and it\u2019s the same thing over and over.\n\nCoffee for breakfast, because she\u2019s got no time in the morning and she\u2019s not even hungry. And when she does eat something early, she\u2019s somehow MORE hungry an hour later. So she pushes it back.\n\nShe trains fasted, or on a banana and a handful of nuts. Salad at her desk.\n\nAnd then it\u2019s 9pm and she\u2019s standing in the pantry going through the cupboards, wondering what is wrong with her. \ud83e\udee0\n\nNothing is wrong with her. She just spent 14hrs barely eating and then trained hard on top of it. Her body is going to come collecting at some point, and it\u2019s not asking your permission at 9pm.\n\nSo we move her calories and her carbs earlier in the day and we fuel her training sessions.\n\nHer weekly calories might be exactly the same. But once her personalized meal timing is dialed in, her energy in the gym improves.\n\nThe deficit stops being a fight she has to win every single night and the sweet cravings are gone.\n\nAnd the part nobody tells you: we\u2019ve seen women eat MORE once the timing is sorted.\n\nThis matters more for YOU than almost anyone, because you\u2019re training hard. Those sessions need fuel.\n\nSkip it and you\u2019ll keep grinding through workouts that go nowhere while your evenings quietly undo the whole week.\n\nWe fix this in the first 14 days with every client. \n\nBefore any fat loss phase, because if this isn\u2019t fixed she won\u2019t stick to the fat loss phase anyway.\n\nIf you\u2019ve been guessing your way through how much, what uck in the middle, never lean and never built.\n\nMost of what you\u2019ve been told about fat loss is exactly what\u2019s keeping you stuck. \ud83e\udd37\ud83c\udffc\u200d\u2640\ufe0f\n\nWant to know what I WOULD tell you to do instead? \ud83d\udc47\ud83c\udffc\n\n\u2705 Comment LOOK and I\u2019ll send you my free resource.", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-09", "rank": 43}, {"handle": "corinne.naturopath", "title": "There was nothing lucky about any of it, even though that's the word people always reach for.", "views": 4680, "comments": 0, "likes": 22, "outlier": 1.33, "followers": 3531, "video_url": "https://www.instagram.com/p/DbgOpALAiv6/", "audio_url": "https://www.instagram.com/reels/audio/37667248372921615/", "hook": "", "transcript": "", "caption": "There was nothing lucky about any of it, even though that's the word people always reach for.\n\nFor two years I was bedridden with Lyme. I couldn't stand long enough to shower, I was sleeping a total of four hours a night, and I'd been told to make managing my illness my full time job forever.\n\nI tried a lot of things in those years, but looking back, most of them weren't actually foundational, and that was the problem. I'd get a stretch of hope, the clouds would part for a bit, and then it would stop being enough to hold me and I'd slide right back and reach for the next thing.\n\nWhat finally got me out of the Lyme was the mental and emotional work. Vitamins and minerals mattered later, but they weren't the thing that got me out of the worst of it. The intangible pieces were the ones that were driving my physical symptoms the whole time.\n\nWe all feel the same basic things, fear, anger, grief. But we don't all make the same meaning out of a symptom. When something flares and your first thought is this is it, I'm going to end up bedridden again, that story does real damage in the body.\n\nThe mold il n't feel like your best self you're never going to be able to take in that beauty get yourself a fucking snack", "caption": "i feel like every mom learns this lesson the hard way.\n\n#travelhumor #japantravel #traveltips #solotravel #travelreels", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-29", "rank": 46}, {"handle": "dragana.jasprica", "title": "1\ufe0f\u20e3 Weigh yourself. I don\u2019t care how many coaches tell you to throw the scale away. Your bodyweight is a data point, the", "views": 4223, "comments": 0, "likes": 15, "outlier": 0.1, "followers": 42593, "video_url": "https://www.instagram.com/p/Dba_8RbuNBZ/", "audio_url": "https://www.instagram.com/reels/audio/245104583078094/", "hook": "", "transcript": "", "caption": "1\ufe0f\u20e3 Weigh yourself. I don\u2019t care how many coaches tell you to throw the scale away. Your bodyweight is a data point, the same way revenue is a data point in your business. You can\u2019t steer what you refuse to measure. Oh, and forget your body fat percentage. Your bodyweight and your strength numbers tell you everything you need to know.\n\n2\ufe0f\u20e3 The shape you\u2019re after comes from muscle. So when you get smaller without building any, you just end up a smaller version of exactly what you were. And most women who\u2019ve been dieting for years don\u2019t have enough muscle yet for ANY deficit to reveal.\n\n3\ufe0f\u20e3 Consistency doesn\u2019t matter if your body transformation strategy isn\u2019t set up right. You can show up every single day with macros that are wrong for you, lifting the same weights you were lifting a year ago, and a year later you\u2019re standing in front of the same mirror looking at the same body.\n\n4\ufe0f\u20e3 You need your carbs. My heaviest ever weigh-in was when I was eating low carb. And after 6 years and 500+ clients I haven\u2019t seen ONE great result that came from cutting them out long term. Of course we might decrease your carbs during a fat loss phase. But living low carb every day means you never build the muscle that gives you shape, so you end up looking soft & flat instead of lean & defined.\n\n5\ufe0f\u20e3 Your training and your nutrition have to come from one place, pointed at one goal. A trainer, a workout app, a macro calculator, a nutritionist. Wherever the two halves came from, if they weren\u2019t set up together, neither one works.\n\nPeople argue with me about all of these. Usually people who sell the opposite. Meanwhile my clients keep getting results. \ud83e\udd37\ud83c\udffc\u200d\u2640\ufe0f\ud83e\udd2d", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-30", "rank": 47}, {"handle": "dragana.jasprica", "title": "I\u2019d stop guessing my way into the next phase. Because that\u2019s how most women run their entire year.", "views": 4174, "comments": 13, "likes": 24, "outlier": 0.1, "followers": 42593, "video_url": "https://www.instagram.com/p/DbXa8cWh9pO/", "audio_url": "https://www.instagram.com/reels/audio/2759690791059218/", "hook": "", "transcript": "", "caption": "I\u2019d stop guessing my way into the next phase. Because that\u2019s how most women run their entire year.\n\nA cut in January because\u2026 it\u2019s January. A program switch because someone on Instagram posted theirs. Then a panic diet right before the beach trip. And twelve months later the photos match last year\u2019s exactly. \ud83e\udee0\n\nEvery single client we take on starts with a Discovery phase. 14 days where we just WATCH how her body responds before we change anything.\n\nHer weight trend. Her strength numbers. How she\u2019s actually been eating. How she recovers.\n\nThen we make the call, based on what her data tells us. And sometimes it says she needs to eat MORE first.\n\nI know how terrifying that sounds after years of cutting, but the women who\u2019ve been underfed the longes , "trigger": ["Elevate Authority"], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-08-10", "rank": 49}, {"handle": "elle.hypnotherapy", "title": "I hear it in almost every first session. \u201cEveryone keeps telling me it just takes time.\u201d Then I ask how long it\u2019s been.", "views": 4034, "comments": 2, "likes": 145, "outlier": 0.48, "followers": 8355, "video_url": "https://www.instagram.com/p/DbLufErtjeJ/", "audio_url": "https://www.instagram.com/reels/audio/1402500478304500/", "hook": "", "transcript": "", "caption": "I hear it in almost every first session. \u201cEveryone keeps telling me it just takes time.\u201d Then I ask how long it\u2019s been. And she says a year. Eighteen months. Two years. Still avoiding the baby aisle. Still leaving the room when someone announces a pregnancy. Still wide awake at 2am, replaying everything. Time didn\u2019t heal her. Time just taught her how to hide it better. What time actually gives you is space\u2026room to find the support that works for you. The healing part is active. It\u2019s calming your nervous system. It\u2019s processing the trauma of what happened to you, not just retelling the story of it. But nobody tells loss moms this. So they wait. And wait. And quietly panic when month eighteen feels just as heavy as month three. If you\u2019re waiting for a version of you that wakes up one day magically okay\u2026I want to gently take that off your plate. She isn\u2019t coming on her own. But she is absolutely reachable. I\u2019ve watched moms get there in weeks, not years, once they had the right tools in their hands \ud83e\udd0d Want to learn more? Comment \u2018KIT\u2019 and I\u2019ll send it your way. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-24", "rank": 50}, {"handle": "lori_nails", "title": "She decides in a couple of seconds whether you're worth booking, and you want to give her something to hold onto as soon", "views": 3958, "comments": 0, "likes": 68, "outlier": 0.06, "followers": 69231, "video_url": "https://www.instagram.com/p/DbYLL0tuyay/", "audio_url": "", "hook": "", "transcript": "", "caption": "She decides in a couple of seconds whether you're worth booking, and you want to give her something to hold onto as soon as she sees your content.\n\nShe should be able to see who you help and what your nails costs without searching for it, and she should know exactly how to easily book with you.\n\nShow her a real client walking out thrilled instead of another close up sitting on a table, and put your prices somewhere she can find them...because hiding them only pulls in the wrong people.\n\nMake it easy, and the right woman will book before she has a chance to talk herself out of it.\n\nComment AUDIT and I'll go through your page and show you what's missing.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-29", "rank": 51}, {"handle": "dragana.jasprica", "title": "Here are my weird dieting rules. Non-negotiable, all of them. \ud83d\udc47\ud83c\udffc", "views": 3824, "comments": 20, "likes": 22, "outlier": 0.09, "followers": 42593, "video_url": "https://www.instagram.com/p/Dbir9nAhYZm/", "audio_url": "", "hook": "", "transcript": "", "caption": "Here are my weird dieting rules. Non-negotiable, all of them. \ud83d\udc47\ud83c\udffc\n\u00a0\n1\ufe0f\u20e3 Reverse diet locked in.\nI don\u2019t start a cut unless the reverse diet is already scheduled. Living in a deficit until some vague finish line is how you trade away your muscle and your metabolism for nothing.\n\u00a0\n(\ud83d\udce3 If you want the full breakdown of the phases and how long each one actually runs, comment LOOK and I\u2019ll send you my free masterclass.)\n\u00a0\n2\ufe0f\u20e3 Weekends count.\nStrict Monday to Friday and loose all weekend adds up to maintenance with extra suffering. I stay locked in Monday to Sunday, and I can do that because my training and my nutrition are actually built for each other.\n\u00a0\n3\ufe0f\u20e3 One goal at a time.\nFat loss needs different fueling than building muscle. Both need something different than endurance work. Chase them all at once and every single one gets in the others\u2019 way.\n\u00a0\n4\ufe0f\u20e3 I keep my carbs in, especially around training.\nI tried low carb for a few months and hit the heaviest weigh-in of my life. Softer, not leaner. That one lesson was expensive enough that I\u2019ve never gone back. \ud83e\udee0\n\u00a0\n5\ufe0f\u20e3 I don\u2019t eat out during a fat loss phase.\nMaybe once or twice in the whole thing. Because a phase only works if you actually run it properly, and I\u2019d rather be strict for a few months than half-committed for years.\n\u00a0\nI know how strict this all sounds from the outside.\n\u00a0\nBut these rules are why I run a fat loss phase every couple of years now, instead of dieting all year, every year.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-02", "rank": 52}, {"handle": "elle.hypnotherapy", "title": "I know exactly who I\u2019m waiting for. The mom who\u2019s forgotten what her own laugh sounds like. The one who looks in the mir", "views": 3692, "comments": 1, "likes": 187, "outlier": 0.44, "followers": 8355, "video_url": "https://www.instagram.com/p/Db6E3oFNrsK/", "audio_url": "https://www.instagram.com/reels/audio/659718145130460/", "hook": "", "transcript": "", "caption": "I know exactly who I\u2019m waiting for. The mom who\u2019s forgotten what her own laugh sounds like. The one who looks in the mirror and sees a stranger wearing her face\u2026because the woman she was before feels like someone she used to know. The one who\u2019s terrified that healing means leaving her baby behind. So she\u2019s been quietly choosing the pain, holding onto it like it\u2019s the last thing connecting them. Mama\u2026if you only ever hear one thing from me, let it be this. Healing doesn\u2019t take your baby from you. The love is what connects you\u2026it always has. And the love survives the healing. It grows through it. I lost my triplets in 2021. I\u2019ve never let them go, not for one second. And I found my way back to a life with real joy in it\u2026they\u2019re woven into every single bit of that joy. So are the 150+ moms I\u2019ve since walked home to themselves. You get to be you again. The version of you who carries them\u2026not the version buried underneath it all. I\u2019ll keep showing up here, patiently. And whenever you\u2019re ready\u2026this is where you land softly \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": ["Overcome Objections"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-11", "rank": 53}, {"handle": "ameliesadvicee", "title": "If you\u2019re tired of this, comment \u201cWELLNESS\u201d and I\u2019ll send you my free video guide to learn more", "views": 3671, "comments": 33, "likes": 74, "outlier": 0.09, "followers": 43033, "video_url": "https://www.instagram.com/p/DbmCXAGvk__/", "audio_url": "https://www.instagram.com/reels/audio/27780516594917694/", "hook": "If you keep having to rebuild your wellness, your skincare, your workout routine every couple months because you're just like bored or it's not working for you, you're probably doing it against your 6th house every time.\nWhen you build something according to your 6th house, this is something you can actually sustain.\nVersus when it works against it, you're gonna go for 3 weeks and then just completely collapse.\nEvery 6th house has a different sustainability threshold.\nFor example, if your 6th house is ruled by Pisces, you can't have strict, rigid health routines.\nYou guys are very emotional on a daily basis.\nYou absor e the south node shows you what pattern might you be stuck in that is preventing you from feeling good in your life versus what's your north node?\nWhat will get you unstuck from this current situation?\nFourth, I always check the major transits that's hitting your chart.\nWhat you need to know in this next year and how we can set you up for it and not scare you.\nFifth, I always end with a specific action step.\nI don't just summarize what we talked about.\nI'm like, okay, what actions are we going to take moving forward to see progress?\nI show you, okay, this is what your energy is saying.\nHere are some steps that could help you.\nWhat do you think?\nAnd then we kind of workshop to figure out what's going to fit in my life because there's a birth chart and then there's a person with real experience, real responsibilities.\nWe have to customize it to you.\nIf you want a book reading with me, link in my bio.\nI love you so much.", "caption": "if you want a reading built on what actually changes things, comment \u201cCHART\u201d and let\u2019s book your session.\n\n#astrologypost #zodiacsigns #birthchart", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-30", "rank": 55}, {"handle": "corinne.naturopath", "title": "Cutting your food list down to almost nothing was supposed to calm your body, and instead you somehow react to more than", "views": 3577, "comments": 0, "likes": 10, "outlier": 1.01, "followers": 3531, "video_url": "https://www.instagram.com/p/DbYg-B7EyJ2/", "audio_url": "https://www.instagram.com/reels/audio/27504385312517128/", "hook": "", "transcript": "", "caption": "Cutting your food list down to almost nothing was supposed to calm your body, and instead you somehow react to more than you did when you ate normally.\n\nI see this constantly, and it's rarely about finding the one last trigger food, it's a body so depleted it can't handle much of anything anymore.\n\nThe bloating and the brain fog are what a body with no reserves does, and when you rebuild the foundation underneath, your tolerance widens and your plate slowly gets bigger again.\n\nYou don't have to live on nine safe foods for the rest of your life.\n\nIf your safe list keeps shrinking and you feel worse, comment INFO and I'll show you the way out.", "trigger": ["Connect with Symptoms"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-29", "rank": 56}, {"handle": "corinne.naturopath", "title": "For years I kept buying supplements like the next bottle was going to be the one that finally fixed me.", "views": 3540, "comments": 9, "likes": 23, "outlier": 1.0, "followers": 3531, "video_url": "https://www.instagram.com/p/DbWQiqXDc9A/", "audio_url": "https://www.instagram.com/reels/audio/27609338855384320/", "hook": "", "transcript": "", "caption": "For years I kept buying supplements like the next bottle was going to be the one that finally fixed me.\n\nI had a cabinet worth thousands of dollars and somehow felt worse than before I started, and every new expert had one more thing for me to add on top.\n\nWhat none of them checked was whether my body could break any of it down, because a body that's inflamed and low on stomach acid doesn't absorb much of what you hand it, so I was swallowing all of it and losing most of it.\n\nWhen I finally fixed my digestion and replenished my mineral and vitamin stores, the things I was already taking started to matter, and it turned out I needed far less than the internet had me believing.\n\nIf your cabinet's full and your energy still isn't, comment INFO and I'll walk you through the absorption check I start every woman on.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 57}, {"handle": "dragana.jasprica", "title": "You cut your calories, you train hard, the scale won\u2019t move, and you decide your metabolism must be slow, or it\u2019s your a", "views": 3418, "comments": 36, "likes": 18, "outlier": 0.08, "followers": 42593, "video_url": "https://www.instagram.com/p/DbxR0xYBsY4/", "audio_url": "", "hook": "", "transcript": "", "caption": "You cut your calories, you train hard, the scale won\u2019t move, and you decide your metabolism must be slow, or it\u2019s your age, or genetics. \ud83e\udee0\n\u00a0\nBut here\u2019s what\u2019s usually actually happening:\ud83d\udc47\ud83c\udffc\n\u00a0\nYou\u2019re not really in a proper deficit at all.\n\u00a0\nYou\u2019re strict Monday to Friday. Then the weekend rolls around, a few meals out, a bit more relaxed, some untracked bits here and there.\n\u00a0\nAnd across the whole week, it all averages back out to maintenance.\n\u00a0\nSo Monday to Friday you FEEL like you\u2019re dieting. But your body only responds to the whole week.\n\u00a0\nAnd the whole week?\nNothing actually happened.\n\u00a0\nIt\u2019s not your metabolism.\nIt\u2019s not your age.\nIt\u2019s not your genetics.\n\u00a0\nThe problem is that being in a calorie deficit is only ONE piece of the puzzle. \ud83e\udde9\n\u00a0\nBecause a deficit only actually works when all 4 levers of your nutrition is dialed in.\n\u00a0\nSet those up wrong, and either the deficit isn\u2019t really there, or you can\u2019t sustain it long enough to really lean out.\n\u00a0\nThat\u2019s why \u201djust eat less\u201c never worked. And it\u2019s why you can\u2019t just white-knuckle your weekends either.\n\u00a0\nWhen all 4 levers are set up together, you can actually stick to the deficit, and the scale finally moves.\n\u00a0\nWant to see how all 4 levers actually work together? \ud83d\udc47\ud83c\udffc\n\u00a0\n\u2705 Comment LOOK and I\u2019ll send you my free resource.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-08", "rank": 58}, {"handle": "dragana.jasprica", "title": "The industry LOVES selling you a version of fat loss where nothing in your life has to change.", "views": 3359, "comments": 0, "likes": 15, "outlier": 0.08, "followers": 42593, "video_url": "https://www.instagram.com/p/DbU-7BSOoqD/", "audio_url": "https://www.instagram.com/reels/audio/175731273333813/", "hook": "", "transcript": "", "caption": "The industry LOVES selling you a version of fat loss where nothing in your life has to change.\n\nKeep the dinners out, keep the wine, keep the weekend treats, and the fat just\u2026 leaves anyway. \ud83c\udf79\n\nI\u2019ve watched that exact promise keep women dieting for half a decade.\n\nReal fat loss asks for real restriction. And because it asks a lot, it needs an END DATE.\n\nNot because it has to be short. Because without one it quietly becomes your whole life.\n\nThis is where we do it differently to most.\n\nSome coaches rush it. Aggressive 8 to 12 weeks, drop the weight at any cost, and nobody\u2019s checking what it\u2019s doing to your strength or your sanity.\n\nOthers go so slow it\u2019s demotivating. Barely anything moves, and you never get out of it to spend real time building.\n\nWe set an end date so it can\u2019t turn into a never ending diet. And we monitor your progress the whole way, so we\u2019re actually balancing fat loss with your strength and your quality of life instead of trading one for the other.\n\nA defined block. A target rate around 0.8% of your bodyweight a week. Up to 24 weeks if that\u2019s what your goal needs. And a date where it ENDS and the reverse begins.\n\nYou commit for the block. Then you LEAVE.\n\nMost of your year happens at maintenance or in a building phase after that, which is where the shape actually gets made anyway.\n\nNow compare that to the woman who\u2019s been trying to lose the same 3 kilos since 2021. Semi-restricted every weekday, loose every weekend. Never lean, never building. Just permanently mid-diet. \ud83e\udee0\n\nHer version sounds kinder on paper. And it\u2019s quietly taken YEARS of her life while her body stayed exactly the same.\n\nA few months of real focus costs less than that. In every single way I can think of.\n\nWhen my data says it\u2019s time, I diet hard. And then I STOP.\n\nBoth parts took me years to learn. Honestly, the stopping was the harder one.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 59}, {"handle": "lori_nails", "title": "For years I treated my page like a photo album, all pretty nails (but no prices,) and nothing that told her how to book", "views": 3346, "comments": 0, "likes": 71, "outlier": 0.05, "followers": 69231, "video_url": "https://www.instagram.com/p/Dbtd_Vhu-jy/", "audio_url": "https://www.instagram.com/reels/audio/657518723487598/", "hook": "", "transcript": "", "caption": "For years I treated my page like a photo album, all pretty nails (but no prices,) and nothing that told her how to book me.\n\nThe likes came pouring in from other nail artists while my books sat there looking the same as always.\n\nA storefront tells people what you do and what it costs... and it makes it easy to walk in,. The day mine started doing that, strangers turned into paying clients.\n\nYour work is worth showing off, but showing it off on its own was never going to fill your chair.\n\nComment AUDIT and I'll take a look at your page and tell you what's stopping it from booking.", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-06", "rank": 60}, {"handle": "elle.hypnotherapy", "title": "It\u2019s not a movie moment. Nobody wakes up one morning suddenly \u201cover it.\u201d Healing looks like sleeping through the night f", "views": 3230, "comments": 4, "likes": 51, "outlier": 0.39, "followers": 8355, "video_url": "https://www.instagram.com/p/DbOTVEINR5u/", "audio_url": "https://www.instagram.com/reels/audio/994389461404657/", "hook": "", "transcript": "", "caption": "It\u2019s not a movie moment. Nobody wakes up one morning suddenly \u201cover it.\u201d Healing looks like sleeping through the night for the first time in eight months. It looks like saying your babies name at dinner and smiling, instead of leaving the table. Walking past a pram without your chest caving in. Staying the whole time at the family barbecue. Wanting to try again\u2026without drowning in guilt about it. One of my clients couldn\u2019t leave her house without racing back to her car in tears if she saw a pregnant woman. Six weeks later she was at a baby shower, present and steady. She called me after, amazed at herself. Do the waves still come? Of course they do. That\u2019s love, not failure. But they stop taking you out for whole days. You feel them, you move through them, and you come back to your life. And your baby stays with you the whole way through. That\u2019s the part nobody expects\u2026the connection actually grows stronger when pain stops being the only anchor. Healing isn\u2019t linear, and hard days don\u2019t mean you\u2019ve gone backwards. But it\u2019s real. It\u2019s possible. And it looks like a thousand small, ordinary moments coming back to you \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-25", "rank": 61}, {"handle": "dragana.jasprica", "title": "When Erin came to us, she\u2019d been working with a bodybuilding coach, stuck on a fat loss plan at 1800 calories for two YE", "views": 3191, "comments": 1, "likes": 14, "outlier": 0.07, "followers": 42593, "video_url": "https://www.instagram.com/p/DbqhPJihaW1/", "audio_url": "https://www.instagram.com/reels/audio/178714732818051/", "hook": "", "transcript": "", "caption": "When Erin came to us, she\u2019d been working with a bodybuilding coach, stuck on a fat loss plan at 1800 calories for two YEARS. \ud83e\udee0\n\u00a0\n5x lifting sessions and 5x cardio sessions a week. She was exhausted, and her body hadn\u2019t changed in months.\n\u00a0\nSo the first thing we did felt completely backwards to her.\n\u00a0\n\ud83d\udcc8 We increased her food intake strategically over months UP to 2700 calories.\n\u00a0\n\ud83d\udcc9 And we PULLED her training back to four lifts and one cardio session.\n\u00a0\nRead that again.\nShe ate more and trained less.\n\u00a0\nAnd yeah, the scale ticked up for a few weeks. She had to sit in that discomfort, eating more than she had in YEARS, watching the number go the \u201ewrong\u201c way, and trust us anyway.\n\u00a0\nThat\u2019s the hardest part, and she did it. \ud83d\udc4f\ud83c\udffc\n\u00a0\nThen things started to turn around.\n\u00a0\n\u2705 Her energy came back.\n\u00a0\n\u2705 Her digestion improved.\n\u00a0\n\u2705 The constant food noise in her head quieted down.\n\u00a0\n\u2705 And slowly, the guilt she felt about eating more started to fade, because she could see it was working.\n\u00a0\nWe\u2019d spent those months building her back up so she had something to work with.\n\u00a0\nAnd THEN, off that stronger, well-fueled base, we ran a real fat loss phase. The one that finally leaned out her legs, for the first time in her life.\n\u00a0\n18 months later, at 45, she stood in front of a camera for her first ever bikini shoot, with the most defined legs she\u2019s ever had.\n\u00a0\nHere\u2019s the lesson for you:\n\u00a0\nShe didn\u2019t fail for 2 years because she wasn\u2019t disciplined enough. She was doing MORE than almost anyone.\n\u00a0\nShe failed because more was never the answer. What she\u2019d never had was a clear strategy.\n\u00a0\nSomeone to look at her whole situation and map out the right things, in the right order, for HER body.\n\u00a0\nIf you\u2019re done doing MORE and getting nowhere, and you want someone to look at your whole situation and map out the right strategy for YOUR body\u2026\n\u00a0\n\ud83d\udcac DM me \u201cREADY\u201c and let\u2019s talk.", "trigger": ["Results & Testimonials"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-05", "rank": 62}, {"handle": "dragana.jasprica", "title": "But first\u2026 here\u2018s what I would NOT do:", "views": 3132, "comments": 0, "likes": 21, "outlier": 0.07, "followers": 42593, "video_url": "https://www.instagram.com/p/Dbz2kLjBPpM/", "audio_url": "https://www.instagram.com/reels/audio/1043158638087411/", "hook": "", "transcript": "", "caption": "But first\u2026 here\u2018s what I would NOT do:\nI would not cut.\n\nHere\u2019s what I\u2019d do first \u2935\ufe0f\n\nResist the urge to drop my calories.\nResist the urge to add more cardio.\nMatch my strategy to my body.\n\nYou\u2019ve been lifting for years. You\u2019ve been tracking. You\u2019ve been \u201ein a deficit\u201c on and off since 2019.\n\nBut the weekends are always a little loose. The work trip throws you off. The dinners out add up. And your body still doesn\u2019t reflect any of the work.\n\nYou think the answer is to cut harder. Be tighter on the weekends. Add another cardio session. Be more disciplined this time.\n\nYou\u2019re wrong.\n\nThe reason 5 years of cuts haven\u2019t gotten you lean isn\u2019t your discipline. \n\nIt\u2019s that you\u2019ve been running a strategy your body never fully committed to. Cuts that never quite worked. Weekends that pulled you back to maintenance. Years stuck in the gray zone between cutting and maintaining. What the industry sells you as \u201dbody recomp.\u201c\n\nThe problem isn\u2019t you. It\u2019s the strategy you\u2019ve been handed.\n\nSo the first thing I\u2019d do isn\u2019t another cut. It\u2019s a proper assessment of exactly where your body is, then designing the next 12 months from there.\n\nI\u2019d match your strength and cardio to the state your body is actually in, instead of stacking random sessions on top of each other. I\u2019d prime your metabolism first and map out a personalized roadmap for where you want to be in 12 months.\n\nThen, and only then, a real fat loss phase. The right deficit. The right fuel. The right length of time. Macros adjusted to where your body is actually responding, week by week. \ud83c\udfaf\n\nWhen you stop cutting for the trip in 4 weeks and start running real phases with a long-term strategy, THAT\u2019S when you build a physique that drops jaws a year from now, babe. \u2764\ufe0f\u200d\ud83d\udd25", "trigger": ["Speak to Gaps and Mistakes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-09", "rank": 63}, {"handle": "elle.hypnotherapy", "title": "I\u2019m talking to the mom who\u2019s tried everything. The one with a folder full of workbooks, a string of well-meaning therapi", "views": 3087, "comments": 0, "likes": 45, "outlier": 0.37, "followers": 8355, "video_url": "https://www.instagram.com/p/Dbi5ufVtMbp/", "audio_url": "https://www.instagram.com/reels/audio/1952286501490027/", "hook": "", "transcript": "", "caption": "I\u2019m talking to the mom who\u2019s tried everything. The one with a folder full of workbooks, a string of well-meaning therapists, and a quiet, growing fear that she\u2019s the one who can\u2019t be fixed. I know her well\u2026she books calls with me every week. Eighteen months out, back at a job she never got to grieve around, replaying every detail of what happened, wondering if she could\u2019ve done something differently. Mama, if that\u2019s you, please hear this. You were never the problem. Most of what you\u2019ve tried works on the conscious mind\u2026the part of you that already knows it wasn\u2019t your fault. But the guilt doesn\u2019t live there. The trauma doesn\u2019t live there. They live deeper, in a part of the mind that logic simply can\u2019t reach. That\u2019s where my work is different. I\u2019m the only Superconscious grief therapist in the world specialising in baby loss\u2026and I built this because the standard options failed me too. The moms who arrived feeling like lost causes? They\u2019re the exact moms whose results now surprise even me. You\u2019re not beyond help. You\u2019ve just never been given the right kind \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-02", "rank": 64}, {"handle": "guy_finocchiaro", "title": "I\u2019ve walked a lot of people out of serious tax debt, and the ones who make it share something before anything else.", "views": 3022, "comments": 0, "likes": 10, "outlier": 2.74, "followers": 1103, "video_url": "https://www.instagram.com/p/DbR4HgdRGUy/", "audio_url": "https://www.instagram.com/reels/audio/299091193198323/", "hook": "", "transcript": "", "caption": "I\u2019ve walked a lot of people out of serious tax debt, and the ones who make it share something before anything else.\n\nThey stop hiding the numbers from the person trying to help them.\n\nThey hand over the messy bank statements, the years they\u2019re embarrassed about, the income they underreported, because I can\u2019t build a real case on a version that\u2019s been cleaned up for me.\n\nThe IRS decides what you pay based on your real financial picture, so the second you go vague with me, the strategy gets weaker.\n\nThe clients who get out fastest put everything on the table on day one and let me work from the truth.\n\nIt\u2019s uncomfortable for about ten minutes, and then it\u2019s the reason everything starts moving.\n\nComment PLAN and let\u2019s map out your way out.", "trigger": ["Tap into Identity"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-27", "rank": 65}, {"handle": "ameliesadvicee", "title": "if alignment feels like something you keep chasing without landing, comment \u201cCHART\u201d and let\u2019s look at what your chart is", "views": 2889, "comments": 4, "likes": 83, "outlier": 0.07, "followers": 43033, "video_url": "https://www.instagram.com/p/DbLwZ78OWd_/", "audio_url": "https://www.instagram.com/reels/audio/27748197218199727/", "hook": "Feeling aligned in your body, your style, and your work is going to start with these three placements.\nWhen people say they want alignment, it can be kind of a floaty term, but usually what they mean is they want their daily experiences to match what they know is true about themselves.\nTo feel good.\nThe reason that keeps not happening is because they're working on each area separately instead of from the source.\nFor the body, this starts in the sixth house.\nThis is your digestion, your daily routines, nutrition, what your physical body is going to run on best on a daily basis.\nHow much structure you need, how much variety, what rhythm is going to feel good.\nFor your style, your venus and rising sign together.\nVenus is the aesthetic that you are drawn to and what makes you magnetic.\nRising sign is that energetic first impression you leave on people and it also dictates some of your physical features.\nWhen those two align, you actually feel good in what you're wearing and this isn't to put you in a box, this is to highlight those traits about you that are already so attractive.\nFor work, it's going to be mostly your midheaven and your north node because your midheaven is the legacy that you're meant to leave behind, what you're going to be known for in career and your north node is your life purpose, what's going to fulfill you.\nMost of the misalignment that I see comes from using one area of logic to mismanage another.\nOperating from your south node, the talents you already have and not feeling fulfilled or like you're growing towards anything, feeling stuck.\nInstead of using your north node to go towards what's a little bit scary but deeply fulfilling.\nAll of these placements are usually the number one things I'm going to at in your chart when I sit down with you.\nOf course the rest matters and the aspects, the houses, all of that but getting these parts of yourself into alignment is the fastest way to feel better and see results.", "transcript": "Feeling aligned in your body, your style, and your work is going to start with these three placements.\nWhen people say they want alignment, it can be kind of a floaty term, but usually what they mean is they want their daily experiences to match what they know is true about themselves.\nTo feel good.\nThe reason that keeps not happening is because they're working on each area separately instead of from the source.\nFor the body, this starts in the sixth house.\nThis is your digestion, your daily routines, nutrition, what your physical body is going to run on best on a daily basis.\nHow much structure you need, how much variety, what rhythm is going to feel good.\nFor your style, your venus and rising sign together.\nVenus is the aesthetic that you are drawn to and what makes you magnetic.\nRising sign is that energetic first impression you leave on people and it also dictates some of your physical features.\nWhen those two align, you actually feel good in what you're wearing and this isn't to put you in a box, this is to highlight those traits about you that are already so attractive.\nFor work, it's going to be mostly your midheaven and your north node because your midheaven is the legacy that you're meant to leave behind, what you're going to be known for in career and your north node is your life purpose, what's going to fulfill you.\nMost of the misalignment that I see comes from using one area of logic to mismanage another.\nOperating from your south node, the talents you already have and not feeling fulfilled or like you're growing towards anything, feeling stuck.\nInstead of using your north node to go towards what's a little bit scary but deeply fulfilling.\nAll of these placements are usually the number one things I'm going to at in your chart when I sit down with you.\nOf course the rest matters and the aspects, the houses, all of that but getting these parts of yourself into alignment is the fastest way to feel better and see results.", "caption": "if alignment feels like something you keep chasing without landing, comment \u201cCHART\u201d and let\u2019s look at what your chart is actually showing you.\n\n#astrologypost #birthchart #alignment", "trigger": [], "format": "Short Form Video", "style": "Talking Head", "division": "talking_head", "posted": "2026-07-24", "rank": 66}, {"handle": "corinne.naturopath", "title": "If you're doing everything right and still feel stuck, it might be because your body is too busy defending itself to eve", "views": 2750, "comments": 0, "likes": 28, "outlier": 0.78, "followers": 3531, "video_url": "https://www.instagram.com/p/DbOPXyHimhV/", "audio_url": "https://www.instagram.com/reels/audio/37075726002074118/", "hook": "", "transcript": "", "caption": "If you're doing everything right and still feel stuck, it might be because your body is too busy defending itself to ever get around to repair.\n \nWhen it's fighting inflammation from foods it reacts to, or from a life that's asking too much of it, healing keeps getting pushed to the bottom of the list, no matter how good your protocol looks on paper.\n \nI spend a lot of my time figuring out what's keeping that fight switched on, because until it settles, your body never gets a calm enough window to rebuild.", "trigger": ["Narrate Desired Outcomes"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-25", "rank": 67}, {"handle": "elle.hypnotherapy", "title": "You already know the date. It\u2019s circled in your body, if not on your calendar. And some part of you started bracing week", "views": 2730, "comments": 6, "likes": 72, "outlier": 0.33, "followers": 8355, "video_url": "https://www.instagram.com/p/DbvxnKStsP4/", "audio_url": "https://www.instagram.com/reels/audio/26280495481642475/", "hook": "", "transcript": "", "caption": "You already know the date. It\u2019s circled in your body, if not on your calendar. And some part of you started bracing weeks ago. The due date that never got its birth. The anniversary. The birthday that should be loud with toddler noise. Whichever one is coming for you\u2026it\u2019s coming. And I\u2019d rather talk about it now than the night before. Because every year I watch my moms try to face the hardest date of their year with no plan and no support. Just gritted teeth, hoping it lands on a weekend. And every year, the dread eats the month before. The day flattens them. The recovery takes the month after. One date\u2026three months of hurting. Mama, it doesn\u2019t have to go that way. With the right support in place beforehand, the day changes shape. Still sad. Still theirs. But held. The moms I\u2019ve walked through this tell me the same thing\u2026the dread was the biggest thing that shrank. Getting support before the hard dates isn\u2019t dramatic. It\u2019s the kindest bit of planning a loss mom can do. You know your date. Get ahead of it this year \ud83e\udd0d Comment \u201cMETHOD\u201d below and I\u2019ll send you the details. #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": ["Villains & Differentiation"], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-08-07", "rank": 68}, {"handle": "themindful_mindset", "title": "The advice is everywhere. Spice it up, they say, or schedule intimacy, or book a babysitter and a nice dinner. All of it", "views": 2572, "comments": 2, "likes": 15, "outlier": 0.05, "followers": 52238, "video_url": "https://www.instagram.com/p/DbWU9PQpoNX/", "audio_url": "https://www.instagram.com/reels/audio/1303575045232622/", "hook": "", "transcript": "", "caption": "The advice is everywhere. Spice it up, they say, or schedule intimacy, or book a babysitter and a nice dinner. All of it written by someone who\u2019s never been a woman lying in bed at 9pm with a body still humming from the day, doing the math on whether she has one more performance in her. That\u2019s what it becomes when your system is in survival, a performance, one more thing to deliver before you\u2019re allowed to be off duty. When my own sex life died, what I felt was resentment, plain and loud, and trying harder at romance was never going to touch it. Desire can\u2019t share a room with pressure, and every scheduled, effortful attempt at fixing the bedroom adds pressure, which is why that math never works no matter how nice the restaurant is. The work sits upstream of the bedroom, in the load you carry and the nervous system underneath it. It looks like presence before pursuit, and touch without expectation, and a body that gets to exhale before anyone asks it for anything. Fix the bracing and the bedroom follows. Curious? Comment \u201cBODY\u201d below. Your body already knows the way. If you\u2019ve been living in your head and craving deeper connection,this is where you shift from obligation to pleasure. Follow @TiffanyTaylorCoaching for self love, nervous system safety, embodied intimacy, and feminine reclamation.", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-28", "rank": 69}, {"handle": "dragana.jasprica", "title": "A real fat loss phase has a start date and an end date. PERIOD.", "views": 2538, "comments": 0, "likes": 17, "outlier": 0.06, "followers": 42593, "video_url": "https://www.instagram.com/p/DbTPePgFi-b/", "audio_url": "https://www.instagram.com/reels/audio/27545032998522308/", "hook": "", "transcript": "", "caption": "A real fat loss phase has a start date and an end date. PERIOD.\n\nAnd both are decided before you ever start.\n\nYou commit to 12 weeks. 16. Six months at the very most. You go all in, and then you LEAVE.\n\nMost fat loss phases start like this: \"I want to lose fat, let me plug my numbers into a calculator, take off 500 calories, start Monday.\"\n\nYou never knew how to set a weight loss target in the first place, or your weekly rate of loss, or how long the phase should even run.\n\nAnd then how to set your training and nutrition to actually get you there.\n\nSo months go by. Fat loss is sloooow like a turtle. The cravings are relentless. And you're exhausted.\n\nMost women who come to us were sold fat loss they could live in forever. Two years on a fat loss meal plan, strict Monday to Friday, and then the weekend brings her right back to maintenance. So across the week, nothing happened at all.\n\nBecause that's what she's being sold. Fat loss where you keep the drinks on the weekend. Keep the pizza. Keep the burgers. Nothing has to change. \ud83c\udf79\ud83c\udf54\n\nHere's how it actually works \ud83d\udc47\ud83c\udffc\n\nYour rate of loss target is around 0.8% of your bodyweight per week. Fast enough that you can see it happening, controlled enough that you keep every bit of muscle you've built.\n\nYour training keeps progressing. You're still adding weight to the bar, in a deficit, because that's what tells your body to hold onto the muscle you're trying to reveal.\n\nYour cardio gets dialed in to support your recovery, so you can keep training hard while you're eating less.\n\nAnd your strength doesn't drop. It goes UP. Eva hit a 72.5kg squat PB in the last week of her fat loss phase, up from 45kg when she started.\n\nEvery week we look at your data. Your weight trend. Your lifts. Your measurements. Your photos.\n\nNot to panic over one number that feels off. And not to shrug and see how it goes either.\n\nWe look, and we make a call. So four weeks don't just quietly pass with nothing happening.\n\nThen when it ends, you reve", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-27", "rank": 70}, {"handle": "elle.hypnotherapy", "title": "Last week I laughed so hard at my three year olds car obsession that I cried. Ten minutes later I was crying for a compl", "views": 2504, "comments": 1, "likes": 53, "outlier": 0.3, "followers": 8355, "video_url": "https://www.instagram.com/p/DbYmgq4tFsL/", "audio_url": "https://www.instagram.com/reels/audio/659718145130460/", "hook": "", "transcript": "", "caption": "Last week I laughed so hard at my three year olds car obsession that I cried. Ten minutes later I was crying for a completely different reason\u2026because his brothers and sister should\u2019ve been there laughing too. Both of these moments were real. And neither one cancelled the other out. Nobody explains this part of life after loss. You think you have to pick a lane. Either you\u2019re grieving properly, or you\u2019re happy therefore \u201cover it.\u201d So every laugh comes with a wave of guilt right behind it. But grief doesn\u2019t work like a scale, mama. Joy on one side doesn\u2019t mean less love on the other. You can decorate for autumn with one hand and hold your babies memory in the other. You can feel hopeful about the future and miss them desperately in the same breath. My clients hit this milestone and it surprises them every time\u2026the first moment they feel joy without punishing themselves for it. That\u2019s your heart getting big enough to hold both. Nothing about it is moving on. Sonny\u2019s siblings are part of every happy moment in this house. The joy doesn\u2019t push them out. It keeps them in \ud83e\udd0d #pregnancyloss #babyloss #stillbirth #lossmom #infantloss", "trigger": [], "format": "Short Form Video", "style": "B - Roll + Text", "division": "broll", "posted": "2026-07-29", "rank": 71}, {"handle": "corinne.naturopath", "title": "Her labs confirmed it months later, but her body told the story first. If you want the order these came back in, comment", "views": 2487, "comments": 0, "likes": 7, "outlier": 0.7, "followers": 3531, "video_url": "https://www.instagram.com/p/Dbtb-dcgs_Z/", "audio_url": "https://www.instagram.com/reels/audio/2771379724
